es it', emotion, vague.","ex":["I real, II popularity","Only I"],"tr":["Both serious & relevant","Both strong"],"sec":15}},{"name":"Assertion and Reason","idea":"Judge A and R separately first, then ask whether R explains A.","steps":["Is A true? Is R true?","If both are true: does R give the cause of A? Yes → option 1; no → option 2.","A true, R false → option 3. A false, R true → option 4."],"ex":{"q":"A: Mercury is used in thermometers. R: Mercury is a non-metal.","s":["A is true.","R is false — mercury is a metal (the only liquid metal at room temperature).","A true, R false."],"a":"A true, R false"},"tr":{"q":"A: Nights are cooler when the sky is clear. R: Clouds trap heat radiated by the Earth.","s":["A is true.","R is true and explains why cloudy nights are warmer.","Both true, R explains A."],"o":["A true, R false","Both true, R explains A","A false, R true","Both true, R does not explain A"],"a":1},"fast":{"trick":"Check A, check R, then read 'A because R' — if it sounds right, R explains A.","ex":["Mercury is a metal → R false","A true, R false"],"tr":["Cooler because no clouds trap heat ✔","R explains A"],"sec":20}}]},"r8":{"title":"Data sufficiency, Venn & data interpretation","sec":"Reasoning","why":"3–7 questions (2018 had a full DI set).","method":["DS: test I alone, then II alone, then both together. Do not solve fully — only check if ONE answer is possible.","Venn (two sets): total = A + B − both + neither.","Three sets: count ‘only’ regions first, then pairs, then all three.","DI: compute only what is asked; percentage change = change ÷ OLD value × 100."],"tips":["DS trap: x² = 49 gives two answers — not sufficient alone.","Days–Weeks–Years = concentric circles; Doctors–Men–Fathers = Fathers inside Men, Doctors overlapping."],"facts":[["2016 Q20, Q22","Captain’s age; panel interviews"],["2018 Q74–76","Data sufficiency set"],["2018 Q95–100","Table and Venn-based DI"]],"ex":["Is N divisible by 6? I. N divisible by 3. II. N is even.",["I alone: 9 is divisible by 3 but not 6 → not enough.","II alone: 4 is even but not divisible by 6 → not enough.","Together: divisible by 2 and 3 → yes. Both are needed."]],"qs":["q153","q154","q155","q156","q157","q158","q159","q160"],"day":"d1","models":[{"name":"Data sufficiency","idea":"You do not need the answer — only whether ONE definite answer is possible.","steps":["Test I alone. Test II alone. Then test both together.","If a statement allows two answers (e.g. x² = 49), it is not sufficient.","Choose: I alone / II alone / either alone / both together / not even both."],"ex":{"q":"Is N divisible by 6? I. N is divisible by 3. II. N is even.","s":["I alone: 9 works and 12 works — two answers.","II alone: 4 and 6 — two answers.","Together: divisible by 2 and 3 → yes. Both needed."],"a":"Both together"},"tr":{"q":"Speed of a train? I. It crosses a 200 m platform in 20 s. II. It crosses a pole in 12 s.","s":["I: L + 200 = 20v (two unknowns). II: L = 12v.","Together: 12v + 200 = 20v → v = 25 m/s.","Both needed."],"o":["Both together needed","Not even both","II alone","I alone"],"a":0},"fast":{"trick":"Don't solve fully — only ask: is ONE value fixed?","ex":["Alone: two cases each; together: 2 & 3 → 6","Both together"],"tr":["2 equations, 2 unknowns","Both together"],"sec":20}},{"name":"Two-set Venn counting","idea":"Those in both groups are counted in each group, so subtract them once.","steps":["Total = A + B − Both + Neither.","Only A = A − Both; Only B = B − Both."],"ex":{"q":"50 students: 30 like tea, 25 like coffee, 10 like both. How many like neither?","s":["At least one = 30 + 25 − 10 = 45.","Neither = 50 − 45.","= 5."],"a":"5"},"tr":{"q":"In a group of 60, 35 play cricket, 30 play football and 10 play neither. How many play both?","s":["At least one = 50.","50 = 35 + 30 − Both.","Both = 15."],"o":["5","10","25","15"],"a":3},"fast":{"trick":"Total = A + B − Both + Neither.","ex":["30 + 25 − 10 = 45","50 − 45 = 5"],"tr":["35 + 30 − Both = 50","Both = 15"],"sec":10}},{"name":"Three-set Venn (only, two, all three)","idea":"With three groups, work from the regions: only one game, exactly two, all three.","steps":["Total in a group = its ‘only’ + its pair regions + all-three region.","‘At least two’ = all pair-only regions + all three.","Read only the regions the question asks for."],"ex":{"q":"V only 12, F only 15, C only 10, V&F only 6, F&C only 5, V&C only 4, all three 3. How many play at least two games?","s":["Pair-only regions: 6 + 5 + 4 = 15.","Add all three: 15 + 3.","= 18."],"a":"18"},"tr":{"q":"Using the same data, how many play Cricket?","s":["C only 10 + F&C 5 + V&C 4 + all three 3.","= 22.","22."],"o":["25","10","22","19"],"a":2},"fast":{"trick":"Write the 7 regions once; add only the regions asked.","ex":["6 + 5 + 4 + 3","18"],"tr":["10 + 5 + 4 + 3","22"],"sec":15}},{"name":"Venn diagram classification","idea":"Decide how the three groups relate: one inside another, overlapping, or separate.","steps":["‘All X are Y’ → X inside Y.","‘Some X are Y’ → overlap.","Nothing in common → separate."],"ex":{"q":"Days, Weeks, Years — which diagram?","s":["Days make up weeks; weeks make up years.","Each fits fully inside the next.","Three concentric circles."],"a":"Concentric circles"},"tr":{"q":"Doctors, Men, Fathers — best description?","s":["All fathers are men → Fathers inside Men.","Some doctors are men/fathers, some are women.","Doctors overlap both."],"o":["Doctors inside Men","Fathers inside Men; Doctors overlapping both","Men inside Fathers","Three separate circles"],"a":1},"fast":{"trick":"For each pair ask: are ALL X also Y? → inside; some → overlap; none → separate.","ex":["Day ⊂ week ⊂ year","Concentric"],"tr":["Fathers ⊂ men; doctors partly","Fathers inside Men, Doctors overlap"],"sec":15}},{"name":"Data interpretation (tables)","idea":"Read only the numbers you need. Percentage change is always on the OLD value.","steps":["% change = (new − old)/old × 100.","Average = total ÷ number of items.","Ratio of two values: divide and simplify."],"ex":{"q":"Sales (₹ thousand): 2022 40, 2023 50, 2024 45, 2025 60. % increase 2024→2025?","s":["Change = 60 − 45 = 15.","15/45 × 100.","= 33.33%."],"a":"33.33%"},"tr":{"q":"Using the same table, % increase from 2022 to 2023?","s":["Change = 10.","10/40 × 100.","= 25%."],"o":["25%","50%","20%","10%"],"a":0},"fast":{"trick":"% change = change ÷ OLD. Use fractions: 1/3 = 33.33%, 1/4 = 25%.","ex":["15/45 = 1/3","33.33%"],"tr":["10/40 = 1/4","25%"],"sec":10}}]},"g1":{"title":"Telangana Movement — Phase I (1948–1970)","sec":"General Studies","why":"Telangana is the biggest GS block (~23 questions).","method":["Learn each event as YEAR + EVENT + ONE PERSON.","1948 Operation Polo (J.N. Chaudhuri) → 1952 Mulki agitation (Burgula) → 1953–55 SRC (Fazal Ali, Para 386) → 20 Feb 1956 Gentlemen’s Agreement → 1 Nov 1956 Andhra Pradesh (Sanjeeva Reddy) → 1958 Regional Committee (Achyuta Reddy) → 1969 Jai Telangana (KTPS, TPS, Chenna Reddy).","Questions are usually ‘match’, ‘arrange in order’ or ‘which is NOT correct’."],"tips":["Gentlemen’s Agreement ‘8 men, 60-40’: 4 + 4 signatories, cabinet 60:40.","‘Sixth finger’ = Sanjeeva Reddy’s name for the Deputy CM post.","SRC trio: ‘Fazal–Panikkar–Kunzru’ → FPK."],"facts":[["Gentlemen’s Agreement","20 Feb 1956 — asked in 2016, 2018 and 2022"],["SRC report","30 Sep 1955, Para 386"],["1969 spark","KTPS Kothagudem — asked 2018, 2022"],["TPS 1971","10 of 14 Lok Sabha seats"]],"ex":["Under the Gentlemen’s Agreement, which statement is NOT correct? (2016 pattern)",["Correct: Regional Council; Mulki rules; Telangana surplus spent in Telangana.","Cabinet ratio was 60:40, not 50:50.","So the ‘50:50 cabinet’ statement is wrong."]],"qs":["q161","q162","q163","q164","q165","q166","q167","q168"],"day":"d7"},"g2":{"title":"Hyderabad State & Nizam-era movements","sec":"General Studies","why":"Feeds 3–5 questions in the Telangana block.","method":["Order: 1901 Library movement → 1919 Mulki firman → 1921 Andhra Jana Sangham → 1930 Andhra Mahasabha (Jogipet) → 1935 Nizam Subjects League → 1938 State Congress & Vandemataram → 1946–51 Armed Struggle → 1948 Operation Polo.","Pair every leader with one word: Komaram Bheem – Jal Jangal Zameen; Ramji Gond – 1860; Turrebaz Khan – 1857; Chakali Ailamma – land struggle; Doddi Komaraiah – first martyr 1946."],"tips":["Newspapers: Golconda Patrika (Suravaram), Imroz (Shoebullah Khan), Rayyat (Mandumula Narsing Rao), Meezan (asked 2016).","‘1-2-3-3-4’: 1901, 1921, 1930, 1938, 1946 — the five big Nizam-era years."],"facts":[["Andhra Mahasabha 1930","Jogipet, Suravaram Pratapa Reddy"],["State Congress 1938","Swami Ramananda Tirtha"],["Razakars","Qasim Razvi"],["Military Governor","Maj. Gen. J.N. Chaudhuri"]],"ex":["Who edited ‘Imroz’ and was killed by the Razakars in 1948? (2022)",["Imroz was an Urdu daily that opposed the Razakars.","Its editor was attacked on 21–22 August 1948.","Answer: Shoebullah Khan."]],"qs":["q169","q170","q171","q172","q173","q174","q175","q176"],"day":"d7"},"g3":{"title":"Telangana Movement — Phases II & III (1971–2014)","sec":"General Studies","why":"Most final-phase dates are asked as ‘arrange in order’.","method":["1971 TPS wins 10/14 → 1972 Jai Andhra → 1973 Six-Point Formula (Art 371-D) → 1975 Presidential Order → 1985 G.O. 610 → 1997 Bhongir Declaration → 2001 TRS, Girglani → 2009 KCR fast (29 Nov) & 9 Dec statement → 2010 Srikrishna (report 30 Dec) → 2011 Million March, Sakala Janula Samme → 2012 Sagara Haram → 2013 Chalo Assembly, CWC, GoM (Shinde) → 2014 LS 18 Feb, State 2 June."],"tips":["Final-phase order: ‘Million → Samme → Sagara → Chalo’ (M-S-S-C, 2011, 2011, 2012, 2013).","Committees: Bhargava & Wanchoo (1969), Jayabharat Reddy (1984), Girglani (2001), Srikrishna (2010), Antony & GoM (2013)."],"facts":[["TRS","27 April 2001, Jaladrushyam"],["JAC convenor","Prof. Kodandaram"],["Srikrishna report","30 Dec 2010"],["Bill","LS 18 Feb, RS 20 Feb, assent 1 Mar 2014"]],"ex":["Arrange: Sagara Haram, Million March, Chalo Assembly, Sakala Janula Samme.",["Million March: 10 Mar 2011.","Sakala Janula Samme: from 13 Sep 2011; Sagara Haram: 30 Sep 2012.","Chalo Assembly: 14 Jun 2013 → M, S, S, C."]],"qs":["q177","q178","q179","q180","q181","q182","q183","q184"],"day":"d6"},"g4":{"title":"Telangana culture, heritage & geography","sec":"General Studies","why":"5 questions in 2016 on culture alone.","method":["Festivals: Bathukamma, Bonalu (State festivals); Medaram (Koya, Mulugu); Nagoba (Gonds, Keslapur).","Crafts: Pochampally ikat, Gadwal & Narayanpet sarees, Nirmal toys, Cheriyal scrolls, Karimnagar silver filigree, Pembarthi brass, Dokra (Adilabad).","Monuments: Thousand Pillar Temple (1163), Ramappa (1213, UNESCO 2021), Charminar (1591).","Geography: Godavari enters at Kandakurthi; Krishna at Thangadi; highest peak Doli Gutta; tiger reserves Amrabad and Kawal."],"tips":["State symbols ‘PJJT’: Palapitta (bird), Jinka (animal), Jammi (tree), Tangedu (flower).","Poets: Kaloji (Naa Godava, 9 Sep), Dasarathi (Agnidhara), Andesri (Jaya Jayahe Telangana)."],"facts":[["State song","Jaya Jayahe Telangana — Andesri (2024)"],["Ramappa","Palampet, Mulugu"],["Nizam Sagar","Manjira river"],["Smallest district","Hyderabad; largest Bhadradri Kothagudem"]],"ex":["Which craft–place pair is wrong: Pembarthi–brass, Nirmal–toys, Cheriyal–scrolls, Karimnagar–Bidri?",["Pembarthi, Nirmal, Cheriyal pairs are correct.","Karimnagar is famous for silver filigree.","Bidri ware is from Bidar → the Karimnagar pair is wrong."]],"qs":["q185","q186","q187","q188","q189","q190","q191","q192"],"day":"d6"},"g5":{"title":"Ancient India","sec":"General Studies","why":"About 6 questions a paper.","method":["Mahajanapadas with capitals (asked every year): Magadha–Rajagriha, Kosala–Sravasti, Vatsa–Kausambi, Avanti–Ujjayini, Vajji–Vaishali, Anga–Champa, Gandhara–Taxila, Assaka–Potali/Bodhan.","Buddhist councils: Rajagriha (Ajatashatru) → Vaishali (Kalasoka) → Pataliputra (Ashoka) → Kashmir (Kanishka).","Authors: Kautilya–Arthashastra, Kalhana–Rajatarangini, Bana–Harshacharita, Vishakhadatta–Mudrarakshasa, Aryabhata–Aryabhatiya, Hala–Gathasaptasati."],"tips":["Councils ‘R-V-P-K’ with kings ‘A-K-A-K’ (Ajatashatru, Kalasoka, Ashoka, Kanishka).","Chinese travellers by king: Fa-Hien–Chandragupta II, Hiuen Tsang–Harsha, I-Tsing–late 7th century."],"facts":[["Assaka","Only Mahajanapada south of the Vindhyas (Bodhan, Telangana)"],["Saptanga","Swami, Amatya, Janapada, Durga, Kosha, Danda, Mitra"],["Mandasor","Vatsabhatti"],["Allahabad pillar","Harisena"]],"ex":["Which Mahajanapada–capital pair is wrong: Kosala–Sravasti, Vatsa–Kausambi, Avanti–Ujjayini, Assaka–Vaishali?",["First three pairs are correct.","Vaishali was the capital of Vajji.","Assaka’s capital was Potali/Bodhan → last pair is wrong."]],"qs":["q193","q194","q195","q196","q197","q198","q199","q200"],"day":"d5"},"g6":{"title":"Medieval & Modern India","sec":"General Studies","why":"About 10 questions a paper.","method":["Delhi Sultanate: Slave → Khilji → Tughlaq → Sayyid → Lodi. Balban = Zil-i-Ilahi; Alauddin = market control; MBT = token currency.","Deccan: Bahmani 1347 → five sultanates; Qutb Shahis 1518–1687 (Charminar 1591).","British: Permanent Settlement (Cornwallis 1793), Ryotwari (Munro), Mahalwari (Mackenzie); Sati banned 1829 (Bentinck).","National movement: associations 1852–1885 → INC 1885 → League 1906 → Lucknow Pact 1916 → Bardoli 1928 → Dandi 1930 → Quit India 1942."],"tips":["Sultanate order ‘SKTSL’ = Slave, Khilji, Tughlaq, Sayyid, Lodi.","Associations ‘M-P-I-B’: Madras Native (1852), Poona Sabha (1870), Indian Assn (1876), Bombay Presidency (1885)."],"facts":[["Khanwa 1527","Hasan Khan Mewati joined Rana Sanga"],["Goa 1510","Taken from Bijapur"],["INA trials","Bhulabhai Desai, Nehru, Sapru — not Gandhi"],["Bardoli 1928","22% revenue hike"]],"ex":["Arrange: Lucknow Pact, Direct Action Day, Muslim League founded, Deliverance Day. (2022)",["League 1906.","Lucknow Pact 1916 → Deliverance Day 1939.","Direct Action Day 1946 → order: League, Pact, Deliverance, Direct Action."]],"qs":["q201","q202","q203","q204","q205","q206","q207","q208"],"day":"d5"},"g7":{"title":"Geography — India & World","sec":"General Studies","why":"About 16 questions a paper.","method":["Monsoon: SW monsoon reaches Kerala first (~1 June), gives ~75% of rain; NE monsoon → Tamil Nadu; Western Disturbances → winter rain in the north-west.","Rivers: Narmada (between Vindhya-north and Satpura-south) and Tapi flow west in rift valleys and form estuaries.","Passes: Zoji La (Ladakh), Shipki La (HP), Mana/Niti/Lipulekh (Uttarakhand), Nathu La (Sikkim), Bomdi La (Arunachal).","Census 2011: most urbanised Goa; literacy Kerala 94%; sex ratio 943.","World: Doldrums (equator), Horse latitudes (30–35°), Sirocco (Sahara), Loo (India), Chinook (Rockies)."],"tips":["Doabs ‘BBRC’ from east: Bist (Beas–Sutlej), Bari (Beas–Ravi), Rechna (Ravi–Chenab), Chaj (Chenab–Jhelum).","Soils: Black–basalt–cotton; Karewa–saffron; Laterite–leaching."],"facts":[["Most urbanised (2011)","Goa 62.2%; big State: Tamil Nadu"],["Forest cover","Madhya Pradesh largest"],["Zawar","Zinc"],["Oldest fold mountains","Aravallis"]],"ex":["A: Narmada and Tapi form estuaries. R: They carry no sediment. (2016, 2018)",["A is true — they flow through rift valleys and hard rock.","R is false — they do carry some sediment.","Answer: A true, R false."]],"qs":["q209","q210","q211","q212","q213","q214","q215","q216"],"day":"d4"},"g8":{"title":"General Science — Biology & Chemistry","sec":"General Studies","why":"About 10 science questions a paper.","method":["Vitamins: A night blindness, B1 beriberi, B3 pellagra, B12 (cobalt) anaemia, C scurvy, D rickets, K clotting.","Diseases: bacteria (typhoid, TB, cholera), virus (polio, dengue, AIDS, chicken pox), protozoa (malaria, kala-azar), fungus (ringworm).","Cells: apoptosis = programmed death; necrosis = injury death; plasma cells make antibodies.","Chemistry: aqua regia 3 HCl : 1 HNO₃; terylene = polyester; nylon = polyamide; bakelite = thermosetting."],"tips":["Vitamin K = ‘Koagulation’ (German) — clotting.","B12 has Cobalt — ‘B-Co’."],"facts":[["2022 Q200","Vitamin K deficiency → clotting time increases"],["2016 Q105","Cobalt in B12"],["2018 Q103","Aqua regia"]],"ex":["Which pair is wrong: B1–beriberi, B3–pellagra, C–scurvy, D–night blindness?",["First three are correct.","Night blindness is from Vitamin A.","Vitamin D causes rickets → last pair is wrong."]],"qs":["q217","q218","q219","q220","q221","q222","q223","q224"],"day":"d3"},"g9":{"title":"General Science — Physics, technology & environment","sec":"General Studies","why":"Pollution and ozone were asked in all three papers.","method":["Pollution: CFCs → ozone depletion (Montreal 1987); NOx + sunlight → photochemical smog (O₃, PAN); SO₂ + smoke → London smog; phosphates → algal bloom; fluoride → fluorosis.","Electricity: ammeter in series, voltmeter in parallel; R = ρL/A.","Communication: satellites use microwaves; optical fibre works on total internal reflection; modem = modulator–demodulator.","Nuclear: Pokhran-I 1974 ‘Smiling Buddha’; Pokhran-II 1998 ‘Operation Shakti’."],"tips":["Diseases from metals: Minamata (mercury), Itai-itai (cadmium), Blue baby (nitrates).","‘Series-Ammeter, Parallel-Voltmeter’ = ‘SAP-V’."],"facts":[["2016 Q114","Methane, phosphates, freons, fluorides matched to effects"],["2022 Q186","Satellite communication"],["2022 Q187","Smiling Buddha"]],"ex":["Match: Freons → ?, Phosphates → ?, Fluorides → ? (2016)",["Freons (CFCs) → ozone depletion.","Phosphates → algal bloom in lakes.","Fluorides → knock-knee (fluorosis)."]],"qs":["q225","q226","q227","q228","q229","q230","q231","q232"],"day":"d3"},"g10":{"title":"Indian Polity","sec":"General Studies","why":"About 9 questions a paper.","method":["Know the Article → topic pairs: 3 (new States), 21A (RTE), 39A (legal aid), 51A (duties), 79 (Parliament), 110 (Money Bill), 201 (reserved bills), 243A (Gram Sabha), 279A (GST Council), 280 (Finance Commission), 324 (EC), 356 (President’s Rule), 368 (amendment), 371-D (AP/Telangana).","Amendments: 42nd (1976), 44th (1978), 52nd (1985 anti-defection), 73rd/74th (local bodies), 86th (RTE), 101st (GST).","Cases: Kesavananda (basic structure), Vishaka (workplace harassment), Indira Sawhney (OBC, 50% cap), Bommai (Art 356)."],"tips":["Emergency safeguard: ‘20-21 never done’ — Articles 20 and 21 can never be suspended.","Constitutional vs statutory: EC, FC, UPSC, CAG, NCSC, NCST are constitutional; NHRC, NCW, Lokpal are statutory."],"facts":[["Fundamental Duties","51A, 42nd Amendment, Swaran Singh Committee"],["Anti-defection","52nd Amendment; expulsion ≠ disqualification"],["President’s Rule > 1 yr","National Emergency + EC certificate"]],"ex":["Which body is NOT constitutional: EC, NCSC, NCST, NHRC? (2022)",["EC — Art 324; NCSC — Art 338; NCST — Art 338A.","NHRC was created by the Protection of Human Rights Act, 1993.","Answer: NHRC."]],"qs":["q233","q234","q235","q236","q237","q238","q239","q240"],"day":"d2"},"g11":{"title":"Indian Economy","sec":"General Studies","why":"About 8 questions — the easiest marks in GS.","method":["Plans: 1st (1951–56) agriculture; 2nd (1956–61) heavy industry (Mahalanobis); 3rd 1961–66; plan holiday 1966–69; 12th (2012–17) last.","Institutions: IMF + World Bank = Bretton Woods (1944); WTO 1995; RBI 1935; NABARD 1982.","Indices: HDI = income, health, education (UNDP); IIP = mining, manufacturing, electricity.","GST: 101st Amendment, 1 July 2017, Council Art 279A."],"tips":["Revolutions: Green–grains, White–milk, Blue–fish, Yellow–oilseeds, Golden fibre–jute, Grey–fertiliser, Pink–onion/prawn, Black–petroleum.","NITI Aayog does NOT make Five-Year Plans."],"facts":[["2016 Q163","Golden fibre, Grey, Pink, Black revolutions"],["2022 Q165–166","IMF and Bretton Woods"],["2018 Q170","NITI Aayog"]],"ex":["Which Plan–period pair is wrong: 1st 1951–56, 3rd 1966–71, 6th 1980–85, 10th 2002–07? (2016)",["1st, 6th, 10th are correct.","The 3rd Plan was 1961–66; 1966–69 were plan holidays.","So ‘3rd 1966–71’ is wrong."]],"qs":["q241","q242","q243","q244","q245","q246","q247","q248"],"day":"d2"},"g12":{"title":"Current affairs 2026 — Telangana","sec":"General Studies","why":"2018 and 2022 asked 14–17 current-affairs questions.","method":["Focus on: people in posts, budget numbers, schemes, ‘first State to…’, events held in Telangana.","Learn one number per item (₹ crore, %, date) — options usually differ only in that number."],"tips":["Governor Shiv Pratap Shukla · DGP C.V. Anand · HYDRAA A.V. Ranganath.","Budget 2026–27 ₹3,24,234 cr · per-capita ₹4,18,931 · 16th FC share 2.174%.","Latest: Kaleshwaram barrage repairs ₹4,193 cr (Nov) · Khelo India Youth Games in Hyderabad from 11 Dec."],"facts":[["Telangana Rising 2047","$1 trillion by 2034, $3 trillion by 2047"],["First in India","SC sub-classification (59 castes, 3 groups)"],["Skyroot (Hyderabad)","Vikram-1, first private orbital rocket"],["Medaram 2026","28–31 Jan, Mulugu"]],"ex":["Who is the Commissioner of HYDRAA?",["HYDRAA = Hyderabad Disaster Response and Asset Protection Agency.","Formed 19 July 2024.","Commissioner: A.V. Ranganath."]],"qs":["q249","q250","q251","q252","q253","q254","q255","q256"],"day":"d1"},"g13":{"title":"Current affairs 2026 — National, world & sports","sec":"General Studies","why":"Expect 6–8 national and sports questions.","method":["Group facts by type: appointments, awards, sports, reports & indices, schemes, economy numbers.","For sports, learn host + India’s rank + medal count."],"tips":["Asian Games 2026: India 4th, 85 medals (21 gold) · Asian Para Games 2026: record 114 (30 gold) · CWG 2026 Glasgow: 4th, 39 medals.","Nobel Peace 2026: Navi Pillay · FIFA WC 2026: Spain · Army Chief: Gen. Dhiraj Seth."],"facts":[["VB-G RAM G","125 days of work (replaced MGNREGA)"],["GDP base year","2022–23; CPI 2024"],["16th FC","Arvind Panagariya, 41% share"],["Jnanpith (60th)","R. Vairamuthu"]],"ex":["At the Asian Para Games 2026, India won how many medals?",["Held at Aichi-Nagoya, 18–24 October 2026.","India: 30 gold, 35 silver, 49 bronze.","Total 114 — a record; India finished 4th."]],"qs":["q257","q258","q259","q260","q261","q262","q263","q264"],"day":"d1"},"e1":{"title":"English grammar — agreement, tenses, articles & prepositions","sec":"English","why":"PC Prelims only: about 20 of the 25 English questions are fill-in-the-blank grammar and vocabulary (2022 Q1–20).","method":["Subject–verb agreement: find the real subject. Either/or and neither/nor → the verb follows the NEARER subject. Each, every, everyone, a pair of, the number of → singular.","Tenses: let the time word decide — now/look → present continuous; since/for → present perfect; yesterday/ago → simple past; by the time (past) → past perfect; usually/always → simple present.","Articles: ‘a’ before a consonant SOUND, ‘an’ before a vowel SOUND (an hour, an MLA, a university, a one-rupee coin).","Prepositions: learn fixed pairs — superior to, prefer A to B, interested in, good at, afraid of, married to, abide by, comply with, refrain from, since + point of time, for + period."],"tips":["Cross out phrases like ‘along with’, ‘as well as’, ‘of the boys’ — the verb agrees with what is left.","Never use present perfect with yesterday / last year / ago.","Say the word aloud: if it starts with a vowel sound, use ‘an’.","Words like superior, senior, junior, prefer take ‘to’, never ‘than’."],"facts":[["2022 Q20","Either Maya or her friend Manju ___ responsible → is (nearer subject)"],["2022 Q16","I never feel that I am superior ___ anyone → to"],["2022 Q18","She ___, I cannot disturb her now → is resting"],["2022 Q4","A pair of socks ___ been missing → has"]],"ex":["Either Maya or her friend Manju ___ responsible for the picnic plan. (2022 Q20)",["Either … or → look at the nearer subject.","Nearer subject: ‘her friend Manju’ (singular).","Answer: is."]],"qs":["q465","q466","q467","q468","q469","q470","q471","q472"],"day":"d4","models":[{"name":"Subject–verb agreement","idea":"The verb must agree with its real subject. Exams hide the subject behind ‘either/or’, ‘along with’, ‘each of’ and ‘a pair of’.","steps":["Find the real subject; cross out ‘along with …’, ‘as well as …’, ‘of the …’.","Either/or, neither/nor, not only/but also → the verb follows the NEARER subject.","Each, every, everyone, nobody, a pair of, the number of → singular verb.","A number of (= many) → plural verb. Amounts of time, money or distance as one whole → singular."],"ex":{"q":"Either Maya or her friend Manju ___ responsible for the picnic plan. (2022 Q20)","s":["Either … or → nearer subject.","Nearer subject: ‘her friend Manju’ (singular).","Singular present → is."],"a":"is"},"tr":{"q":"Neither the teacher nor the students ___ in the hall now.","s":["Neither … nor → nearer subject.","Nearer subject: ‘the students’ (plural).","Plural present → are."],"o":["is","are","has","was"],"a":1},"trap":"Choosing the verb for the FIRST subject in either/or sentences — it is always the nearer one.","fast":{"trick":"Either/or & neither/nor → verb follows the NEARER subject. Each / everyone / a pair of / the number of → singular.","ex":["Nearer subject = Manju (singular)","is"],"tr":["Nearer subject = the students (plural)","are"],"sec":10}},{"name":"Tenses from time words","idea":"In fill-in-the-blank questions the time word (now, since, yesterday, by the time, usually) tells you the tense.","steps":["Underline the time word or clue.","now / look / at present → present continuous (is/are + -ing).","since / for (still continuing) → present perfect (has/have + past participle).","yesterday / last / ago → simple past. By the time + past → past perfect (had + past participle).","usually / always / every day / facts → simple present."],"ex":{"q":"I ___ an appointment with the doctor soon. (2022 Q7)","s":["‘Soon’ = a planned action in the near future.","A fixed plan is expressed with the present continuous.","Answer: am making."],"a":"am making"},"tr":{"q":"He has been working here ___ 2019.","s":["‘2019’ is a point of time.","Point of time → since; period → for.","Answer: since."],"o":["since","from","by","for"],"a":0},"trap":"Using the present perfect with ‘yesterday’ or ‘ago’ — always wrong.","fast":{"trick":"Time word decides: now → is + -ing · since/for → has + V3 · yesterday → V2 · by the time (past) → had + V3 · usually → V1(s).","ex":["‘soon’ + fixed plan → present continuous","am making"],"tr":["2019 = point of time → since","since"],"sec":10}},{"name":"Articles a / an / the","idea":"Choose ‘a’ or ‘an’ by the first SOUND of the next word, not its first letter.","steps":["Say the next word aloud.","Vowel sound → an (an hour, an honest man, an MLA, an FIR).","Consonant sound → a (a university, a European, a one-rupee coin).","‘The’ for something specific or unique: the sun, the Ganga, the Prime Minister, superlatives (the best)."],"ex":{"q":"Which is correct: a hour / an hour?","s":["‘Hour’ is pronounced ‘our’ — the h is silent.","Vowel sound → an.","Answer: an hour."],"a":"an hour"},"tr":{"q":"Choose the correct phrase.","s":["‘MLA’ is read ‘em-el-ay’ — starts with a vowel sound.","Vowel sound → an.","Answer: an MLA."],"o":["a MLA","a hour","an university","an MLA"],"a":3},"trap":"Going by the letter: ‘u’ in university sounds like ‘yoo’, so it takes ‘a’.","fast":{"trick":"‘an’ before a vowel SOUND (an hour, an MLA), ‘a’ before a consonant SOUND (a university, a one-rupee coin).","ex":["h silent → vowel sound","an hour"],"tr":["‘em’ sound → an","an MLA"],"sec":5}},{"name":"Prepositions — fixed pairs","idea":"Many words always take the same preposition. The exam tests the common pairs again and again.","steps":["Superior / senior / junior / prefer → to (never ‘than’).","Interested in, good at, afraid of, fond of, proud of, married to.","Abide by, comply with, depend on, insist on, refrain from, divide into.","Time: at + clock time, on + day/date, in + month/year, since + point, for + period."],"ex":{"q":"I never feel that I am superior ___ anyone. (2022 Q16)","s":["‘Superior’ is a Latin comparative.","It takes ‘to’, never ‘than’.","Answer: to."],"a":"to"},"tr":{"q":"Every citizen must abide ___ the law.","s":["Fixed pair: abide by.","Answer: by."],"o":["with","to","by","on"],"a":2},"trap":"Writing ‘superior than’ or ‘prefer than’.","fast":{"trick":"Superior / senior / junior / prefer → to. Abide by · comply with · refrain from · insist on · since + point, for + period.","ex":["superior → to","to"],"tr":["abide → by","by"],"sec":5}}]},"e2":{"title":"English vocabulary & reading comprehension","sec":"English","why":"PC Prelims only: synonyms, antonyms and a 5-question reading passage (2022 Q6, Q10, Q21–25).","method":["Synonym/antonym: put the word in a simple sentence, then try each option in its place.","Antonym questions often hide a synonym among the options — that is the trap.","One-word substitution: break words into parts — omni = all, -cide = killing, -phobia = fear, -logy = study of, -ist/-ian = person.","Reading comprehension: read the 5 questions FIRST, then read the passage once and mark the lines that answer them. Answer only from the passage."],"tips":["Learn 10 synonym and 10 antonym pairs a day from the practice questions.","Idioms are fixed phrases — never read them word by word.","Spelling traps: double letters (accommodation, committee), ‘ie/ei’ (receive, achieve) and -ance/-ence.","In RC, options with ‘only’, ‘always’ or ‘never’ are usually wrong unless the passage says so."],"facts":[["2022 Q6","Synonym of ‘hard’ → firm"],["2022 Q10","Antonym of ‘opaque’ → transparent"],["2022 Q21–25","Passage on the Hiroshima bombing — 5 factual questions"]],"ex":["Choose the antonym of OPAQUE. (2022 Q10)",["Opaque = light cannot pass through.","Opposite = light passes through clearly.","Answer: transparent."]],"qs":["q473","q474","q475","q476","q477","q478","q479","q480"],"day":"d1","models":[{"name":"Synonyms","idea":"A synonym has the same meaning. Test each option in a simple sentence with the given word.","steps":["Make a short sentence with the given word.","Replace the word with each option.","Keep the option that leaves the meaning unchanged."],"ex":{"q":"Choose the synonym of HARD. (2022 Q6)","s":["‘The ground is hard.’","‘The ground is firm.’ — same meaning.","Answer: firm."],"a":"firm"},"tr":{"q":"Choose the synonym of DILIGENT.","s":["‘A diligent student studies every day.’","Hardworking keeps the meaning.","Answer: hardworking."],"o":["Careless","Hardworking","Lazy","Clever"],"a":1},"trap":"Picking a word that is related but not the same (e.g. ‘clever’ for diligent).","fast":{"trick":"Put the word in a sentence and swap in each option — the one that keeps the meaning wins.","ex":["hard = firm","firm"],"tr":["diligent = hardworking","Hardworking"],"sec":10}},{"name":"Antonyms","idea":"An antonym has the opposite meaning. The options usually include a synonym as a trap.","steps":["Say the meaning of the word in your own words.","Think of its opposite.","Eliminate any option that means the SAME (the trap)."],"ex":{"q":"Choose the antonym of OPAQUE. (2022 Q10)","s":["Opaque = light cannot pass through.","Opposite = light passes through clearly.","Answer: transparent."],"a":"transparent"},"tr":{"q":"Choose the antonym of HUMBLE.","s":["Humble = modest, not proud.","Opposite = proud, arrogant.","Modest is a synonym trap."],"o":["Arrogant","Polite","Simple","Modest"],"a":0},"trap":"Choosing the synonym when the question asks for the antonym.","fast":{"trick":"Think of the opposite first, then strike out the synonym trap.","ex":["opaque ↔ transparent","transparent"],"tr":["humble ↔ arrogant (modest = trap)","Arrogant"],"sec":10}},{"name":"One-word substitution","idea":"Replace a phrase with one word. Word parts give the answer away.","steps":["omni- = all (omniscient, omnipotent, omnipresent).","-cide = killing (regicide, patricide).","-phobia = fear (hydrophobia, acrophobia).","-logy = study of; -ist / -ian = a person."],"ex":{"q":"A person who walks in his sleep.","s":["somnus = sleep, ambulare = walk.","Answer: somnambulist."],"a":"Somnambulist"},"tr":{"q":"One who knows everything.","s":["omni = all, sci = know.","Answer: omniscient."],"o":["Optimist","Omnipotent","Omnipresent","Omniscient"],"a":3},"trap":"Mixing up omniscient (knows all), omnipotent (all-powerful) and omnipresent (everywhere).","fast":{"trick":"omni = all · -cide = killing · -phobia = fear · -logy = study of · -ist / -ian = person.","ex":["somnus + ambulare","Somnambulist"],"tr":["omni + sci(ence)","Omniscient"],"sec":10}},{"name":"Idioms and phrases","idea":"An idiom's meaning is different from its words. Learn the common ones as fixed phrases.","steps":["Never read an idiom literally.","Think of a situation where people use it.","Pick the option that fits that situation."],"ex":{"q":"‘Once in a blue moon’ means:","s":["Used for something that hardly ever happens.","Answer: very rarely."],"a":"Very rarely"},"tr":{"q":"‘To let the cat out of the bag’ means:","s":["Used when someone accidentally tells a secret.","Answer: to reveal a secret."],"o":["To travel abroad","To be very angry","To reveal a secret","To set an animal free"],"a":2},"trap":"Choosing the literal meaning (an animal, a colour, fire).","fast":{"trick":"Never read an idiom literally — picture when people say it.","ex":["hardly ever happens","Very rarely"],"tr":["secret slips out","To reveal a secret"],"sec":10}},{"name":"Spelling","idea":"Spelling questions use the same few traps: double letters, ie/ei, and -ance/-ence endings.","steps":["Check double letters: accommodation (cc, mm), committee (mm, tt, ee), embarrass (rr, ss).","‘i before e except after c’: achieve, believe — but receive, deceive.","Endings: maintenance, guidance (-ance); conscience, independence (-ence)."],"ex":{"q":"Choose the correctly spelt word: Accomodation / Accommodation / Acommodation / Accommadation","s":["Needs double c and double m.","Answer: Accommodation."],"a":"Accommodation"},"tr":{"q":"Choose the correctly spelt word.","s":["Receive: after ‘c’ comes ‘ei’.","Answer: receive."],"o":["riceive","receive","receeve","recieve"],"a":1},"trap":"Trusting how a word sounds — check letter by letter.","fast":{"trick":"Check double letters, ie/ei after c, and -ance/-ence endings.","ex":["cc + mm","Accommodation"],"tr":["after c → ei","receive"],"sec":10}},{"name":"Reading comprehension","idea":"Five questions come from one passage. Every answer is written in the passage — you only need to find it.","steps":["Read the five questions FIRST.","Read the passage once and mark the line that answers each question.","Choose the option that matches the passage, not outside knowledge.","Words like ‘only’, ‘never’, ‘always’ in an option are usually wrong."],"ex":{"q":"(2022 passage) ‘More than 1,40,000 people were killed instantly.’ How many people were killed instantly?","s":["Find the line with ‘killed instantly’.","It says ‘more than 1,40,000’.","Answer: more than 1,40,000 (not ‘only’)."],"a":"More than 1,40,000"},"tr":{"q":"Passage: ‘Banks never ask customers for their OTP, PIN or password.’ According to the passage, banks:","s":["Find the line about banks.","It says ‘never ask’.","Answer matches the line."],"o":["Never ask for the OTP, PIN or password","Ask for the PIN on weekends","Ask for the OTP only once","Collect passwords at home"],"a":0},"trap":"Choosing ‘Only 1,40,000’ when the passage says ‘more than’.","fast":{"trick":"Read the 5 questions first, then find each answer's line in the passage.","ex":["‘killed instantly’ line → more than","More than 1,40,000"],"tr":["‘banks never ask’ line","Never ask"],"sec":60}}]}},"qs":{"q1":{"q":"What is the least number that must be added to 3500 to make it exactly divisible by 17?","o":["4","15","13","2"],"w":["3504 ÷ 17 leaves remainder 2, so 4 is wrong.","15 is the remainder — that is the number you would SUBTRACT, not add.","13 does not make 3500 a multiple of 17 (3513 ÷ 17 leaves 11).","3500 ÷ 17 = 205 remainder 15. Add 17 − 15 = 2 to reach the next multiple (3502 = 17 × 206)."],"a":3,"tp":"a1","s":"Arithmetic"},"q2":{"q":"How many divisors does 720 have?","o":["24","36","30","18"],"w":["24 comes from forgetting one prime factor or miscounting a power.","36 would need exponents like 2,2,3 — 720 is 2⁴·3²·5.","720 = 2⁴ × 3² × 5¹. Number of divisors = (4+1)(2+1)(1+1) = 30.","18 = 3 × 3 × 2 — it treats 2⁴ as 2²."],"a":2,"tp":"a1","s":"Arithmetic"},"q3":{"q":"What is the largest 4-digit number exactly divisible by 88?","o":["9988","9944","9966","9900"],"w":["9988 ÷ 88 = 113.5 — not a whole number.","9999 ÷ 88 leaves remainder 55. 9999 − 55 = 9944 (= 88 × 113).","9966 ÷ 88 leaves remainder 22.","9900 ÷ 88 = 112.5 — not divisible."],"a":1,"tp":"a1","s":"Arithmetic"},"q4":{"q":"Which of these numbers is divisible by 11?","o":["918082","918083","918092","918081"],"w":["Alternate-digit test: (9 + 8 + 8) − (1 + 0 + 2) = 25 − 3 = 22, a multiple of 11.","(9+8+8) − (1+0+3) = 21 — not a multiple of 11.","(9+8+9) − (1+0+2) = 23 — not a multiple of 11.","(9+8+8) − (1+0+1) = 23 — not a multiple of 11."],"a":0,"tp":"a1","s":"Arithmetic"},"q5":{"q":"What is the unit digit of 7⁹⁵?","o":["9","1","7","3"],"w":["9 is for remainder 2.","1 is for powers that are multiples of 4.","7 is the unit digit when the power leaves remainder 1 on division by 4.","Unit digits of powers of 7 repeat in a cycle of 4: 7, 9, 3, 1. 95 ÷ 4 leaves 3 → third in cycle = 3."],"a":3,"tp":"a1","s":"Arithmetic"},"q6":{"q":"The sum of the first 50 odd natural numbers is:","o":["1275","2450","2500","2550"],"w":["1275 is the sum of 1 to 50, n(n+1)/2.","2450 = 49 × 50 — not a standard formula here.","Sum of first n odd numbers = n² = 50² = 2500.","2550 is the sum of the first 50 EVEN numbers, n(n+1)."],"a":2,"tp":"a1","s":"Arithmetic"},"q7":{"q":"The recurring decimal 0.363636… expressed as a fraction is:","o":["9/25","4/11","36/90","2/5"],"w":["9/25 = 0.36 exactly — a terminating decimal, not recurring.","Two repeating digits → 36/99 = 4/11.","36/90 is used only when one digit repeats after one non-repeating digit.","2/5 = 0.4."],"a":1,"tp":"a1","s":"Arithmetic"},"q8":{"q":"How many numbers between 100 and 200 are divisible by 7?","o":["14","28","13","15"],"w":["Multiples of 7 up to 199: 28; up to 100: 14. 28 − 14 = 14 (105 to 196).","28 counts all multiples from 7 up to 199, not only those above 100.","13 misses 196 (= 7 × 28).","15 counts one extra — 100 itself is not a multiple of 7."],"a":0,"tp":"a1","s":"Arithmetic"},"q9":{"q":"Four bells ring at intervals of 8, 12, 15 and 20 minutes. If they ring together at 9 AM, when will they next ring together?","o":["10 AM","12 noon","10:30 AM","11 AM"],"w":["10 AM assumes 60 minutes, but 60 is not a multiple of 8.","3 hours = 180 min is a common multiple but not the LEAST one.","90 minutes is not divisible by 8 or 20.","LCM(8, 12, 15, 20) = 120 minutes = 2 hours → 11 AM."],"a":3,"tp":"a2","s":"Arithmetic"},"q10":{"q":"The HCF of two numbers is 12 and their LCM is 360. If one number is 72, the other is:","o":["30","90","60","48"],"w":["30 is not a multiple of the HCF 12.","90 is not a multiple of 12.","HCF × LCM = product of the numbers → 12 × 360 / 72 = 60.","HCF(72, 48) = 24, not 12."],"a":2,"tp":"a2","s":"Arithmetic"},"q11":{"q":"Find the greatest number that divides 1657 and 2037 leaving remainders 6 and 5 respectively.","o":["305","127","123","235"],"w":["305 does not divide 1651.","Subtract the remainders: 1651 and 2032. HCF(1651, 2032) = 127 (1651 = 13 × 127, 2032 = 16 × 127).","123 does not divide 1651 exactly.","235 does not divide 2032 exactly."],"a":1,"tp":"a2","s":"Arithmetic"},"q12":{"q":"Find the least number which, when divided by 12, 15, 20 and 54, leaves remainder 8 in each case.","o":["548","540","532","1088"],"w":["LCM(12, 15, 20, 54) = 540. Add the remainder: 540 + 8 = 548.","540 leaves remainder 0, not 8.","Subtracting the remainder is used when the remainders are short of the divisor by a fixed amount.","1088 = 2 × 540 + 8 — it works but is not the least."],"a":0,"tp":"a2","s":"Arithmetic"},"q13":{"q":"What is the remainder when 2³¹ is divided by 5?","o":["1","4","2","3"],"w":["1 is for multiples of 4.","4 is for remainder 2.","2 is for powers leaving remainder 1 on division by 4.","Powers of 2 mod 5 cycle 2, 4, 3, 1 (length 4). 31 ÷ 4 leaves 3 → remainder 3."],"a":3,"tp":"a2","s":"Arithmetic"},"q14":{"q":"A floor 15.17 m × 9.02 m is to be paved with the largest possible square tiles. What is the side of each tile?","o":["31 cm","43 cm","41 cm","37 cm"],"w":["31 does not divide 1517.","43 divides neither length exactly.","HCF(1517, 902) cm = 41 cm (1517 = 37 × 41, 902 = 22 × 41).","37 divides 1517 but not 902."],"a":2,"tp":"a2","s":"Arithmetic"},"q15":{"q":"The LCM of the fractions 2/3, 4/9 and 5/6 is:","o":["20/9","20/3","10/3","40/3"],"w":["Uses LCM of denominators instead of HCF.","LCM of fractions = LCM(numerators) / HCF(denominators) = LCM(2,4,5)/HCF(3,9,6) = 20/3.","Takes LCM(2,5) and forgets the 4.","Doubles the LCM of numerators by mistake."],"a":1,"tp":"a2","s":"Arithmetic"},"q16":{"q":"A number leaves remainder 4 when divided by 6. What remainder will it leave when divided by 3?","o":["1","2","0","4"],"w":["Number = 6k + 4 = 3(2k + 1) + 1 → remainder 1.","2 would mean the number is 6k + 2 or 6k + 5.","0 would mean the number is a multiple of 3, but 6k + 4 is not.","A remainder can never be bigger than the divisor 3."],"a":0,"tp":"a2","s":"Arithmetic"},"q17":{"q":"If 35% of a number is 84, the number is:","o":["252","210","294","240"],"w":["252 = 84 × 3 — guesses 35% ≈ one-third.","210 is 35% of 600, not the answer.","294 = 84 × 3.5 — multiplies instead of dividing by 0.35.","x = 84 × 100 / 35 = 240."],"a":3,"tp":"a3","s":"Arithmetic"},"q18":{"q":"The price of sugar rises by 25%. By what percent must a family cut consumption to keep the expense unchanged?","o":["22.5%","25%","20%","15%"],"w":["No standard formula gives 22.5%.","Cutting 25% would reduce the expense, because the base is now higher.","Reduction = r/(100 + r) × 100 = 25/125 × 100 = 20%.","15% cut leaves expense 1.25 × 0.85 = 1.0625 — still higher."],"a":2,"tp":"a3","s":"Arithmetic"},"q19":{"q":"A town’s population of 50,000 grows 10% in the first year and 20% in the second. Population after 2 years:","o":["66,500","66,000","60,000","65,000"],"w":["66,500 is an arithmetic slip.","50,000 × 1.10 × 1.20 = 66,000.","60,000 counts only the 20% rise.","65,000 adds 30% simply — successive changes multiply."],"a":1,"tp":"a3","s":"Arithmetic"},"q20":{"q":"In an election between two candidates, the winner gets 62% of votes and wins by 1,440 votes. Total votes polled:","o":["6,000","2,323","3,750","7,200"],"w":["Winning margin = 62% − 38% = 24% of total = 1,440 → total = 6,000.","Divides 1,440 by 0.62 — the margin is 24%, not 62%.","Uses 38% as the margin.","Uses 20% as the margin."],"a":0,"tp":"a3","s":"Arithmetic"},"q21":{"q":"A’s salary is 25% more than B’s. By what percent is B’s salary less than A’s?","o":["18%","22.5%","25%","20%"],"w":["Arithmetic slip.","Not derived from any correct formula.","The base changes — 25% is measured on B, not A.","B less than A = 25/(100 + 25) × 100 = 20%."],"a":3,"tp":"a3","s":"Arithmetic"},"q22":{"q":"A student scoring 30% fails by 24 marks; another scoring 45% gets 36 marks more than the pass mark. What are the pass marks?","o":["120","180","144","160"],"w":["120 is 30% of 400 — forgets the 24 marks short.","180 is 45% of 400 — that student’s own score.","45% − 30% = 15% = 24 + 36 = 60 → maximum = 400. Pass = 30% of 400 + 24 = 144.","160 is 40% of 400 — a guess at the pass percentage."],"a":2,"tp":"a3","s":"Arithmetic"},"q23":{"q":"If the length of a rectangle increases by 20% and the breadth decreases by 20%, the area:","o":["decreases by 2%","decreases by 4%","increases by 4%","remains the same"],"w":["Uses x²/200 instead of x²/100.","Net change = 20 − 20 + (20 × −20)/100 = −4%.","The sign is wrong — the cross term is negative.","Equal +/− percentages never cancel; there is always a loss of x²/100."],"a":1,"tp":"a3","s":"Arithmetic"},"q24":{"q":"Two successive discounts of 30% and 20% are equivalent to a single discount of:","o":["44%","46%","40%","50%"],"w":["30 + 20 − (30 × 20)/100 = 44%.","Arithmetic slip in the cross term.","Subtracts too much.","Adds the two — the second discount is on the reduced price."],"a":0,"tp":"a3","s":"Arithmetic"},"q25":{"q":"An article bought for ₹800 is sold for ₹920. The profit percent is:","o":["12%","120%","13.04%","15%"],"w":["Arithmetic slip.","120 is the profit in rupees, not a percent.","Profit is calculated on SP here — always use CP.","Profit 120 on CP 800 → 120/800 × 100 = 15%."],"a":3,"tp":"a4","s":"Arithmetic"},"q26":{"q":"A man buys 12 pens for ₹10 and sells 10 pens for ₹12. His profit percent is:","o":["2%","20%","44%","40%"],"w":["Takes the ₹2 difference as a percent.","Compares ₹12 with ₹10 directly, ignoring the different counts.","CP per pen = 10/12, SP per pen = 12/10. Profit = (1.2 ÷ 0.833) − 1 = 44%.","Adds the two 20% differences."],"a":2,"tp":"a4","s":"Arithmetic"},"q27":{"q":"By selling an article for ₹540, a man loses 10%. To gain 15% he should sell it for:","o":["₹621","₹690","₹700","₹660"],"w":["Applies 15% on 540 — the gain must be on CP (600).","CP = 540/0.9 = 600. SP for 15% gain = 600 × 1.15 = ₹690.","Arithmetic slip.","That is a 10% gain on 600."],"a":1,"tp":"a4","s":"Arithmetic"},"q28":{"q":"A shopkeeper marks goods 25% above cost and gives a 12% discount. His profit percent is:","o":["10%","13%","12%","37%"],"w":["MP = 125, SP = 125 × 0.88 = 110 → profit 10%.","Subtracts 12 from 25 directly.","Confuses the discount with profit.","Adds the two percentages."],"a":0,"tp":"a4","s":"Arithmetic"},"q29":{"q":"A dishonest dealer sells at cost price but uses a 900 g weight for 1 kg. His gain percent is:","o":["9%","10%","12.5%","11 1/9%"],"w":["Arithmetic slip.","Divides by 1000 instead of 900.","Would need an 889 g weight.","Gain = error/(true − error) × 100 = 100/900 × 100 = 11 1/9%."],"a":3,"tp":"a4","s":"Arithmetic"},"q30":{"q":"Two articles are sold for ₹990 each, one at 10% gain and the other at 10% loss. The overall result is:","o":["No profit, no loss","Gain of ₹20","Loss of ₹20","Loss of ₹10"],"w":["Equal ± percentages on equal SP always give a net loss.","The sign is wrong.","CPs are 990/1.1 = 900 and 990/0.9 = 1100; total CP 2000, total SP 1980 → loss ₹20 (1%).","Arithmetic slip."],"a":2,"tp":"a4","s":"Arithmetic"},"q31":{"q":"If the selling price of 15 articles equals the cost price of 20 articles, the gain percent is:","o":["30%","33 1/3%","20%","25%"],"w":["Arithmetic slip.","Gain = (20 − 15)/15 × 100 = 33 1/3%.","Arithmetic slip.","Divides by 20 — gain is on the 15 articles sold."],"a":1,"tp":"a4","s":"Arithmetic"},"q32":{"q":"A retailer buys a radio at 20% discount on its marked price of ₹1,500 and sells it at the marked price. His profit percent is:","o":["25%","15%","20%","30%"],"w":["CP = 1200, SP = 1500 → 300/1200 = 25%.","Arithmetic slip.","20% is the discount on MP, not the profit on CP.","Arithmetic slip."],"a":0,"tp":"a4","s":"Arithmetic"},"q33":{"q":"The simple interest on ₹8,000 at 9% per annum for 3 years is:","o":["₹2,700","₹720","₹2,360","₹2,160"],"w":["Uses 9000 instead of 8000 as principal.","₹720 is the interest for only one year.","That is the COMPOUND interest for 3 years.","SI = PRT/100 = 8000 × 9 × 3 / 100 = ₹2,160."],"a":3,"tp":"a5","s":"Arithmetic"},"q34":{"q":"A sum becomes three times itself in 10 years at simple interest. The rate is:","o":["30%","15%","20%","10%"],"w":["Uses 3P as the interest; the interest is only 2P.","Arithmetic slip.","Interest = 2P in 10 years → R = 200/10 = 20%.","That rate would double the sum in 10 years."],"a":2,"tp":"a5","s":"Arithmetic"},"q35":{"q":"The compound interest on ₹10,000 at 10% per annum for 2 years, compounded half-yearly, is:","o":["₹2,100.00","₹2,155.06","₹2,000.00","₹2,210.00"],"w":["That is yearly compounding.","Half-yearly: rate 5%, 4 periods. 10000 × (1.05⁴ − 1) = ₹2,155.06.","That is simple interest.","Arithmetic slip."],"a":1,"tp":"a5","s":"Arithmetic"},"q36":{"q":"The difference between CI and SI on ₹5,000 for 3 years at 10% per annum is:","o":["₹155","₹165","₹50","₹150"],"w":["CI − SI (3 yrs) = P(R/100)²(3 + R/100) = 5000 × 0.01 × 3.1 = ₹155.","Arithmetic slip.","₹50 is the 2-year difference P(R/100)².","Multiplies the 2-year difference by 3 — the third year has interest on interest too."],"a":0,"tp":"a5","s":"Arithmetic"},"q37":{"q":"A sum doubles in 5 years at compound interest. In how many years will it become 8 times?","o":["25 years","40 years","20 years","15 years"],"w":["Arithmetic slip.","Treats it like simple interest growth.","That would give 2⁴ = 16 times.","8 = 2³ → three doubling periods = 3 × 5 = 15 years."],"a":3,"tp":"a5","s":"Arithmetic"},"q38":{"q":"₹6,000 becomes ₹7,260 in 2 years at compound interest. The rate per annum is:","o":["11%","10.5%","10%","12%"],"w":["1.11² = 1.2321, not 1.21.","Divides total interest 1260 by 2 years as if it were simple interest.","7260/6000 = 1.21 = (1.1)² → 10%.","1.12² = 1.2544, not 1.21."],"a":2,"tp":"a5","s":"Arithmetic"},"q39":{"q":"On a certain sum, SI for 2 years is ₹600 and CI for 2 years is ₹630 at the same rate. The sum is:","o":["₹6,000","₹3,000","₹1,500","₹3,300"],"w":["Uses 600 as yearly interest.","SI per year = 300. Extra ₹30 = interest on 300 for 1 year → R = 10%. P = 300/0.10 = ₹3,000.","Uses R = 20%.","Adds one year’s interest to the principal."],"a":1,"tp":"a5","s":"Arithmetic"},"q40":{"q":"A machine worth ₹2,00,000 depreciates at 10% per year. Its value after 3 years is:","o":["₹1,45,800","₹1,62,000","₹1,45,000","₹1,40,000"],"w":["2,00,000 × 0.9³ = ₹1,45,800.","That is the value after 2 years.","Arithmetic slip.","Takes 10% of the original value each year (simple depreciation)."],"a":0,"tp":"a5","s":"Arithmetic"},"q41":{"q":"₹7,800 is divided among A, B and C in the ratio 1/2 : 1/3 : 1/4. A’s share is:","o":["₹2,400","₹3,900","₹2,600","₹3,600"],"w":["That is B’s share.","Half of 7800 — reads 1/2 as A’s fraction of the total.","That is one-third of 7800 — ignores the ratio.","Multiply by 12: 6 : 4 : 3 (sum 13). A = 6/13 × 7800 = ₹3,600."],"a":3,"tp":"a6","s":"Arithmetic"},"q42":{"q":"If A : B = 3 : 4 and B : C = 6 : 7, then A : B : C is:","o":["9 : 12 : 16","18 : 24 : 21","9 : 12 : 14","3 : 4 : 7"],"w":["Arithmetic slip in C.","Scales C wrongly.","Make B equal: 3:4 = 18:24, 6:7 = 24:28 → 18 : 24 : 28 = 9 : 12 : 14.","Simply joins the ratios without equalising B."],"a":2,"tp":"a6","s":"Arithmetic"},"q43":{"q":"A father is four times as old as his son. After 16 years he will be twice as old as his son. The son’s present age is:","o":["10 years","8 years","16 years","12 years"],"w":["Check: 56 vs 26 — not twice.","4x + 16 = 2(x + 16) → 2x = 16 → x = 8.","Check: 80 vs 32 — not twice.","Check: 48 + 16 = 64, 12 + 16 = 28 — not twice."],"a":1,"tp":"a6","s":"Arithmetic"},"q44":{"q":"The sum of ages of 5 children born at intervals of 3 years is 70 years. The age of the youngest is:","o":["8 years","10 years","6 years","14 years"],"w":["x + (x+3) + (x+6) + (x+9) + (x+12) = 5x + 30 = 70 → x = 8.","Arithmetic slip.","Uses intervals of 3.4.","14 is the average (middle child)."],"a":0,"tp":"a6","s":"Arithmetic"},"q45":{"q":"In what ratio must rice at ₹40/kg be mixed with rice at ₹55/kg to get a mixture worth ₹46/kg?","o":["2 : 3","1 : 1","9 : 4","3 : 2"],"w":["Ratio reversed — the cheaper rice gets the larger share.","Equal mixing gives ₹47.50/kg.","Arithmetic slip.","Alligation: (55 − 46) : (46 − 40) = 9 : 6 = 3 : 2 (cheaper : dearer)."],"a":3,"tp":"a6","s":"Arithmetic"},"q46":{"q":"30 litres of a mixture contain milk and water in the ratio 7 : 3. How much water must be added to make the ratio 3 : 2?","o":["7 litres","9 litres","5 litres","4 litres"],"w":["Arithmetic slip.","9 L is the water already present.","Milk = 21 L (fixed). For 3 : 2, water = 21 × 2/3 = 14 L. Add 14 − 9 = 5 L.","Arithmetic slip."],"a":2,"tp":"a6","s":"Arithmetic"},"q47":{"q":"A invests ₹45,000 for 12 months and B invests ₹60,000 for 6 months. Out of a profit of ₹15,000, B’s share is:","o":["₹9,000","₹6,000","₹7,500","₹8,571"],"w":["That is A’s share.","A = 45,000 × 12 = 5,40,000; B = 60,000 × 6 = 3,60,000 → 3 : 2. B = 2/5 × 15,000 = ₹6,000.","Splits equally.","Uses capital ratio 3 : 4 and ignores time."],"a":1,"tp":"a6","s":"Arithmetic"},"q48":{"q":"Two numbers are in the ratio 5 : 8. If 9 is added to each, the ratio becomes 8 : 11. The smaller number is:","o":["15","9","25","20"],"w":["(5x + 9)/(8x + 9) = 8/11 → 55x + 99 = 64x + 72 → x = 3. Smaller = 15.","9 is the number added.","Check: 34 : 49 — not 8 : 11.","Check: 29 : 41 — not 8 : 11."],"a":0,"tp":"a6","s":"Arithmetic"},"q49":{"q":"The average of the first 25 natural numbers is:","o":["26","12.5","12","13"],"w":["That is n + 1.","That is n/2; use (n + 1)/2.","Arithmetic slip.","(n + 1)/2 = 26/2 = 13."],"a":3,"tp":"a7","s":"Arithmetic"},"q50":{"q":"The average of 11 results is 50. The average of the first six is 49 and of the last six is 52. The sixth result is:","o":["50","52","56","54"],"w":["50 is the overall average.","52 is the average of the last six.","6 × 49 + 6 × 52 − 11 × 50 = 294 + 312 − 550 = 56.","Arithmetic slip."],"a":2,"tp":"a7","s":"Arithmetic"},"q51":{"q":"The average age of 30 students is 14 years. When the teacher’s age is included, the average becomes 15. The teacher’s age is:","o":["29 years","45 years","15 years","44 years"],"w":["Arithmetic slip.","31 × 15 − 30 × 14 = 465 − 420 = 45.","That is the new average.","Uses 30 × 15 − 30 × 14 + 14."],"a":1,"tp":"a7","s":"Arithmetic"},"q52":{"q":"A batsman scores 87 in his 17th innings and raises his average by 3. His new average is:","o":["39","42","38","36"],"w":["16x + 87 = 17(x + 3) → x = 36 → new average 39.","Adds 3 twice.","Arithmetic slip.","36 is the OLD average."],"a":0,"tp":"a7","s":"Arithmetic"},"q53":{"q":"The mean of 50 observations was 30. Later it was found that 48 was wrongly recorded as 23. The correct mean is:","o":["30.25","29.5","31","30.5"],"w":["Divides by 100.","Subtracts the correction instead of adding.","Arithmetic slip.","Increase = (48 − 23)/50 = 0.5 → 30.5."],"a":3,"tp":"a7","s":"Arithmetic"},"q54":{"q":"A car covers equal distances at 60 km/h and 40 km/h. Its average speed for the whole journey is:","o":["45 km/h","52 km/h","48 km/h","50 km/h"],"w":["Arithmetic slip.","Arithmetic slip.","Average speed = 2xy/(x + y) = 2 × 60 × 40 / 100 = 48 km/h.","Simple average — wrong for equal DISTANCES (time spent is unequal)."],"a":2,"tp":"a7","s":"Arithmetic"},"q55":{"q":"The average of five consecutive even numbers is 18. The largest of them is:","o":["20","22","26","24"],"w":["20 is the fourth number.","Middle number = 18 → 14, 16, 18, 20, 22.","Arithmetic slip.","Adds 6 instead of 4."],"a":1,"tp":"a7","s":"Arithmetic"},"q56":{"q":"Average monthly income of A and B is ₹5,050, of B and C is ₹6,250, and of A and C is ₹5,200. A’s income is:","o":["₹4,000","₹4,500","₹4,200","₹5,050"],"w":["A + B = 10,100; B + C = 12,500; A + C = 10,400. Sum = 33,000 → A + B + C = 16,500 → A = 16,500 − 12,500 = ₹4,000.","Arithmetic slip.","Arithmetic slip.","That is the average of A and B."],"a":0,"tp":"a7","s":"Arithmetic"},"q57":{"q":"A can do a work in 10 days and B in 15 days. Together they finish it in:","o":["5 days","12.5 days","25 days","6 days"],"w":["Arithmetic slip.","Simple average of 10 and 15.","Adds the days.","10 × 15 / (10 + 15) = 6 days."],"a":3,"tp":"a8","s":"Arithmetic"},"q58":{"q":"A and B together finish a job in 12 days; B alone takes 30 days. A alone will take:","o":["42 days","24 days","20 days","18 days"],"w":["Adds the days.","Arithmetic slip.","A’s rate = 1/12 − 1/30 = 3/60 = 1/20 → 20 days.","Subtracts the days (30 − 12)."],"a":2,"tp":"a8","s":"Arithmetic"},"q59":{"q":"12 men working 6 hours a day finish a job in 18 days. In how many days will 9 men working 8 hours a day finish it?","o":["24 days","18 days","20 days","16 days"],"w":["Ignores the change in hours.","M₁D₁H₁ = M₂D₂H₂ → 12 × 18 × 6 = 9 × D × 8 → D = 18.","Arithmetic slip.","Arithmetic slip."],"a":1,"tp":"a8","s":"Arithmetic"},"q60":{"q":"A can finish a work in 20 days. He works for 5 days and B finishes the rest in 9 days. B alone can do it in:","o":["12 days","9 days","15 days","18 days"],"w":["A does 5/20 = 1/4. B does 3/4 in 9 days → full work in 12 days.","9 days was for only 3/4 of the work.","Assumes B did half the work.","Arithmetic slip."],"a":0,"tp":"a8","s":"Arithmetic"},"q61":{"q":"A pipe fills a tank in 4 hours. Because of a leak, it takes longer; the leak alone empties the full tank in 12 hours. With the leak, the tank fills in:","o":["16 hours","8 hours","3 hours","6 hours"],"w":["Adds the hours.","Subtracts the hours.","Adds the rates — a leak slows filling.","1/4 − 1/12 = 2/12 = 1/6 → 6 hours."],"a":3,"tp":"a8","s":"Arithmetic"},"q62":{"q":"A is twice as fast as B. B alone can do a job in 24 days. Together they finish it in:","o":["16 days","12 days","8 days","6 days"],"w":["Arithmetic slip.","That is A alone.","A takes 12 days. Together 12 × 24 / 36 = 8 days.","Arithmetic slip."],"a":2,"tp":"a8","s":"Arithmetic"},"q63":{"q":"A and B take a job for ₹1,800. A alone can do it in 6 days, B in 9 days. If they work together, A’s share is:","o":["₹900","₹1,080","₹1,200","₹720"],"w":["Equal split — wages follow work done.","Shares are in the ratio of work rates 1/6 : 1/9 = 3 : 2 → A = 3/5 × 1800 = ₹1,080.","Uses days ratio 2 : 1.","That is B’s share."],"a":1,"tp":"a8","s":"Arithmetic"},"q64":{"q":"4 men or 6 women can do a work in 12 days. How long will 2 men and 3 women take?","o":["12 days","10 days","6 days","24 days"],"w":["1 man = 1.5 women. 2M + 3W = 3W + 3W = 6 women → same 12 days.","Arithmetic slip.","Halves the time wrongly.","Doubles the time wrongly."],"a":0,"tp":"a8","s":"Arithmetic"},"q65":{"q":"A speed of 72 km/h is equal to:","o":["15 m/s","25 m/s","259.2 m/s","20 m/s"],"w":["Arithmetic slip.","Uses 72 × 18/5 ÷ 10.","Multiplies by 18/5 instead of 5/18.","72 × 5/18 = 20 m/s."],"a":3,"tp":"a9","s":"Arithmetic"},"q66":{"q":"A 240 m long train passes a pole in 12 seconds. Its speed is:","o":["80 km/h","60 km/h","72 km/h","20 km/h"],"w":["Arithmetic slip.","Arithmetic slip.","240/12 = 20 m/s = 72 km/h.","20 is in m/s — convert to km/h."],"a":2,"tp":"a9","s":"Arithmetic"},"q67":{"q":"A 150 m long train running at 54 km/h crosses a 300 m long platform in:","o":["10 seconds","30 seconds","25 seconds","20 seconds"],"w":["Uses only the train length.","Distance = 150 + 300 = 450 m; speed = 15 m/s → 30 s.","Arithmetic slip.","Uses only the platform length."],"a":1,"tp":"a9","s":"Arithmetic"},"q68":{"q":"Two trains 120 m and 180 m long run in the SAME direction at 60 km/h and 48 km/h. Time taken by the faster to cross the slower:","o":["90 seconds","10 seconds","60 seconds","45 seconds"],"w":["Relative speed = 12 km/h = 10/3 m/s. Distance 300 m → 90 s.","That is for OPPOSITE directions (108 km/h).","Arithmetic slip.","Arithmetic slip."],"a":0,"tp":"a9","s":"Arithmetic"},"q69":{"q":"A boat goes 18 km/h downstream and 12 km/h upstream. The speed of the stream is:","o":["15 km/h","6 km/h","1.5 km/h","3 km/h"],"w":["That is the boat’s speed in still water.","Forgets to divide by 2.","Divides by 4.","Stream = (18 − 12)/2 = 3 km/h. (Boat = 15 km/h.)"],"a":3,"tp":"a9","s":"Arithmetic"},"q70":{"q":"Walking at 4/5 of his usual speed, a man is 10 minutes late. His usual time is:","o":["50 minutes","8 minutes","40 minutes","30 minutes"],"w":["That is the new (late) time.","Arithmetic slip.","At 4/5 speed time becomes 5/4 × T. Extra T/4 = 10 → T = 40 min.","Arithmetic slip."],"a":2,"tp":"a9","s":"Arithmetic"},"q71":{"q":"In a 1 km race A beats B by 100 m, and in a 1 km race B beats C by 100 m. By how much does A beat C in a 1 km race?","o":["180 m","190 m","210 m","200 m"],"w":["Arithmetic slip.","When A runs 1000, B runs 900, and C runs 900 × 0.9 = 810 → A beats C by 190 m.","Arithmetic slip.","Adds the margins — the second margin is on B’s 900 m, not 1000 m."],"a":1,"tp":"a9","s":"Arithmetic"},"q72":{"q":"Two cars start at the same time towards each other from places 360 km apart, at 50 km/h and 70 km/h. They meet after:","o":["3 hours","3.6 hours","18 hours","2.5 hours"],"w":["Relative speed = 120 km/h → 360/120 = 3 h.","Arithmetic slip.","Uses the difference of speeds (20 km/h) — that is for the same direction.","Arithmetic slip."],"a":0,"tp":"a9","s":"Arithmetic"},"q73":{"q":"The angle between the hands of a clock at 3:40 is:","o":["140°","120°","230°","130°"],"w":["Arithmetic slip — use |30H − 5.5M|.","Assumes the hour hand stays at 3.","That is the reflex angle; the smaller angle is asked.","|30 × 3 − 5.5 × 40| = |90 − 220| = 130°."],"a":3,"tp":"a10","s":"Arithmetic"},"q74":{"q":"The angle between the hands of a clock at 7:20 is:","o":["80°","110°","100°","90°"],"w":["Arithmetic slip.","Uses 5.5 × 20 alone.","|210 − 110| = 100°.","Arithmetic slip."],"a":2,"tp":"a10","s":"Arithmetic"},"q75":{"q":"At what time between 4 and 5 o’clock are the hands of a clock together?","o":["21 7/11 min past 4","21 9/11 min past 4","20 min past 4","22 min past 4"],"w":["Arithmetic slip in 240/11.","Minute hand must gain 20 divisions at 11/12 per minute: 20 × 12/11 = 21 9/11 min.","Forgets that the hour hand also moves.","Rounds wrongly."],"a":1,"tp":"a10","s":"Arithmetic"},"q76":{"q":"A clock seen in a mirror shows 4:20. The actual time is:","o":["7:40","8:40","7:20","4:40"],"w":["Actual = 11:60 − 4:20 = 7:40.","Uses 12:60 − 4:20.","Subtracts only the hours.","Reverses only the minutes."],"a":0,"tp":"a10","s":"Arithmetic"},"q77":{"q":"1 January 2026 was a Thursday. What day was 1 January 2027?","o":["Thursday","Wednesday","Saturday","Friday"],"w":["No shift — every year shifts by at least one day.","Moves backwards instead of forwards.","Treats 2026 as a leap year (2 odd days).","2026 is a normal year: 1 odd day → Thursday + 1 = Friday."],"a":3,"tp":"a10","s":"Arithmetic"},"q78":{"q":"Which of these days CAN be the last day of a century?","o":["Thursday","Tuesday","Monday","Saturday"],"w":["Thursday is never the last day of a century.","Tuesday is never the last day of a century.","A century can end only on Monday, Wednesday, Friday or Sunday (odd days 5, 3, 1, 0).","Saturday is never the last day of a century (asked in 2016)."],"a":2,"tp":"a10","s":"Arithmetic"},"q79":{"q":"On what day of the week was 15 August 1947?","o":["Saturday","Friday","Sunday","Thursday"],"w":["Off by one odd day.","Odd days: 1946 complete years → 1600 (0) + 300 (1) + 46 years (35 normal + 11 leap = 57 → 1) = 2. 1 Jan–15 Aug 1947 = 227 days → 3. Total 5 → Friday.","Arithmetic slip.","Off by one odd day."],"a":1,"tp":"a10","s":"Arithmetic"},"q80":{"q":"A watch gains 5 seconds every 3 minutes and is set right at 7 AM. What will it show at 4 PM the same day?","o":["4:15 PM","4:05 PM","4:10 PM","3:45 PM"],"w":["9 h = 540 min → gain 540/3 × 5 = 900 s = 15 min → 4:15 PM.","Uses 5 seconds per minute ÷ 3 wrongly.","Arithmetic slip.","A gaining watch runs AHEAD, not behind."],"a":0,"tp":"a10","s":"Arithmetic"},"q81":{"q":"The area of a circle whose circumference is 44 cm is (π = 22/7):","o":["144 cm²","616 cm²","77 cm²","154 cm²"],"w":["Squares 12 — not related.","Uses r = 14 (diameter).","Half the area.","2πr = 44 → r = 7. Area = 22/7 × 49 = 154 cm²."],"a":3,"tp":"a11","s":"Arithmetic"},"q82":{"q":"The diagonal of a rectangle 24 cm × 7 cm is:","o":["31 cm","17 cm","25 cm","26 cm"],"w":["Adds the sides.","Subtracts the sides.","√(24² + 7²) = √625 = 25.","Arithmetic slip."],"a":2,"tp":"a11","s":"Arithmetic"},"q83":{"q":"The area of an equilateral triangle of side 8 cm is:","o":["32√3 cm²","16√3 cm²","64 cm²","8√3 cm²"],"w":["Uses √3/2.","(√3/4) × 64 = 16√3 cm².","Side squared — that is a square.","Arithmetic slip."],"a":1,"tp":"a11","s":"Arithmetic"},"q84":{"q":"A cube has volume 343 cm³. Its total surface area is:","o":["294 cm²","196 cm²","343 cm²","252 cm²"],"w":["Side = 7. TSA = 6 × 49 = 294 cm².","That is the lateral surface area 4a².","Volume and area are different quantities.","Arithmetic slip."],"a":0,"tp":"a11","s":"Arithmetic"},"q85":{"q":"The curved surface area of a cylinder of radius 7 cm and height 20 cm is:","o":["440 cm²","3080 cm²","1188 cm²","880 cm²"],"w":["Uses πrh.","That is the VOLUME πr²h.","That is the TOTAL surface area 2πr(r + h).","2πrh = 2 × 22/7 × 7 × 20 = 880 cm²."],"a":3,"tp":"a11","s":"Arithmetic"},"q86":{"q":"The volume of a cone of radius 7 cm and height 12 cm is:","o":["308 cm³","1848 cm³","616 cm³","924 cm³"],"w":["Uses ⅙.","That is the cylinder volume (forgets ⅓).","⅓ × 22/7 × 49 × 12 = 616 cm³.","Uses ½."],"a":2,"tp":"a11","s":"Arithmetic"},"q87":{"q":"A metal sphere of radius 6 cm is melted and recast into small spheres of radius 2 cm. How many small spheres are formed?","o":["54","27","9","3"],"w":["Arithmetic slip.","Number = (6/2)³ = 27.","Uses the ratio of surface areas.","Uses the ratio of radii, not volumes."],"a":1,"tp":"a11","s":"Arithmetic"},"q88":{"q":"A wire bent into a square encloses 121 cm². If it is rebent into a circle, the area enclosed is (π = 22/7):","o":["154 cm²","121 cm²","176 cm²","144 cm²"],"w":["Side 11 → wire 44 cm = 2πr → r = 7 → area 154 cm².","Area changes with shape; a circle encloses more.","Arithmetic slip.","Arithmetic slip."],"a":0,"tp":"a11","s":"Arithmetic"},"q89":{"q":"The angles of a triangle are in the ratio 3 : 4 : 5. The largest angle is:","o":["60°","80°","90°","75°"],"w":["That is the middle angle.","Arithmetic slip.","Assumes a right triangle.","180/12 = 15 → 5 × 15 = 75°."],"a":3,"tp":"a12","s":"Arithmetic"},"q90":{"q":"Each interior angle of a regular hexagon is:","o":["108°","60°","120°","135°"],"w":["That is a regular pentagon.","That is the exterior angle.","(n − 2) × 180 / n = 4 × 180 / 6 = 120°.","That is a regular octagon."],"a":2,"tp":"a12","s":"Arithmetic"},"q91":{"q":"The distance between the points (2, 3) and (8, 11) is:","o":["14","10","12","8"],"w":["Adds the differences.","√(6² + 8²) = 10.","Arithmetic slip.","Uses only the y-difference."],"a":1,"tp":"a12","s":"Arithmetic"},"q92":{"q":"The mid-point of the segment joining (−4, 6) and (8, −2) is:","o":["(2, 2)","(2, 4)","(−2, 2)","(6, −4)"],"w":["((−4 + 8)/2, (6 − 2)/2) = (2, 2).","Arithmetic slip in y.","Sign slip in x.","Subtracts instead of averaging."],"a":0,"tp":"a12","s":"Arithmetic"},"q93":{"q":"The area of the triangle with vertices (0, 0), (6, 0) and (0, 8) is:","o":["14 sq units","28 sq units","48 sq units","24 sq units"],"w":["Adds the legs.","Arithmetic slip.","Forgets the ½.","Right triangle: ½ × 6 × 8 = 24."],"a":3,"tp":"a12","s":"Arithmetic"},"q94":{"q":"In a right-angled triangle the two legs are 9 cm and 12 cm. The hypotenuse is:","o":["18 cm","13 cm","15 cm","21 cm"],"w":["Arithmetic slip.","Arithmetic slip.","√(81 + 144) = √225 = 15 (3-4-5 triple × 3).","Adds the legs."],"a":2,"tp":"a12","s":"Arithmetic"},"q95":{"q":"How many diagonals does an octagon have?","o":["24","20","16","28"],"w":["Arithmetic slip.","n(n − 3)/2 = 8 × 5 / 2 = 20.","Arithmetic slip.","That is ⁸C₂ — it includes the 8 sides."],"a":1,"tp":"a12","s":"Arithmetic"},"q96":{"q":"An exterior angle of a triangle is 110° and one of the interior opposite angles is 45°. The other interior opposite angle is:","o":["65°","135°","55°","70°"],"w":["Exterior angle = sum of interior opposite angles → 110 − 45 = 65°.","Adds instead of subtracting.","Arithmetic slip.","That is the adjacent interior angle (180 − 110)."],"a":0,"tp":"a12","s":"Arithmetic"},"q97":{"q":"Find the next term: 2, 5, 10, 17, 26, ?","o":["39","35","36","37"],"w":["Adds 13 — skips a step.","Adds 9 again — differences increase by 2 each time.","36 is 6², forgetting the +1.","n² + 1 for n = 1…6: 1+1, 4+1, 9+1, 16+1, 25+1, 36+1 = 37. (Differences 3, 5, 7, 9, 11.)"],"a":3,"tp":"r1","s":"Reasoning"},"q98":{"q":"Find the next term: 2, 10, 4, 20, 8, 40, ?","o":["32","48","16","80"],"w":["Doubles twice.","Adds 8 — not the rule.","Two alternating series: 2, 4, 8, 16 (×2) and 10, 20, 40 (×2). Next is from the first series → 16.","80 continues the second series, but the next position belongs to the first."],"a":2,"tp":"r1","s":"Reasoning"},"q99":{"q":"Find the next term: 7, 12, 19, 28, 39, ?","o":["51","52","50","54"],"w":["Adds 12.","Differences 5, 7, 9, 11 → next 13 → 39 + 13 = 52.","Adds 11 again.","Adds 15."],"a":1,"tp":"r1","s":"Reasoning"},"q100":{"q":"Find the next term: 1, 1, 2, 3, 5, 8, ?","o":["13","12","16","11"],"w":["Each term = sum of the previous two (Fibonacci): 5 + 8 = 13.","Adds 4.","Doubles 8.","Adds 3."],"a":0,"tp":"r1","s":"Reasoning"},"q101":{"q":"Find the missing term: 120, 99, 80, 63, 48, ?","o":["34","36","33","35"],"w":["Subtracts 14.","36 is 6² — forgets the −1.","Subtracts 15.","11² − 1, 10² − 1, 9² − 1, 8² − 1, 7² − 1 → 6² − 1 = 35. (Differences 21, 19, 17, 15, 13.) Asked in 2016."],"a":3,"tp":"r1","s":"Reasoning"},"q102":{"q":"Find the next letter: A, C, F, J, O, ?","o":["S","V","U","T"],"w":["Adds 4.","Adds 7.","Gaps +2, +3, +4, +5, +6 → O (15) + 6 = U (21).","Adds 5 again."],"a":2,"tp":"r1","s":"Reasoning"},"q103":{"q":"Find the next pair: AZ, BY, CX, DW, ?","o":["EU","EV","FV","EW"],"w":["Second letter skips one.","First letter moves forward (A, B, C, D, E); second moves backward (Z, Y, X, W, V).","First letter skips one.","Second letter does not change."],"a":1,"tp":"r1","s":"Reasoning"},"q104":{"q":"Find the next term: 4, 6, 9, 13.5, ?","o":["20.25","19.5","20","18"],"w":["Each term × 1.5: 13.5 × 1.5 = 20.25.","Adds 6.","Rounded wrongly.","Adds 4.5 — the rule is multiplication."],"a":0,"tp":"r1","s":"Reasoning"},"q105":{"q":"If MOBILE is written as NPCJMF, how is POLICE written in that code?","o":["QPMJDE","ONKHBD","QPLJDF","QPMJDF"],"w":["Last letter left unchanged.","Moves letters backward — the rule is +1.","Third letter left unchanged.","Each letter moves one step forward: P→Q, O→P, L→M, I→J, C→D, E→F."],"a":3,"tp":"r2","s":"Reasoning"},"q106":{"q":"If CAT is coded as XZG, how is DOG coded?","o":["VLT","WLS","WLT","XLT"],"w":["D’s pair is W, not V.","G’s pair is T, not S.","Reverse-alphabet code (A↔Z, B↔Y…; pairs add to 27): D→W, O→L, G→T.","D’s pair is W, not X."],"a":2,"tp":"r2","s":"Reasoning"},"q107":{"q":"If FRIEND is coded as HUMJTK, how is CANDLE coded?","o":["ECPFNG","EDRIRL","EDRIRK","DCQHQK"],"w":["Uses +2 for every letter.","Shifts +2, +3, +4, +5, +6, +7 by position: C→E, A→D, N→R, D→I, L→R, E→L.","Last letter shifted by +6 instead of +7.","Starts the shift at +1."],"a":1,"tp":"r2","s":"Reasoning"},"q108":{"q":"If GARDEN is written as NEDRAG, how is FLOWER written?","o":["REWOLF","FREWOL","REWLOF","RWEOLF"],"w":["The word is simply written in reverse order.","Moves the last letter to the front.","Two middle letters swapped.","Letters 2 and 3 swapped."],"a":0,"tp":"r2","s":"Reasoning"},"q109":{"q":"If A = 1, B = 2 … Z = 26 and CAB = 6, then DEAF = ?","o":["15","4516","17","16"],"w":["Arithmetic slip.","Writes the numbers side by side; CAB = 6 shows they are added.","Arithmetic slip.","D(4) + E(5) + A(1) + F(6) = 16."],"a":3,"tp":"r2","s":"Reasoning"},"q110":{"q":"In a code, ‘sky is blue’ = ‘tip nik sa’, ‘blue is colour’ = ‘nik da tip’ and ‘sky is high’ = ‘sa ho tip’. What is the code for ‘blue’?","o":["sa","da","nik","tip"],"w":["sa is the code for ‘sky’.","da is the code for ‘colour’.","‘is’ appears in all three sentences and ‘tip’ appears in all three codes → is = tip. ‘blue’ is in sentences 1 and 2 with ‘nik’ common besides tip → blue = nik.","tip is the code for ‘is’."],"a":2,"tp":"r2","s":"Reasoning"},"q111":{"q":"If ROSE = 6821, CHAIR = 73456 and PREACH = 961473, what is the code for SEARCH?","o":["246173","214673","214763","216473"],"w":["E and A misplaced.","S = 2, E = 1, A = 4, R = 6, C = 7, H = 3 → 214673.","R and C swapped — follow the order S-E-A-R-C-H.","A and R swapped."],"a":1,"tp":"r2","s":"Reasoning"},"q112":{"q":"If TEACHER is coded as VGCEJGT, how is STUDENT coded?","o":["UVWFGPV","QRSBCLR","TUVEFOU","UVWFGPU"],"w":["Each letter +2: S→U, T→V, U→W, D→F, E→G, N→P, T→V.","Uses −2.","Uses +1.","Last letter shifted by +1."],"a":0,"tp":"r2","s":"Reasoning"},"q113":{"q":"Doctor : Hospital :: Teacher : ?","o":["Book","Student","Principal","School"],"w":["Book is a tool, not the workplace.","Student is whom a teacher teaches, not the workplace.","Principal is a colleague, not a place.","Relation: person → place of work."],"a":3,"tp":"r3","s":"Reasoning"},"q114":{"q":"8 : 64 :: 11 : ?","o":["132","111","121","1331"],"w":["11 × 12 — not the rule.","Arithmetic slip.","Second term is the square of the first: 8² = 64, 11² = 121.","That is 11³; 8³ would be 512, not 64."],"a":2,"tp":"r3","s":"Reasoning"},"q115":{"q":"Find the odd one out: 17, 29, 39, 41","o":["29","39","41","17"],"w":["29 is prime.","39 = 3 × 13; all others are prime numbers.","41 is prime.","17 is prime like 29 and 41."],"a":1,"tp":"r3","s":"Reasoning"},"q116":{"q":"Find the odd one out: Lion, Tiger, Cheetah, Wolf","o":["Wolf","Tiger","Cheetah","Lion"],"w":["Lion, tiger and cheetah belong to the cat family; the wolf belongs to the dog family.","Tiger is a big cat.","Cheetah is in the cat family.","Lion is a big cat like the others."],"a":0,"tp":"r3","s":"Reasoning"},"q117":{"q":"Find the odd one out: Square, Rectangle, Rhombus, Triangle","o":["Square","Rectangle","Rhombus","Triangle"],"w":["Square is a quadrilateral.","Rectangle is a quadrilateral.","Rhombus is a quadrilateral.","The other three are quadrilaterals (four sides)."],"a":3,"tp":"r3","s":"Reasoning"},"q118":{"q":"Find the missing number in the table:","o":["12","9","14","16"],"w":["Arithmetic slip.","Adds 7 + 2.","In each row, third number = first × second: 3×5 = 15, 4×6 = 24, 7×2 = 14.","Arithmetic slip."],"a":2,"tp":"r3","f":"<table class=\"figtable\"><thead><tr><th><\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>3<\/td><td>5<\/td><td>15<\/td><\/tr><tr><td>4<\/td><td>6<\/td><td>24<\/td><\/tr><tr><td>7<\/td><td>2<\/td><td>?<\/td><\/tr><\/tbody><\/table>","s":"Reasoning"},"q119":{"q":"If ‘×’ means ‘+’, ‘+’ means ‘÷’, ‘−’ means ‘×’ and ‘÷’ means ‘−’, then 8 × 6 + 3 − 4 ÷ 2 = ?","o":["10","14","12","16"],"w":["Arithmetic slip.","Replace: 8 + 6 ÷ 3 × 4 − 2 = 8 + 8 − 2 = 14 (BODMAS: ÷ and × first, left to right).","Applies operations left to right without BODMAS.","Forgets to subtract 2."],"a":1,"tp":"r3","s":"Reasoning"},"q120":{"q":"ACE : BDF :: GIK : ?","o":["HJL","HJK","HIJ","IJL"],"w":["Each letter moves one step forward: G→H, I→J, K→L.","Last letter wrong.","Uses consecutive letters.","First letter moved two steps."],"a":0,"tp":"r3","s":"Reasoning"},"q121":{"q":"A man walks 10 m South, turns left and walks 6 m, then turns left again and walks 2 m. How far is he from the start?","o":["18 m","8 m","12 m","10 m"],"w":["Adds all distances.","Only the North–South gap.","Arithmetic slip.","After moves he is 6 m East and 8 m South of the start → √(36 + 64) = 10 m."],"a":3,"tp":"r4","s":"Reasoning"},"q122":{"q":"A man facing West turns 45° clockwise, then 180° clockwise, then 270° anticlockwise. Which direction does he face now?","o":["North-East","North-West","South-West","South-East"],"w":["Turns the last 270° the wrong way.","Stops after the first turn.","West → 45° cw = North-West → 180° cw = South-East → 270° acw = South-West.","Stops after the second turn."],"a":2,"tp":"r4","s":"Reasoning"},"q123":{"q":"One morning after sunrise, Raju’s shadow fell exactly to his right. Which direction was he facing?","o":["West","South","North","East"],"w":["Facing West, the shadow would be in front.","Morning sun is in the East, so the shadow falls West. West on his right → he faces South.","Facing North, the West shadow would be on his left.","Facing East, the shadow would be behind him."],"a":1,"tp":"r4","s":"Reasoning"},"q124":{"q":"A is B’s sister. C is B’s mother. D is C’s father. How is A related to D?","o":["Granddaughter","Daughter","Grandmother","Niece"],"w":["A is a daughter of C (B’s sister), and C is D’s child → A is D’s granddaughter.","A is C’s daughter, not D’s.","Direction reversed.","Niece would be a sibling’s daughter."],"a":0,"tp":"r4","s":"Reasoning"},"q125":{"q":"Pointing to a man in a photograph, Ravi says, “He is the son of the only son of my grandfather.” The man is Ravi’s:","o":["Uncle","Nephew","Cousin","Brother"],"w":["An uncle would be another son of the grandfather — there is none.","A nephew would be a sibling’s son.","A cousin would be the child of an uncle or aunt — but the grandfather has only one son.","The only son of Ravi’s grandfather is Ravi’s father. His son (other than Ravi) is Ravi’s brother."],"a":3,"tp":"r4","s":"Reasoning"},"q126":{"q":"X is the husband of Y. W is the daughter of X. Z is the husband of W. N is the daughter of Z. How is Y related to N?","o":["Mother","Aunt","Grandmother","Sister"],"w":["W is N’s mother.","No sibling link here.","Y is W’s mother; W is N’s mother → Y is N’s grandmother.","Generations differ."],"a":2,"tp":"r4","s":"Reasoning"},"q127":{"q":"In a queue, Ravi is 15th from the front and 25th from the back. How many people are in the queue?","o":["41","39","38","40"],"w":["Adds 1 instead of subtracting.","Total = 15 + 25 − 1 = 39 (Ravi is counted twice).","Subtracts 2.","Forgets to subtract Ravi once."],"a":1,"tp":"r4","s":"Reasoning"},"q128":{"q":"In a row of 40 students, A is 12th from the left. B is 5th to the right of A. What is B’s position from the right end?","o":["24th","28th","23rd","25th"],"w":["B is 17th from left → from right = 40 − 17 + 1 = 24.","Uses A’s position: 40 − 12.","Forgets the +1.","Adds 2."],"a":0,"tp":"r4","s":"Reasoning"},"q129":{"q":"Five people A, B, C, D, E sit in a row facing North. C is in the middle. A is at the left end. B is to the immediate right of C. D is not next to A. Who is second from the left?","o":["C","D","B","E"],"w":["C is in the middle (3).","D at 2 would be next to A, which is not allowed.","B is at position 4.","Positions 1–5: A(1), C(3), B(4). D cannot be at 2 (next to A) → D(5), E(2). Order: A E C B D."],"a":3,"tp":"r5","s":"Reasoning"},"q130":{"q":"Six friends A–F sit in a circle facing the centre. A is opposite D. B is to the immediate right of A. E sits between C and D. Who is to the immediate left of A?","o":["E","B","C","F"],"w":["E sits between C and D, not next to A.","B is to A’s immediate RIGHT.","Place A; B on A’s right; D opposite A. E must touch both C and D, so the order clockwise from A is A, C, E, D, F, B. Immediate left of A (clockwise, facing centre) = C.","F sits between D and B."],"a":2,"tp":"r5","s":"Reasoning"},"q131":{"q":"P, Q, R, S, T live on floors 1–5 of a building (1 = lowest). S lives on the top floor. P lives above R but below T. Q lives immediately below R. Who lives on floor 3?","o":["R","P","T","Q"],"w":["R is on floor 2.","S = 5. R < P < T and Q = R − 1. Only fit: Q 1, R 2, P 3, T 4, S 5.","T is on floor 4.","Q is on floor 1."],"a":1,"tp":"r5","s":"Reasoning"},"q132":{"q":"Five lectures V, W, X, Y, Z are held one per day, Monday to Friday. X is on Wednesday. V is the day immediately after Z. W is neither first nor last. Y is before X. Which lecture is on Thursday?","o":["Z","Y","V","W"],"w":["X = Wed. Y before Wed and W not on Mon/Fri → Y Mon, W Tue. Z–V consecutive → Z Thu, V Fri.","Y is on Monday.","V is on Friday.","W is on Tuesday."],"a":0,"tp":"r5","s":"Reasoning"},"q133":{"q":"A is taller than B. D is taller than C, and C is taller than A. E is the shortest. Who is the tallest?","o":["A","C","B","D"],"w":["A is third.","C is second.","B is fourth.","Order: D > C > A > B > E."],"a":3,"tp":"r5","s":"Reasoning"},"q134":{"q":"Q earns more than P. R earns less than S but more than Q. T earns the most. Who earns the second highest?","o":["R","Q","S","T"],"w":["R is third.","Q is fourth.","Order: T > S > R > Q > P.","T is the highest."],"a":2,"tp":"r5","s":"Reasoning"},"q135":{"q":"M, N, O, P, Q sit in a row facin
