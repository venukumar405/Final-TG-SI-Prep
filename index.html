<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SI &amp; PC Prelims Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* One visual world: a clean exam-board CBT look — navy header, white panels, standard palette colours. Single light theme by design. */
:root{
  --navy:#173a66; --navy2:#0f2a4d; --blue:#1f6fd1; --ink:#1b2430; --muted:#5d6878; --line:#d8dee7;
  --bg:#eef2f7; --panel:#ffffff; --soft:#f5f7fa;
  --green:#22863a; --greenbg:#e6f4ea; --red:#c62828; --redbg:#fdecea; --purple:#6a4bc4; --amber:#b26a00; --amberbg:#fff4e0;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --display:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.topbar{background:var(--navy);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap}
.brand{font:700 19px var(--display);letter-spacing:.02em}
.brand small{display:block;font:500 12px var(--body);opacity:.8;letter-spacing:.04em;text-transform:uppercase}
.topbar .sp{flex:1}
.navbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:6px 12px;font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.12)}
.crumb{font-size:14px;color:var(--muted);margin:16px 0 4px}
.crumb a{text-decoration:none}
main{padding-bottom:60px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin:20px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:700 26px var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.countdown{font:700 44px var(--display);color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)} .small{font-size:14px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin:8px 0 24px}
.day{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:168px;transition:border-color .15s, box-shadow .15s}
.day:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(23,58,102,.12)}
.day .lab{font:700 22px var(--display);color:var(--navy)}
.day .dt{font-size:13px;color:var(--muted)}
.day .tl{font-size:13.5px;color:var(--ink);flex:1}
.day.today{border:2px solid var(--blue)}
.foot{font-size:13px;color:var(--muted);padding:26px 16px 30px;border-top:1px solid var(--line);margin-top:30px}
.examsel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.examsel select,.examsel input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.day.special .lab{color:var(--amber)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.today{background:var(--blue);color:#fff}
.tag.done{background:var(--greenbg);color:var(--green)}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
h2.sec{font-size:26px;color:var(--navy);margin:22px 0 6px}
.topiclist{display:grid;gap:10px;margin:14px 0}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left}
.trow:hover{border-color:var(--blue)}
.sbadge{font:600 12px var(--body);padding:4px 8px;border-radius:6px;color:#fff;min-width:96px;text-align:center}
.sb-Arithmetic{background:#1f6fd1}.sb-English{background:#b4531b}
.passage{background:var(--soft);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;font-size:15px;line-height:1.6;max-width:760px;color:var(--ink)}.sb-Reasoning{background:#7b3fb3}.sb-GS{background:#0f7a5a}
.trow h3{font-size:19px}
.trow .r{text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:14px 0 16px}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel h3{font-size:19px;color:var(--navy);margin-bottom:8px}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:6px 0}
ul.tips{margin:0;padding-left:20px}ul.tips li{margin:6px 0}
.tip{background:var(--amberbg);border-left:4px solid var(--amber);padding:10px 12px;border-radius:0 8px 8px 0}
table.kv{width:100%;border-collapse:collapse;font-size:15px}
table.kv td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
table.kv tr:first-child td{border-top:0}
table.kv td:first-child{font-weight:600;color:var(--navy);white-space:nowrap;width:1%}
.ex ol{margin:6px 0 0;padding-left:22px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:7px;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#185bb0}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* practice test */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qno{font:700 18px var(--display);color:var(--navy)}
.qtext{font-size:17px;font-weight:500;margin:4px 0 12px}
.fig{margin:6px 0 14px;color:var(--ink);overflow-x:auto}
.figtable{border-collapse:collapse;font-variant-numeric:tabular-nums}
.figtable th,.figtable td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.figtable th{background:var(--soft);font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f4f8fe}
.opt .n{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.opt.sel{border-color:var(--blue);background:#eaf2fd}.opt.sel .n{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:var(--greenbg)}.opt.right .n{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--redbg)}.opt.wrong .n{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.opt svg{display:block}
.explain{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.verdict{font-weight:700;font-size:17px;margin-bottom:6px}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.others{margin-top:10px}
.others li{margin:5px 0}
.others .ol{font-weight:600}
.scorebar{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:15px}
.scorebar b{font-size:17px}
.small-btn{padding:4px 10px;font-size:13.5px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:600;color:var(--muted)}
.dot.cur{border:2px solid var(--blue);color:var(--blue)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.no{background:var(--red);border-color:var(--red);color:#fff}
.mnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink);text-align:left}
.mchip b{display:inline-block;min-width:18px;color:var(--navy)}
.mchip.cur{border:2px solid var(--blue);color:var(--blue)}
.mchip.ok{background:var(--greenbg);border-color:var(--green)}.mchip.no{background:var(--redbg);border-color:var(--red)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.mhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.mno{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mhead h3{font-size:22px;color:var(--navy)}
.midea{font-size:16.5px;margin:6px 0 14px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media(max-width:760px){.mgrid{grid-template-columns:1fr}}
.mcard h4{margin:0 0 8px;font:700 16px var(--display);color:var(--navy);letter-spacing:.02em}
.msteps{background:var(--soft);border-radius:8px;padding:12px 14px}.msteps ol{margin:0;padding-left:20px}.msteps li{margin:4px 0}
.mex{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px}
.mq{font-weight:600;margin:0 0 8px}
.msol{list-style:none;padding:0;margin:6px 0}.msol li{margin:6px 0;display:flex;gap:10px;align-items:baseline}
.stn{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:#eaf2fd;border-radius:4px;padding:1px 6px}
.mans{background:var(--greenbg);color:#14532d;border-radius:6px;padding:7px 10px;display:inline-block;margin-top:4px}
.mans svg{display:inline-block;vertical-align:middle}
.mtrap{margin-top:14px;background:var(--redbg);border-left:4px solid var(--red);padding:9px 12px;border-radius:0 8px 8px 0}
.mtry{margin-top:16px;border-top:2px dashed var(--line);padding-top:14px}
.mfast{background:#fff8e6;border:1.5px solid #f0c040;border-radius:10px;padding:12px 14px;margin:4px 0 14px}
.mfast-h{display:flex;align-items:center;gap:8px;font:700 15px var(--display);color:#7a4f00;letter-spacing:.03em;text-transform:uppercase}
.mfast-h .tgt{margin-left:auto;font:600 12.5px var(--body);text-transform:none;letter-spacing:0;background:#7a4f00;color:#fff;border-radius:999px;padding:2px 10px}
.mfast-t{font-size:17.5px;font-weight:600;margin-top:4px;line-height:1.5}
.stn.fast{background:#fff1c7;color:#7a4f00;min-width:22px;text-align:center}
.mfast-sol{background:#fffbef;border-radius:8px;padding:8px 12px;margin:6px 0}
.mdet{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.mdet summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14.5px}
/* CBT */
.cbt{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;z-index:20}
.cbt-top{background:var(--navy2);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.cbt-top .ttl{font:700 17px var(--display)}
.timer{margin-left:auto;background:#fff;color:var(--navy2);border-radius:6px;padding:4px 12px;font:700 20px var(--display);font-variant-numeric:tabular-nums}
.timer.low{background:#ffe0e0;color:var(--red)}
.cbt-sections{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.cbt-sections button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--navy)}
.cbt-sections button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.cbt-body{flex:1;display:grid;grid-template-columns:1fr 330px;min-height:0}
@media(max-width:860px){.cbt-body{grid-template-columns:1fr}.cbt-side{display:none}.cbt-side.show{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(330px,92vw);z-index:30;box-shadow:-4px 0 20px rgba(0,0,0,.2)}}
.cbt-main{overflow:auto;padding:16px 20px;display:flex;flex-direction:column}
.cbt-qhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;font-weight:600;flex-wrap:wrap;gap:8px}
.cbt-qhead .mk{font-size:13px;color:var(--muted);font-weight:500}
.cbt .opt{max-width:760px}
.cbt-actions{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;background:var(--soft)}
.cbt-actions .sp{flex:1}
.cbt-side{border-left:1px solid var(--line);background:#f7f9fc;display:flex;flex-direction:column;min-height:0}
.sideclose{display:none;margin:8px 10px 0}
@media(max-width:860px){.sideclose{display:block}}
@media(max-width:860px){.cbt-side{display:none}.cbt-side.show{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(330px,92vw);z-index:30;box-shadow:-4px 0 20px rgba(0,0,0,.2);overflow:auto}
  .cbt-top{gap:8px;padding:6px 10px}.cbt-top .ttl{font-size:15px}.cbt-top .small{display:none}.timer{font-size:16px;padding:3px 8px}
  .cbt-sections{padding:6px 10px;gap:4px}.cbt-sections button{padding:4px 8px;font-size:12.5px}
  .cbt-main{padding:10px 12px}.cbt-actions{padding:8px 10px;gap:6px}.cbt-actions .btn{padding:7px 10px;font-size:13.5px}}
.cand{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}
.pal{flex:1;overflow:auto;padding:12px}
.pal h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pb{height:36px;border-radius:6px;border:1px solid #b9c2cf;background:#fff;font-weight:600;font-size:13px;color:var(--ink);position:relative}
.pb.nv{background:#fff}
.pb.na{background:var(--red);border-color:var(--red);color:#fff;border-radius:6px 6px 14px 14px}
.pb.an{background:var(--green);border-color:var(--green);color:#fff;border-radius:14px 14px 6px 6px}
.pb.mr{background:var(--purple);border-color:var(--purple);color:#fff;border-radius:50%}
.pb.am{background:var(--purple);border-color:var(--purple);color:#fff;border-radius:50%}
.pb.am::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:#3ad65a;border:1px solid #fff}
.pb.cur{outline:3px solid #f2a900;outline-offset:1px}
.sw{width:22px;height:20px;display:inline-block;flex:0 0 22px}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.modal h3{color:var(--navy);margin-bottom:10px}
table.sum{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin:8px 0 14px}
table.sum th,table.sum td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.sum th{background:var(--soft)}
table.sum td:first-child,table.sum th:first-child{text-align:left}
.instr ol li{margin:6px 0}
.result-big{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.result-big .score{font:700 56px var(--display);color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.pass{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px}
.pass.y{background:var(--greenbg);color:var(--green)}.pass.n{background:var(--redbg);color:var(--red)}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;margin-bottom:10px}
.rv .st{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px}
.st.c{background:var(--greenbg);color:var(--green)}.st.w{background:var(--redbg);color:var(--red)}.st.u{background:var(--soft);color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.check li{margin:8px 0}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>/* Question generators: every call builds a fresh question with new numbers.
   Each generator returns {q, a, x:[[wrong, why] ×3], fast:[...], steps:[...], fig?, html?} */
const GEN = (function(){
const G = {};
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
const LCM = a => a.reduce(lcm), HCF = a => a.reduce(gcd);
const N = n => { const v = Math.round(n * 100) / 100; return v.toLocaleString("en-IN"); };
const Rs = n => "₹" + N(n);
const fr = (p, q) => { const g = gcd(p, q); p /= g; q /= g; if (q < 0) { p = -p; q = -q; } return q === 1 ? String(p) : p + "/" + q; };
const mx = (p, q) => { const g = gcd(p, q); p /= g; q /= g; const w = Math.floor(p / q), r = p % q; return r ? (w ? w + " " + r + "/" + q : r + "/" + q) : String(w); };
const pct = (p, q) => mx(p, q) + "%";
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th","st","nd","rd"][n % 10] || "th");
const AL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const pos = c => c.charCodeAt(0) - 64, chr = n => AL[((n - 1) % 26 + 26) % 26];

t be added to 2000 to make it divisible by 19? (2016)",["2000 ÷ 19 = 105, remainder 5.","Add 19 − 5 = 14.","Answer: 14."]],"qs":["q1","q2","q3","q4","q5","q6","q7","q8"],"day":"d7","models":[{"name":"Least number to ADD or SUBTRACT for exact division","idea":"When a number N is divided by d, it leaves a remainder r. To make N exactly divisible you can either remove the extra r (subtract r) or fill the gap up to the next multiple (add d − r). Read the question carefully: ‘added’ and ‘subtracted’ give different answers.","steps":["Divide N by d and find the remainder r.","Least number to SUBTRACT = r.","Least number to ADD = d − r.","Check: N − r or N + (d − r) must divide exactly."],"ex":{"q":"What least number must be added to 2000 to get a number exactly divisible by 19? (2016 Q1)","s":["19 × 105 = 1995, so 2000 ÷ 19 leaves remainder 2000 − 1995 = 5.","To reach the next multiple (19 × 106 = 2014) we must add 19 − 5 = 14.","Check: 2014 ÷ 19 = 106 exactly."],"a":"14"},"tr":{"q":"What least number must be SUBTRACTED from 4500 to make it exactly divisible by 23?","s":["23 × 195 = 4485.","4500 − 4485 = 15 → remainder 15.","Subtract the remainder: 15. Check: 4485 ÷ 23 = 195."],"o":["23","195","8","15"],"a":3},"trap":"Many students give the remainder (5) when the question asks what to ADD. Adding the remainder takes you further from a multiple.","fast":{"trick":"Remainder r → SUBTRACT r · ADD (d − r). Find r fast by removing a round multiple (19 × 100 = 1900).","ex":["2000 − 1900 = 100 → 100 − 95 (19×5) = 5 → r = 5","Add 19 − 5 = 14"],"tr":["23 × 200 = 4600 → 4500 is 100 short","100 = 23×4 + 8 → r = 23 − 8 = 15 → subtract 15"],"sec":30}},{"name":"Largest or smallest n-digit number divisible by d","idea":"The largest 4-digit number is 9999 and the smallest is 1000. To get the largest multiple of d, cut the extra remainder off 9999. To get the smallest multiple, add the gap to 1000.","steps":["Largest: 9999 − (9999 mod d).","Smallest: 1000 + (d − 1000 mod d), unless 1000 is already divisible.","For 5-digit numbers use 99999 and 10000 in the same way."],"ex":{"q":"Find the largest 4-digit number exactly divisible by 37.","s":["9999 ÷ 37 = 270 remainder 9 (37 × 270 = 9990).","Remove the remainder: 9999 − 9 = 9990.","Answer: 9990."],"a":"9990"},"tr":{"q":"Find the smallest 4-digit number exactly divisible by 37.","s":["1000 ÷ 37 = 27 remainder 1 (37 × 27 = 999).","Gap to next multiple = 37 − 1 = 36.","1000 + 36 = 1036 (= 37 × 28)."],"o":["999","1110","1036","1037"],"a":2},"trap":"999 is a 3-digit number — the smallest 4-digit answer must be at least 1000.","fast":{"trick":"Largest n-digit = 999… − r · Smallest n-digit = 100… + (d − r).","ex":["9999 ÷ 37 → 37 × 270 = 9990, r = 9","9999 − 9 = 9990"],"tr":["1000 ÷ 37 → 37 × 27 = 999, r = 1","1000 + 36 = 1036"],"sec":30}},{"name":"Divisibility rules and the missing digit","idea":"Divisibility rules let you check a big number in seconds without dividing. Exam questions hide a digit (*) and ask which digit makes the number divisible.","steps":["2: last digit even. 5: last digit 0 or 5. 4: last two digits divisible by 4. 8: last three digits divisible by 8.","3: sum of digits divisible by 3. 9: sum of digits divisible by 9.","6: divisible by both 2 and 3. 11: (sum of odd-place digits) − (sum of even-place digits) = 0 or a multiple of 11.","For a missing digit, write the rule as an equation and try 0–9."],"ex":{"q":"The number 7 * 3 4 5 2 is divisible by 9. Find the digit *.","s":["Digit sum = 7 + * + 3 + 4 + 5 + 2 = 21 + *.","Next multiple of 9 above 21 is 27, so * = 6.","Check: 763452 → digit sum 27 → divisible by 9."],"a":"6"},"tr":{"q":"Which digit in place of * makes 3 8 * 5 6 divisible by 11?","s":["Odd places (from left): 3, *, 6 → 9 + *. Even places: 8, 5 → 13.","Difference (9 + *) − 13 = * − 4 must be 0 or a multiple of 11.","* = 4. Check: 38456 = 11 × 3496."],"o":["5","4","2","7"],"a":1},"trap":"For 11, use alternate places — not the total digit sum.","fast":{"trick":"÷9 → digit sum is a multiple of 9 · ÷11 → (odd-place sum) − (even-place sum) = 0 or 11.","ex":["7+3+4+5+2 = 21 → next multiple of 9 is 27","* = 6"],"tr":["Odd places 3 + * + 6, even places 8 + 5 = 13","9 + * = 13 → * = 4"],"sec":20}},{"name":"Number of divisors (factors)","idea":"Every number can be written as a product of primes. Each divisor picks some power of each prime — including the power 0 — so the count multiplies.","steps":["Write N = pᵃ × qᵇ × rᶜ (prime factorisation).","Number of divisors = (a + 1)(b + 1)(c + 1).","Number of ODD divisors: ignore the power of 2, then use the same rule."],"ex":{"q":"How many divisors does 360 have?","s":["360 = 2³ × 3² × 5¹.","Divisors = (3 + 1)(2 + 1)(1 + 1) = 4 × 3 × 2.","Answer: 24."],"a":"24"},"tr":{"q":"How many divisors does 1000 have?","s":["1000 = 2³ × 5³.","Divisors = (3 + 1)(3 + 1).","Answer: 16."],"o":["16","12","9","8"],"a":0},"trap":"Do not forget the +1 on each power — the power can also be zero (e.g. 1 itself is a divisor).","fast":{"trick":"N = aᵖ · bᑫ · cʳ → number of divisors = (p+1)(q+1)(r+1).","ex":["360 = 2³ · 3² · 5","4 × 3 × 2 = 24"],"tr":["1000 = 2³ · 5³","4 × 4 = 16"],"sec":20}},{"name":"Unit digit of a power or product","idea":"Only the last digit of each number decides the last digit of the answer. Last digits of powers repeat in short cycles of length 4 (or less).","steps":["Keep only the unit digit of the base.","Cycles: 2 → 2,4,8,6 · 3 → 3,9,7,1 · 7 → 7,9,3,1 · 8 → 8,4,2,6 · 4 → 4,6 · 9 → 9,1 · 0,1,5,6 never change.","Divide the power by 4. Remainder 1, 2, 3 → 1st, 2nd, 3rd in the cycle; remainder 0 → 4th (last) in the cycle.","For a product, multiply the unit digits only."],"ex":{"q":"Find the unit digit of 3⁶⁵ × 7⁴².","s":["3⁶⁵: 65 ÷ 4 leaves 1 → first in 3,9,7,1 → 3.","7⁴²: 42 ÷ 4 leaves 2 → second in 7,9,3,1 → 9.","3 × 9 = 27 → unit digit 7."],"a":"7"},"tr":{"q":"Find the unit digit of 2⁸⁸.","s":["Cycle of 2: 2, 4, 8, 6.","88 ÷ 4 leaves 0 → the 4th (last) term.","Unit digit = 6."],"o":["2","4","8","6"],"a":3},"trap":"Remainder 0 does not mean ‘0’ — it means the LAST number in the cycle.","fast":{"trick":"Power ÷ 4 → use the remainder (0 → 4). Cycles: 2: 2,4,8,6 · 3: 3,9,7,1 · 7: 7,9,3,1 · 8: 8,4,2,6. 0,1,5,6 never change.","ex":["65 ÷ 4 r 1 → 3 · 42 ÷ 4 r 2 → 9","3 × 9 = 27 → 7"],"tr":["88 ÷ 4 r 0 → 2⁴ ends in 6","6"],"sec":15}},{"name":"Recurring decimals to fractions","idea":"A decimal whose digits repeat forever can always be written as a fraction. The number of repeating digits tells you how many 9s go in the denominator.","steps":["Pure recurring 0.ababab… = ab/99; 0.aaa… = a/9.","Mixed 0.abbbb… (a does not repeat) = (ab − a)/90.","Simplify the fraction at the end."],"ex":{"q":"Express 0.272727… as a fraction.","s":["Two digits repeat: 27/99.","Divide top and bottom by 9: 3/11.","Answer: 3/11."],"a":"3/11"},"tr":{"q":"Express 0.1666… (only 6 repeats) as a fraction.","s":["Mixed recurring: (16 − 1)/90 = 15/90.","Simplify: 1/6.","Check: 1 ÷ 6 = 0.1666…"],"o":["1/9","15/99","1/6","16/99"],"a":2},"trap":"Use 90 (not 99) when the first digit after the point does not repeat.","fast":{"trick":"0.ababab… = ab/99 · 0.abbb… = (ab − a)/90.","ex":["27/99","= 3/11"],"tr":["(16 − 1)/90 = 15/90","= 1/6"],"sec":10}},{"name":"Counting multiples and standard sums","idea":"Questions ask ‘how many numbers between A and B are divisible by k’ or ask for a quick sum. Use floor division instead of listing.","steps":["Multiples of k from 1 to N = ⌊N/k⌋.","Multiples between A and B (inclusive) = ⌊B/k⌋ − ⌊(A − 1)/k⌋.","Sums: 1 + 2 + … + n = n(n + 1)/2 · first n odd numbers = n² · first n even numbers = n(n + 1) · squares 1² + … + n² = n(n + 1)(2n + 1)/6."],"ex":{"q":"How many numbers from 100 to 200 are divisible by 6?","s":["Multiples of 6 up to 200: ⌊200/6⌋ = 33.","Multiples up to 99: ⌊99/6⌋ = 16.","33 − 16 = 17 (102, 108, …, 198)."],"a":"17"},"tr":{"q":"Find 1 + 2 + 3 + … + 100.","s":["Use n(n + 1)/2 with n = 100.","100 × 101 / 2.","= 5050."],"o":["10100","5050","5100","5000"],"a":1},"trap":"‘Between’ in exams usually includes the end points only if they qualify — test the ends.","fast":{"trick":"Multiples of d from A to B = ⌊B/d⌋ − ⌊(A−1)/d⌋ · 1 + 2 + … + n = n(n+1)/2.","ex":["⌊200/6⌋ = 33, ⌊99/6⌋ = 16","33 − 16 = 17"],"tr":["100 × 101 / 2","= 5050"],"sec":15}}]},"a2":{"title":"LCM, HCF & remainders","sec":"Arithmetic","why":"Bells, tiles and remainder questions appear every year.","method":["‘Together again / ring together / least number’ → LCM. ‘Largest size / greatest number that divides’ → HCF.","Same remainder r for all divisors → LCM + r. Different remainders → subtract them first and take HCF.","HCF × LCM = product of two numbers.","LCM of fractions = LCM(numerators)/HCF(denominators); HCF of fractions = HCF(numerators)/LCM(denominators).","Remainder of (n−1)ᵏ ÷ n: k odd → n−1; k even → 1."],"tips":["Bells question: convert LCM seconds into minutes, then count in the given time and leave out the start if asked.","Remainder trick: write the base as (divisor ± 1)."],"facts":[["2016 Q4","Bells 6,5,7,10,12 s → LCM 420 s → 8 times in an hour"],["2018 Q9","Least multiple of 7 leaving 5 on ÷6, 9, 15 → 455"],["2018 Q14","(67⁶⁷+67) ÷ 68 → 66"]],"ex":["Remainder when 67⁶⁷ + 67 is divided by 68? (2018)",["67 ≡ −1 (mod 68).","(−1)⁶⁷ + (−1) = −2.","−2 + 68 = 66. Answer: 66."]],"qs":["q9","q10","q11","q12","q13","q14","q15","q16"],"day":"d7","models":[{"name":"Bells, lights and runners together (LCM)","idea":"Things repeating at different intervals happen together again after the LCM of the intervals. Then count how many such meetings fit in the given time.","steps":["Find the LCM of the intervals (same units!).","‘Next time together’ = start time + LCM.","‘How many times in T’ = ⌊T ÷ LCM⌋ (add 1 only if the start is counted)."],"ex":{"q":"Five bells toll at intervals of 6, 5, 7, 10 and 12 seconds. How many times do they toll together in one hour, excluding the start? (2016 Q4)","s":["LCM(6, 5, 7, 10, 12) = 420 seconds.","1 hour = 3600 s → 3600 ÷ 420 = 8.57.","Whole times = 8."],"a":"8"},"tr":{"q":"Three lights flash every 4, 6 and 8 seconds. If they flash together at 10:00:00, when do they next flash together?","s":["LCM(4, 6, 8) = 24 seconds.","10:00:00 + 24 s.","= 10:00:24."],"o":["10:00:24","10:00:12","10:01:00","10:00:48"],"a":0},"trap":"Convert minutes and seconds to the same unit before taking the LCM.","fast":{"trick":"Together every LCM. Times in T = T ÷ LCM (add 1 only if the start is counted).","ex":["LCM(6,5,7,10,12) = 420 s = 7 min","60 ÷ 7 → 8 times"],"tr":["LCM(4,6,8) = 24 s","10:00:24"],"sec":20}},{"name":"Largest size that fits exactly (HCF)","idea":"When you must cut, pack or measure with the LARGEST equal piece and nothing should be left over, the answer is the HCF.","steps":["Write all lengths in the same unit.","HCF of the lengths = largest piece / tile / measure.","Number of pieces = each length ÷ HCF (then add or multiply as asked)."],"ex":{"q":"Two ropes of 84 m and 126 m are cut into equal pieces of the greatest length. Find the length and the number of pieces.","s":["HCF(84, 126) = 42 m.","Pieces: 84/42 + 126/42 = 2 + 3.","Length 42 m, 5 pieces."],"a":"42 m, 5 pieces"},"tr":{"q":"A floor 15.17 m by 9.02 m is paved with the largest square tiles. Side of each tile?","s":["Convert to cm: 1517 and 902.","HCF(1517, 902) = 41.","Tile side = 41 cm."],"o":["43 cm","31 cm","37 cm","41 cm"],"a":3},"trap":"If the question says ‘least number of tiles’, it still needs the LARGEST tile (HCF), then divide the area.","fast":{"trick":"Greatest equal piece / largest tile = HCF. Convert to one unit (cm) first. HCF trick: keep subtracting the smaller from the larger.","ex":["84 = 42×2, 126 = 42×3 → HCF 42","Pieces 2 + 3 = 5"],"tr":["1517 − 902 = 615 → 902 − 615 = 287 → 615 − 574 = 41","HCF = 41 cm"],"sec":40}},{"name":"HCF × LCM = product of two numbers","idea":"For any two numbers, multiplying their HCF and LCM gives the same result as multiplying the numbers. This works only for TWO numbers.","steps":["Product of the two numbers = HCF × LCM.","Unknown number = (HCF × LCM) ÷ known number.","Both numbers must be multiples of the HCF — use this to reject options."],"ex":{"q":"The HCF of two numbers is 16 and LCM is 480. One number is 96. Find the other.","s":["Product = 16 × 480 = 7680.","Other = 7680 ÷ 96.","= 80. (80 is a multiple of 16 ✔)"],"a":"80"},"tr":{"q":"HCF = 12, LCM = 360, one number = 72. The other number is:","s":["12 × 360 = 4320.","4320 ÷ 72 = 60.","Check: HCF(72, 60) = 12 ✔."],"o":["90","30","60","48"],"a":2},"trap":"Do not use this shortcut for three numbers.","fast":{"trick":"Other number = HCF × LCM ÷ given number.","ex":["16 × 480 ÷ 96 = 16 × 5","= 80"],"tr":["12 × 360 ÷ 72 = 12 × 5","= 60"],"sec":10}},{"name":"Same remainder for every divisor (LCM + r)","idea":"If a number leaves the SAME remainder r when divided by several numbers, it is r more than a common multiple: N = LCM × k + r.","steps":["Find the LCM of the divisors.","Least such number = LCM + r.","If it must also be divisible by m, test LCM×k + r for k = 1, 2, 3 … until divisible by m."],"ex":{"q":"Find the least multiple of 7 which leaves remainder 5 when divided by 6, 9 and 15. (2018 Q9)","s":["LCM(6, 9, 15) = 90 → numbers are 90k + 5: 95, 185, 275, 365, 455 …","Test divisibility by 7: 95 ✘, 185 ✘, 275 ✘, 365 ✘, 455 = 7 × 65 ✔.","Answer: 455."],"a":"455"},"tr":{"q":"Find the least number which leaves remainder 8 when divided by 12, 15, 20 and 54.","s":["LCM(12, 15, 20, 54) = 540.","Add the remainder: 540 + 8.","= 548."],"o":["532","548","540","1088"],"a":1},"trap":"When the remainders are DIFFERENT but each is short of its divisor by the same amount (e.g. 4→2, 5→3, 6→4, all short by 2), the answer is LCM − 2.","fast":{"trick":"Number = k × LCM + r. Extra condition (multiple of m)? Find what LCM leaves on dividing by m and pick k.","ex":["LCM(6,9,15) = 90 = 7×13 − 1 → 90k + 5 leaves 5 − k","k = 5 → 455"],"tr":["LCM(12,15,20,54) = 540","540 + 8 = 548"],"sec":30}},{"name":"Greatest number giving given remainders (HCF of differences)","idea":"If a divisor leaves remainders r₁ and r₂ from numbers a and b, then it divides (a − r₁) and (b − r₂) exactly — so the greatest such divisor is their HCF. If the remainder is the same but unknown, use the HCF of the differences between the numbers.","steps":["Given remainders: HCF(a − r₁, b − r₂, …).","Same unknown remainder: HCF(b − a, c − b, c − a)."],"ex":{"q":"Find the greatest number which divides 1657 and 2037 leaving remainders 6 and 5.","s":["1657 − 6 = 1651 and 2037 − 5 = 2032.","1651 = 13 × 127 and 2032 = 16 × 127.","HCF = 127."],"a":"127"},"tr":{"q":"Find the greatest number that divides 43, 91 and 183 leaving the same remainder each time.","s":["Differences: 91 − 43 = 48, 183 − 91 = 92, 183 − 43 = 140.","HCF(48, 92, 140) = 4.","Answer: 4 (each leaves remainder 3)."],"o":["4","8","3","2"],"a":0},"trap":"Subtract the remainders first — never take the HCF of the original numbers.","fast":{"trick":"Remainders given → subtract them, take HCF · Same unknown remainder → HCF of the DIFFERENCES.","ex":["1651 and 2032 → difference 381 = 3 × 127","1651 = 13 × 127 → 127"],"tr":["Differences 48, 92, 140","HCF = 4"],"sec":30}},{"name":"Remainder of a big power","idea":"You never calculate 67⁶⁷. Instead, write the base as (divisor − 1) or (divisor + 1), or find a cycle of remainders.","steps":["If base = divisor − 1 (≡ −1): odd power gives remainder (divisor − 1), even power gives 1.","If base = divisor + 1 (≡ 1): any power gives remainder 1.","Otherwise list remainders of base¹, base², base³… until they repeat; use the cycle length."],"ex":{"q":"Remainder when 67⁶⁷ + 67 is divided by 68 (2018 Q14).","s":["67 = 68 − 1 ≡ −1.","67⁶⁷ ≡ (−1)⁶⁷ = −1 and 67 ≡ −1, so the sum ≡ −2.","−2 + 68 = 66."],"a":"66"},"tr":{"q":"Remainder when 2³¹ is divided by 5.","s":["2¹ → 2, 2² → 4, 2³ → 3, 2⁴ → 1 (cycle of 4).","31 ÷ 4 leaves 3 → third in the cycle.","Remainder = 3."],"o":["4","1","2","3"],"a":3},"trap":"A negative remainder is not the final answer — add the divisor.","fast":{"trick":"Write the base as (d ± 1). (d + 1)ⁿ leaves 1 · (d − 1)ⁿ leaves 1 if n even, d − 1 if n odd.","ex":["67 = 68 − 1 → 67⁶⁷ leaves −1, 67 leaves −1","−2 → 68 − 2 = 66"],"tr":["2⁴ = 16 leaves 1 → 2³¹ = (2⁴)⁷ × 8","8 leaves 3"],"sec":25}},{"name":"LCM and HCF of fractions","idea":"Fractions follow the ‘crossed’ rule: for the LCM take LCM on top and HCF below; for the HCF take HCF on top and LCM below.","steps":["LCM of fractions = LCM(numerators) ÷ HCF(denominators).","HCF of fractions = HCF(numerators) ÷ LCM(denominators).","Reduce each fraction to lowest terms first."],"ex":{"q":"Find the LCM of 2/3, 4/9 and 5/6.","s":["LCM(2, 4, 5) = 20.","HCF(3, 9, 6) = 3.","LCM = 20/3."],"a":"20/3"},"tr":{"q":"Find the HCF of 2/3, 4/9 and 6/5.","s":["HCF(2, 4, 6) = 2.","LCM(3, 9, 5) = 45.","HCF = 2/45."],"o":["2/3","1/45","2/45","12/45"],"a":2},"trap":"Students often take the LCM of denominators for the LCM — that is reversed.","fast":{"trick":"LCM of fractions = LCM(tops)/HCF(bottoms) · HCF = HCF(tops)/LCM(bottoms).","ex":["LCM(2,4,5) = 20, HCF(3,9,6) = 3","20/3"],"tr":["HCF(2,4,6) = 2, LCM(3,9,5) = 45","2/45"],"sec":15}}]},"a3":{"title":"Percentage","sec":"Arithmetic","why":"2–4 direct questions, and the base for profit/loss and interest.","method":["x% of y = y% of x — use the easier one.","Successive change a% then b%: a + b + ab/100 (put minus for a decrease).","If price rises r%, cut consumption by r/(100 + r) × 100 to keep spending the same.","A is r% more than B → B is r/(100 + r) × 100 % less than A.","Both groups (coffee/tea, pass/fail): Both = A% + B% − 100% (if everyone is in at least one)."],"tips":["Learn fraction equivalents: 1/8 = 12.5%, 1/6 = 16⅔%, 1/3 = 33⅓%, 3/8 = 37.5%, 5/8 = 62.5%, 5/6 = 83⅓%.","Equal + and − of the same x% always gives a LOSS of x²/100 %."],"facts":[["2018 Q29","Side +21% → area +46.41%"],["2016 Q28","72% coffee, 44% tea, 40 both → 250 people"],["2018 Q61","8% = 1.76 lakh → 25% = 5.5 lakh"]],"ex":["72% drink coffee, 44% drink tea, everyone drinks at least one, 40 drink both. Total? (2016)",["Both = 72 + 44 − 100 = 16%.","16% = 40 → 100% = 250.","Answer: 250."]],"qs":["q17","q18","q19","q20","q21","q22","q23","q24"],"day":"d6","models":[{"name":"Finding a percentage and finding the whole","idea":"‘x% of y’ means x/100 × y. When the PART is given with its percentage, divide to find the whole.","steps":["x% of y = x × y / 100.","If p% of a number = A, the number = A × 100 / p.","Use fraction values: 25% = 1/4, 12.5% = 1/8, 20% = 1/5, 16⅔% = 1/6."],"ex":{"q":"If 8% of a property is ₹1.76 lakh, what is 25% of it? (2018 Q61)","s":["Whole = 1.76 × 100/8 = ₹22 lakh.","25% of 22 lakh = 22/4.","= ₹5.5 lakh. (Shortcut: 25/8 × 1.76 = 5.5.)"],"a":"₹5.5 lakh"},"tr":{"q":"35% of a number is 84. Find the number.","s":["Number = 84 × 100 / 35.","= 8400 / 35.","= 240."],"o":["252","240","210","294"],"a":1},"trap":"Do not multiply 84 by 0.35 — that gives 35% OF 84, not the number.","fast":{"trick":"Scale directly: wanted value = given value × (wanted % ÷ given %). Know 1/8 = 12.5%, 1/6 = 16.67%, 1/3 = 33.33%.","ex":["1.76 × 25/8 = 0.22 × 25","= 5.5 lakh"],"tr":["84 × 100/35 = 12 × 20","= 240"],"sec":20}},{"name":"Successive percentage change","idea":"When a value changes twice, the second change acts on the new value, not the original. The net effect is not a simple sum.","steps":["Net change for a% then b% = a + b + ab/100 (use minus for a decrease).","Area of a square/circle when side or radius changes x% = 2x + x²/100.","Equal rise and fall of x% always gives a net fall of x²/100 %."],"ex":{"q":"A side of a square increases by 21%. By what percent does the area increase? (2018 Q29)","s":["Area changes by 21 + 21 + (21 × 21)/100.","= 42 + 4.41.","= 46.41%."],"a":"46.41%"},"tr":{"q":"A price is increased by 20% and then decreased by 20%. The net change is:","s":["20 − 20 + (20 × −20)/100.","= −4.","A 4% decrease."],"o":["4% decrease","4% increase","No change","2% decrease"],"a":0},"trap":"‘Up 20%, down 20%’ is NOT zero change.","fast":{"trick":"Net % = a + b + ab/100 (decrease = minus). Same x% up then down → always x²/100 % LOSS.","ex":["21 + 21 + 4.41","= 46.41%"],"tr":["x = 20 → 400/100","= 4% decrease"],"sec":10}},{"name":"Price rise vs consumption; ‘more than’ vs ‘less than’","idea":"If something becomes r% costlier and you want to spend the same, you must reduce the quantity. The base changes, so the cut is smaller than r. The same idea applies to ‘A is r% more than B, so B is ?% less than A’.","steps":["Cut in consumption = r/(100 + r) × 100.","If price falls r%, consumption can rise by r/(100 − r) × 100.","A is r% more than B → B is r/(100 + r) × 100 % less than A."],"ex":{"q":"The price of sugar rises by 25%. By how much should a family cut consumption to keep spending the same?","s":["Use r/(100 + r) × 100 with r = 25.","25/125 × 100.","= 20%."],"a":"20%"},"tr":{"q":"A’s income is 20% less than B’s. By what percent is B’s income more than A’s?","s":["Here A is less, so use r/(100 − r) × 100.","20/80 × 100.","= 25%."],"o":["22%","20%","16⅔%","25%"],"a":3},"trap":"Always ask: which value is the base (the ‘than’ value)?","fast":{"trick":"Use fractions: rise 1/n → cut 1/(n+1). Less by 1/n → other is more by 1/(n−1).","ex":["25% = 1/4 → cut 1/5","= 20%"],"tr":["20% = 1/5 less → B is 1/4 more","= 25%"],"sec":10}},{"name":"Population growth and depreciation","idea":"These work like compound interest: each year’s change is applied to the latest value.","steps":["Growth: P × (1 + r/100)ⁿ, or multiply year by year if rates differ.","Depreciation: P × (1 − r/100)ⁿ.","Going backwards (value n years AGO) = present ÷ (1 + r/100)ⁿ."],"ex":{"q":"A town of 50,000 grows by 10% in year 1 and 20% in year 2. Population after 2 years?","s":["After year 1: 50,000 × 1.1 = 55,000.","After year 2: 55,000 × 1.2 = 66,000.","Answer: 66,000."],"a":"66,000"},"tr":{"q":"A scooter worth ₹9,000 loses 10% of its value every year. Its value after 2 years is:","s":["9,000 × 0.9 = 8,100.","8,100 × 0.9 = 7,290.","Answer: ₹7,290."],"o":["₹7,200","₹7,400","₹7,290","₹7,500"],"a":2},"trap":"Do not subtract 20% of 9,000 at once — the second year’s loss is on ₹8,100.","fast":{"trick":"Multiply by growth factors: +10% → ×1.1, +20% → ×1.2, −10% → ×0.9.","ex":["50,000 × 1.1 × 1.2 = 50,000 × 1.32","= 66,000"],"tr":["−10%, −10% → ×0.81","9,000 × 0.81 = 7,290"],"sec":15}},{"name":"Elections and examinations","idea":"In a two-person election, the winning margin is the DIFFERENCE of the vote percentages. In exam questions, two students’ scores around the pass mark give you the maximum marks.","steps":["Election: margin % = winner % − loser % → total votes = margin ÷ margin %.","If invalid votes exist, first find valid votes.","Exam: (% of student 2 − % of student 1) × Max = (marks above pass) + (marks short of pass)."],"ex":{"q":"In an election between two candidates, the winner gets 62% and wins by 1,440 votes. Total votes?","s":["Loser gets 38%. Margin = 62 − 38 = 24%.","24% = 1,440.","Total = 1,440 × 100/24 = 6,000."],"a":"6,000"},"tr":{"q":"A student scoring 30% fails by 24 marks; another scoring 45% gets 36 more than the pass mark. Pass mark?","s":["45% − 30% = 15% of Max = 24 + 36 = 60 → Max = 400.","Pass = 30% of 400 + 24.","= 120 + 24 = 144."],"o":["180","144","120","160"],"a":1},"trap":"The margin is 24%, not 62% — dividing by 0.62 is the most common wrong answer.","fast":{"trick":"Margin % = winner % − loser %. Exams: gap in % = gap in marks.","ex":["62 − 38 = 24% = 1,440 → 1% = 60","Total = 6,000"],"tr":["15% = 24 + 36 = 60 → 1% = 4","Pass = 30% of 400 + 24 = 144"],"sec":30}},{"name":"Two overlapping groups (both / neither)","idea":"When people belong to two groups (tea and coffee, pass in English and Maths), those in both are counted twice when you add the two groups.","steps":["Total = A + B − Both + Neither.","If everyone is in at least one group, Neither = 0 → Both = A + B − 100%.","For pass/fail: Failed in at least one = F₁ + F₂ − Failed both; Passed both = 100% − that."],"ex":{"q":"72% drink coffee, 44% drink tea, everyone drinks at least one, 40 drink both. How many people? (2016 Q28)","s":["Both = 72 + 44 − 100 = 16%.","16% = 40 people.","Total = 40 × 100/16 = 250."],"a":"250"},"tr":{"q":"In a class, 65% passed English, 60% passed Maths and 30% failed in both. What % passed both?","s":["Failed English 35%, failed Maths 40%.","Failed at least one = 35 + 40 − 30 = 45%.","Passed both = 100 − 45 = 55%."],"o":["55%","45%","30%","25%"],"a":0},"trap":"Remember to subtract the ‘both’ group once.","fast":{"trick":"Both = A% + B% − (100 − neither)%.","ex":["72 + 44 − 100 = 16% = 40","1% = 2.5 → 250"],"tr":["65 + 60 − 70","= 55%"],"sec":15}}]},"a4":{"title":"Profit, loss & discount","sec":"Arithmetic","why":"About 5 questions every year.","method":["Profit and loss % are always on COST price. Discount is always on MARKED price.","SP = CP × (100 + gain%)/100. CP = SP × 100/(100 + gain%).","Chain of sellers: CP = final price ÷ (1+a)(1+b)(1+c).","Profit at SP₁ equals loss at SP₂ → CP = (SP₁ + SP₂)/2.","False weight: gain% = (true − false)/false × 100."],"tips":["Same SP, gain x% on one and loss x% on other → overall loss x²/100 %.","Mark-up m% then discount d% → net = m − d − md/100.","SP of a items = CP of b items → gain% = (b − a)/a × 100."],"facts":[["2016 Q26","10%, 15%, 25% chain; retail ₹1,265 → cost ₹800"],["2016 Q29","Two TVs ₹20,000, ±15% → loss 2.25%"],["2016 Q31","Profit at 1,470 = loss at 1,050 → CP 1,260; for 30% → 1,638"]],"ex":["Manufacturer gains 10%, wholesaler 15%, retailer 25%. Retail price ₹1,265. Production cost? (2016)",["Multiply the factors: 1.10 × 1.15 × 1.25 = 1.58125.","1265 ÷ 1.58125 = 800.","Answer: ₹800."]],"qs":["q25","q26","q27","q28","q29","q30","q31","q32"],"day":"d6","models":[{"name":"Basic profit and loss","idea":"Profit or loss % is ALWAYS calculated on the cost price (CP). Selling price (SP) is what you receive.","steps":["Profit = SP − CP; Profit % = Profit/CP × 100.","SP = CP × (100 + P%)/100; SP = CP × (100 − L%)/100.","CP = SP × 100/(100 + P%)."],"ex":{"q":"By selling an article for ₹540 a man loses 10%. At what price should he sell to gain 15%?","s":["CP = 540 × 100/90 = ₹600.","SP for 15% gain = 600 × 115/100.","= ₹690."],"a":"₹690"},"tr":{"q":"An article costing ₹800 is sold for ₹920. Profit %?","s":["Profit = 920 − 800 = 120.","Profit % = 120/800 × 100.","= 15%."],"o":["12%","120%","13.04%","15%"],"a":3},"trap":"Dividing profit by SP (120/920 = 13%) is wrong — always divide by CP.","fast":{"trick":"Jump between two % directly: new SP = old SP × (100 + new%) ÷ (100 + old%). Loss = minus.","ex":["540 × 115/90 = 6 × 115","= ₹690"],"tr":["Profit 120 on 800 → 120/8","= 15%"],"sec":15}},{"name":"Same selling price, gain x% and loss x%","idea":"If two items are sold at the SAME price, one at x% gain and the other at x% loss, the seller always loses overall, because the loss-making item cost more.","steps":["Overall loss % = x²/100.","To get the rupee loss, find each CP: SP × 100/(100 + x) and SP × 100/(100 − x)."],"ex":{"q":"A shopkeeper sells two TVs for ₹20,000 each, gaining 15% on one and losing 15% on the other. Result? (2016 Q29)","s":["Same SP, same 15% → loss.","Loss % = 15²/100 = 2.25%.","Answer: loss of 2.25%."],"a":"Loss of 2.25%"},"tr":{"q":"Two watches are sold at ₹990 each, one at 10% gain and one at 10% loss. The overall result is:","s":["CP₁ = 990/1.1 = 900; CP₂ = 990/0.9 = 1,100. Total CP = 2,000.","Total SP = 1,980.","Loss of ₹20 (that is 1% = 10²/100)."],"o":["No profit no loss","Loss of ₹10","Loss of ₹20","Gain of ₹20"],"a":2},"trap":"It is never ‘no profit no loss’ in this model.","fast":{"trick":"Same SP, x% gain + x% loss → ALWAYS loss of x²/100 %.","ex":["15²/100","= 2.25% loss"],"tr":["1% loss; total CP = 990/1.1 + 990/0.9 = 900 + 1,100 = 2,000","1% of 2,000 = ₹20 loss"],"sec":20}},{"name":"Profit at one price equals loss at another","idea":"If selling at SP₁ gives the same profit as the loss at SP₂, the cost price is exactly halfway between them.","steps":["CP = (SP₁ + SP₂)/2.","Then apply the required profit % to this CP."],"ex":{"q":"Profit on selling at ₹1,470 equals loss on selling at ₹1,050. To make 30% profit, sell at? (2016 Q31)","s":["CP = (1,470 + 1,050)/2 = ₹1,260.","30% profit: 1,260 × 1.3.","= ₹1,638."],"a":"₹1,638"},"tr":{"q":"Profit at ₹1,820 equals loss at ₹1,380. For 25% profit, SP should be:","s":["CP = (1,820 + 1,380)/2 = ₹1,600.","1,600 × 1.25.","= ₹2,000."],"o":["₹1,920","₹2,000","₹2,080","₹1,960"],"a":1},"fast":{"trick":"Profit at P₁ = loss at P₂ → CP = (P₁ + P₂)/2.","ex":["CP = (1,470 + 1,050)/2 = 1,260","× 1.3 = ₹1,638"],"tr":["CP = (1,820 + 1,380)/2 = 1,600","× 1.25 = ₹2,000"],"sec":15}},{"name":"Marked price, discount and successive discounts","idea":"The shop puts a marked price (MP) above cost and then gives a discount on the MP. Profit is still measured on CP.","steps":["SP = MP × (100 − d)/100.","Two discounts d₁, d₂ = one discount of d₁ + d₂ − d₁d₂/100.","Mark-up m% and discount d% → net profit % = m − d − md/100.","Take MP = 100 to make the arithmetic easy."],"ex":{"q":"A TV with MP ₹16,000 is bought at successive discounts of 20% and 10%; ₹480 is spent on transport; it is sold for ₹15,000. Gain %? (2016 Q30)","s":["Cost = 16,000 × 0.8 × 0.9 = ₹11,520; plus 480 = ₹12,000.","Profit = 15,000 − 12,000 = 3,000.","Gain % = 3,000/12,000 × 100 = 25%."],"a":"25%"},"tr":{"q":"Goods are marked 25% above cost and sold at a 12% discount. Profit %?","s":["Take CP = 100 → MP = 125.","SP = 125 × 0.88 = 110.","Profit = 10%."],"o":["10%","12%","13%","37%"],"a":0},"trap":"Two discounts of 20% and 10% are NOT 30% — they equal 28%.","fast":{"trick":"Two discounts a, b → single a + b − ab/100 · Mark up m, discount d → profit m − d − md/100.","ex":["20 & 10 → 28% off → 11,520 + 480 = 12,000","3,000/12,000 = 25%"],"tr":["25 − 12 − (25 × 12/100 = 3)","= 10%"],"sec":30}},{"name":"Chain of sellers (manufacturer → wholesaler → retailer)","idea":"Each seller adds his profit on his own cost. So the profits multiply, not add.","steps":["Final price = Cost × (1 + a)(1 + b)(1 + c).","Cost = Final price ÷ (1 + a)(1 + b)(1 + c)."],"ex":{"q":"Profits of 10%, 15% and 25%; retail price ₹1,265. Production cost? (2016 Q26)","s":["Multiplier = 1.10 × 1.15 × 1.25 = 1.58125.","Cost = 1,265 ÷ 1.58125.","= ₹800."],"a":"₹800"},"tr":{"q":"Profits of 10%, 20% and 25%; customer pays ₹2,970. Manufacturer’s cost?","s":["1.1 × 1.2 × 1.25 = 1.65.","2,970 ÷ 1.65.","= ₹1,800."],"o":["₹1,900","₹2,000","₹1,600","₹1,800"],"a":3},"fast":{"trick":"Write the profits as fractions (10% = 11/10, 15% = 23/20, 25% = 5/4) and cancel.","ex":["11/10 × 23/20 × 5/4 = 1265/800","Cost = 1,265 × 800/1,265 = ₹800"],"tr":["11/10 × 6/5 × 5/4 = 33/20","2,970 × 20/33 = ₹1,800"],"sec":30}},{"name":"False weights and ‘articles’ problems","idea":"A dishonest dealer gives less goods but charges the full price — the goods he keeps are his gain. ‘SP of a articles = CP of b articles’ compares counts directly.","steps":["False weight: gain % = (true weight − false weight)/false weight × 100.","SP of a items = CP of b items → gain % = (b − a)/a × 100 (loss if b < a).","Buy x for ₹p, sell y for ₹q: compare per-item prices p/x and q/y."],"ex":{"q":"A dealer sells at cost price but uses a 900 g weight for 1 kg. Gain %?","s":["He gives 900 g but charges for 1000 g.","Gain = 100/900 × 100.","= 11 1/9%."],"a":"11 1/9%"},"tr":{"q":"The SP of 15 articles equals the CP of 20 articles. Gain %?","s":["Gain = (20 − 15)/15 × 100.","= 5/15 × 100.","= 33⅓%."],"o":["30%","25%","33⅓%","20%"],"a":2},"trap":"Divide by the FALSE weight (900), not by 1000.","fast":{"trick":"False weight: gain % = error ÷ (weight actually given) × 100 · SP of x = CP of y → gain (y − x)/x.","ex":["100/900 = 1/9","= 11 1/9%"],"tr":["(20 − 15)/15 = 1/3","= 33⅓%"],"sec":10}}]},"a5":{"title":"Simple & compound interest","sec":"Arithmetic","why":"7 questions in 2016; at least 2–3 every year.","method":["SI = PRT/100. A sum doubles in 100/R years at SI.","CI: A = P(1 + R/100)ⁿ. Half-yearly → R/2, 2n periods.","CI − SI for 2 years = P(R/100)²; for 3 years = P(R/100)²(3 + R/100).","Amounts in consecutive years A₁, A₂ → R = (A₂ − A₁)/A₁ × 100.","Depreciation: V = P(1 − R/100)ⁿ."],"tips":["10% for 2 yrs CI = 21% of P; 3 yrs = 33.1%. 20% for 2 yrs = 44%.","If a sum doubles in t years at CI, it becomes 4× in 2t, 8× in 3t."],"facts":[["2016 Q7","CI − SI = 631 at 10%, 2 yrs → ₹63,100"],["2016 Q8","80,000 → 96,800 at 10% → 2 years"],["2016 Q13","CI 1 yr ₹600 at 8% → CI 2 yrs ₹1,248"]],"ex":["CI − SI on a sum for 2 years at 10% is ₹631. Find the sum. (2016)",["Difference = P × (10/100)² = P × 0.01.","P = 631 ÷ 0.01 = 63,100.","Answer: ₹63,100."]],"qs":["q33","q34","q35","q36","q37","q38","q39","q40"],"day":"d5","models":[{"name":"Simple interest and doubling","idea":"Simple interest is the same every year because it is always calculated on the original principal.","steps":["SI = P × R × T / 100. Amount = P + SI.","A sum becomes n times in T years → R = (n − 1) × 100 / T.","Doubling time = 100/R years."],"ex":{"q":"A sum doubles in 8 years at SI. In how many years will it become 4 times?","s":["Doubling → interest = P in 8 years.","4 times → interest = 3P → 3 × 8 years.","= 24 years."],"a":"24 years"},"tr":{"q":"SI on ₹8,000 at 9% per annum for 3 years:","s":["8,000 × 9 × 3 / 100.","= 72 × 30.","= ₹2,160."],"o":["₹2,360","₹2,160","₹2,700","₹720"],"a":1},"trap":"Becoming 4 times means interest of 3P, not 4P.","fast":{"trick":"SI: doubling = 100% interest. n times = (n − 1) × 100% → (n − 1) × doubling time.","ex":["2× = 100% in 8 yrs","4× = 300% → 24 yrs"],"tr":["9% × 3 = 27%","27% of 8,000 = ₹2,160"],"sec":10}},{"name":"Compound interest (yearly and half-yearly)","idea":"In compound interest, each year’s interest is added to the principal and earns interest next year.","steps":["A = P(1 + R/100)ⁿ; CI = A − P.","Half-yearly: rate R/2, periods 2n. Quarterly: R/4, 4n.","Handy: 10% for 2 yrs → ×1.21; 3 yrs → ×1.331; 20% for 2 yrs → ×1.44."],"ex":{"q":"₹80,000 at 10% CI gives interest ₹16,800. For how many years? (2016 Q8)","s":["Amount = 96,800 → 96,800/80,000 = 1.21.","1.21 = 1.1².","2 years."],"a":"2 years"},"tr":{"q":"CI on ₹10,000 at 10% per annum for 1 year, compounded half-yearly:","s":["Rate per half-year 5%, 2 periods.","10,000 × 1.05² = 11,025.","CI = ₹1,025."],"o":["₹1,025","₹1,050","₹1,000","₹1,100"],"a":0},"trap":"For half-yearly, halve the rate AND double the time.","fast":{"trick":"At 10% CI: 2 yrs = 21%, 3 yrs = 33.1%. Half-yearly → half rate, double periods.","ex":["16,800/80,000 = 21%","→ 2 years"],"tr":["5% twice = 10.25%","₹1,025"],"sec":15}},{"name":"Difference between CI and SI","idea":"In year 1, CI and SI are equal. The extra in CI comes from ‘interest on interest’.","steps":["2 years: CI − SI = P(R/100)².","3 years: CI − SI = P(R/100)²(3 + R/100)."],"ex":{"q":"CI − SI on a sum for 2 years at 10% is ₹631. Find the sum. (2016 Q7)","s":["631 = P × (0.1)² = 0.01P.","P = 631 / 0.01.","= ₹63,100."],"a":"₹63,100"},"tr":{"q":"CI − SI on ₹5,000 for 3 years at 10%:","s":["5,000 × 0.01 × (3 + 0.1).","= 50 × 3.1.","= ₹155."],"o":["₹150","₹50","₹165","₹155"],"a":3},"trap":"The 3-year difference is not 3 × the 2-year difference.","fast":{"trick":"CI − SI: 2 yrs = P(R/100)² · 3 yrs = P(R/100)²(3 + R/100).","ex":["631 = P × 1/100","P = ₹63,100"],"tr":["5,000 × 1/100 × 3.1","= ₹155"],"sec":15}},{"name":"Finding rate or principal from two amounts (CI)","idea":"With compound interest, the amount grows by the same FACTOR each year. Two amounts for consecutive years give the rate directly.","steps":["Consecutive years A₁, A₂: R = (A₂ − A₁)/A₁ × 100.","Amounts after n and 2n years: factor for n years = A₂/A₁ → P = A₁ ÷ factor.","A sum doubles in t years → 8 times in 3t years."],"ex":{"q":"A sum amounts to ₹7,350 in 2 years and ₹8,575 in 3 years at CI. Rate? Principal? (2018 Q8)","s":["Interest in year 3 = 8,575 − 7,350 = 1,225 on 7,350 → R = 16⅔% (1/6).","P = 7,350 ÷ (7/6)² = 7,350 × 36/49.","P = ₹5,400."],"a":"16⅔%, ₹5,400"},"tr":{"q":"A sum becomes ₹9,680 in 2 years and ₹10,648 in 3 years at CI. The rate is:","s":["Increase = 968 on 9,680.","968/9,680 = 0.1.","R = 10%."],"o":["12%","8%","10%","9%"],"a":2},"fast":{"trick":"Consecutive-year CI amounts: rate = increase ÷ earlier amount.","ex":["1,225/7,350 = 1/6 = 16⅔%","P = 7,350 × 36/49 = ₹5,400"],"tr":["968/9,680","= 10%"],"sec":25}},{"name":"SI amounts after two different times","idea":"Under simple interest the amount rises by the same interest every year. The difference between two amounts is the interest for the gap in years.","steps":["Yearly SI = (A₂ − A₁) / (t₂ − t₁).","Principal = A₁ − t₁ × yearly SI.","Rate = yearly SI / P × 100."],"ex":{"q":"A sum becomes ₹1,120 in 3 years and ₹1,200 in 5 years at SI. Find P and R.","s":["2 years’ interest = 80 → ₹40 per year.","P = 1,120 − 3 × 40 = ₹1,000.","R = 40/1,000 × 100 = 4%."],"a":"P = ₹1,000, R = 4%"},"tr":{"q":"A sum becomes ₹720 in 2 years and ₹1,020 in 7 years at SI. The principal is:","s":["5 years’ interest = 300 → ₹60 a year.","P = 720 − 2 × 60.","= ₹600."],"o":["₹500","₹600","₹660","₹540"],"a":1},"fast":{"trick":"SI: extra years' interest = difference of amounts → per-year interest → back to P.","ex":["2 yrs = 80 → 40/yr → P = 1,120 − 120 = 1,000","R = 40/1,000 = 4%"],"tr":["5 yrs = 300 → 60/yr","P = 720 − 120 = ₹600"],"sec":20}},{"name":"CI and SI together on the same sum","idea":"If SI and CI for 2 years on the same sum at the same rate are given, the extra CI is the interest earned on ONE year’s SI.","steps":["SI per year = SI(2 years)/2.","Extra (CI − SI) = rate × one year’s SI → R = extra / one year’s SI × 100.","P = one year’s SI ÷ R × 100."],"ex":{"q":"SI for 2 years is ₹600 and CI for 2 years is ₹630 at the same rate. Find the sum.","s":["One year’s SI = 300.","Extra 30 = 300 × R/100 → R = 10%.","P = 300 / 0.10 = ₹3,000."],"a":"₹3,000"},"tr":{"q":"SI for 2 years is ₹400 and CI is ₹420 at the same rate. The rate is:","s":["One year’s SI = 200.","Extra 20 = 200 × R/100.","R = 10%."],"o":["10%","5%","20%","8%"],"a":0},"fast":{"trick":"CI − SI (2 yrs) = interest on one year's SI. R = extra ÷ (SI/2).","ex":["1-yr SI = 300; extra 30 → R = 10%","P = 300 ÷ 10% = ₹3,000"],"tr":["1-yr SI = 200; extra 20","20/200 = 10%"],"sec":15}}]},"a6":{"title":"Ratio, ages, mixtures & partnership","sec":"Arithmetic","why":"5–8 questions across these four.","method":["Ages: write both ages with one variable x, form one equation from the second condition.","Combine ratios: A:B = a:b, B:C = c:d → A:B:C = ac : bc : bd.","Alligation: cheaper : dearer = (dearer − mean) : (mean − cheaper).","Replace x litres from V litres n times: pure left = V(1 − x/V)ⁿ.","Partnership: profit share ∝ capital × time. Split the time when capital changes."],"tips":["When water is added, MILK stays fixed — build the answer from the milk.","Fractions ratio (1/2 : 1/3 : 1/4) → multiply by the LCM (12) → 6 : 4 : 3."],"facts":[["2016 Q14","3 yrs ago 4:3, 2 yrs later 5:4 → sum 41"],["2016 Q15","Volumes 3:4:5 mixtures → 157:53"],["2016 Q32","A, B, C changing capitals → 7:9:6"]],"ex":["Ages ratio 3 years ago was 4 : 3; two years hence it will be 5 : 4. Sum of present ages? (2016)",["Ages 3 years ago: 4x, 3x → in 2 years: 4x + 5, 3x + 5.","(4x + 5)/(3x + 5) = 5/4 → 16x + 20 = 15x + 25 → x = 5.","Present ages 23 and 18 → sum 41."]],"qs":["q41","q42","q43","q44","q45","q46","q47","q48"],"day":"d5","models":[{"name":"Dividing an amount in a ratio (and combining ratios)","idea":"A ratio tells you how many equal ‘parts’ each person gets. Add the parts, find the value of one part, then multiply.","steps":["Share of A = A’s parts / total parts × amount.","Fractions as ratio (1/2 : 1/3 : 1/4): multiply all by the LCM of denominators (12) → 6 : 4 : 3.","Joining A : B and B : C: make B the same in both, then write A : B : C."],"ex":{"q":"₹78,400 is divided among A, B, C with A : B = 5 : 4 and B : C = 6 : 11. Find B’s share. (2018 Q41 pattern)","s":["Make B equal: 5 : 4 = 15 : 12 and 6 : 11 = 12 : 22 → A : B : C = 15 : 12 : 22 (sum 49).","One part = 78,400 / 49 = 1,600.","B = 12 × 1,600 = ₹19,200."],"a":"₹19,200"},"tr":{"q":"₹7,800 is divided in the ratio 1/2 : 1/3 : 1/4. The largest share is:","s":["Multiply by 12 → 6 : 4 : 3 (sum 13).","One part = 7,800 / 13 = 600.","Largest = 6 × 600 = ₹3,600."],"o":["₹3,900","₹2,600","₹2,400","₹3,600"],"a":3},"trap":"With fraction ratios, the biggest fraction gets the biggest share — check your answer makes sense.","fast":{"trick":"Join ratios by making the shared term equal. Fractions → multiply by the LCM of bottoms.","ex":["15 : 12 and 12 : 22 → 15 : 12 : 22 (sum 49)","B = 12/49 × 78,400 = ₹19,200"],"tr":["× 12 → 6 : 4 : 3 (sum 13)","6/13 × 7,800 = ₹3,600"],"sec":25}},{"name":"Problems on ages","idea":"Everyone ages by the same number of years. Write the present ages with one letter (x) and turn the second sentence into an equation.","steps":["Let the ages be in the given ratio: ax and bx (for ‘n years ago’ ratios, let those past ages be ax and bx).","Move forward or back in time by adding/subtracting the SAME years to both.","Form the equation from the other condition and solve for x.","Check the answer against both conditions."],"ex":{"q":"Three years ago Ramu : Gopi was 4 : 3; two years later it will be 5 : 4. Sum of present ages? (2016 Q14)","s":["Ages 3 years ago: 4x and 3x. Two years from now (5 years after that): 4x + 5 and 3x + 5.","(4x + 5)/(3x + 5) = 5/4 → 16x + 20 = 15x + 25 → x = 5.","Present ages 23 and 18 → sum 41."],"a":"41"},"tr":{"q":"A father is 4 times as old as his son. In 16 years he will be twice as old. Son’s present age?","s":["Son x, father 4x.","4x + 16 = 2(x + 16) → 2x = 16.","x = 8 years."],"o":["16 years","10 years","8 years","12 years"],"a":2},"trap":"Add the years to BOTH people.","fast":{"trick":"Ages: fastest is to TEST THE OPTIONS in both conditions. Else use 4x, 3x units.","ex":["3 yrs ago 4x, 3x → 5 yrs later (4x+5) : (3x+5) = 5 : 4 → x = 5","Now 23 + 18 = 41"],"tr":["Try 8: father 32 → in 16 yrs 24 & 48 = 1 : 2 ✔","8 years"],"sec":30}},{"name":"Alligation (mixing two prices or two strengths)","idea":"When you mix a cheap item and a costly item to get a middle price, the quantities are in the inverse ratio of their distances from the mean.","steps":["Cheaper : Dearer = (Dearer − Mean) : (Mean − Cheaper).","Works for prices, percentages, speeds, marks — any weighted average of two groups."],"ex":{"q":"Rice at ₹40/kg is mixed with rice at ₹55/kg to get ₹46/kg. Ratio?","s":["Dearer − Mean = 55 − 46 = 9.","Mean − Cheaper = 46 − 40 = 6.","Cheaper : Dearer = 9 : 6 = 3 : 2."],"a":"3 : 2"},"tr":{"q":"Tea at ₹120/kg and ₹180/kg is mixed to make ₹160/kg. The ratio cheaper : dearer is:","s":["Dearer − Mean = 20; Mean − Cheaper = 40.","Cheaper : Dearer = 20 : 40.","= 1 : 2."],"o":["2 : 1","1 : 2","1 : 3","3 : 1"],"a":1},"trap":"The ratio is ‘crossed’: the cheaper quantity goes with the dearer price’s distance.","fast":{"trick":"Alligation: cheaper : dearer = (dearer − mean) : (mean − cheaper).","ex":["(55 − 46) : (46 − 40) = 9 : 6","= 3 : 2"],"tr":["(180 − 160) : (160 − 120) = 20 : 40","= 1 : 2"],"sec":10}},{"name":"Adding water and repeated replacement","idea":"When water is added to milk, the amount of MILK stays fixed. When part of a mixture is removed and replaced, the pure liquid falls by the same fraction each time.","steps":["Adding water: keep milk fixed, find the new total from the required ratio, subtract the old total.","Replacement: pure left = V × (1 − x/V)ⁿ, where x litres are removed and replaced n times."],"ex":{"q":"40 L of milk; 4 L is taken out and replaced with water, three times. Milk left?","s":["Each time milk becomes 9/10 of before (removing 4 of 40).","40 × (0.9)³ = 40 × 0.729.","= 29.16 L."],"a":"29.16 L"},"tr":{"q":"30 L of mixture has milk : water = 7 : 3. How much water must be added to make it 3 : 2?","s":["Milk = 21 L, water = 9 L (milk stays 21).","For 3 : 2, water = 21 × 2/3 = 14 L.","Add 14 − 9 = 5 L."],"o":["5 L","9 L","7 L","4 L"],"a":0},"trap":"Subtracting 4 L three times (giving 28 L) is wrong — later draws remove a mixture, not pure milk.","fast":{"trick":"Replacement: left = start × (1 − taken/total)ⁿ. Adding water: milk stays fixed.","ex":["40 × (9/10)³ = 40 × 0.729","= 29.16 L"],"tr":["Milk 21 → water must be 14","14 − 9 = 5 L"],"sec":20}},{"name":"Partnership (capital × time)","idea":"Profit is shared in the ratio of each partner’s ‘capital × months’. When someone adds or withdraws money, split the year into parts.","steps":["Share ratio = (capital₁ × months₁ + capital₂ × months₂ …) for each partner.","Working partner’s salary or interest: deduct it first, then share the rest.","Donation/charity from profit: share only what is left."],"ex":{"q":"A and B start with ₹16,000 and ₹12,000. After 3 months A withdraws ₹5,000 and B adds ₹5,000. After 3 more months C joins with ₹21,000. Profit ratio for the year? (2016 Q32)","s":["A = 16,000 × 3 + 11,000 × 9 = 1,47,000.","B = 12,000 × 3 + 17,000 × 9 = 1,89,000; C = 21,000 × 6 = 1,26,000.","Ratio 147 : 189 : 126 = 7 : 9 : 6."],"a":"7 : 9 : 6"},"tr":{"q":"A invests ₹45,000 for 12 months; B invests ₹60,000 for 6 months. Profit ₹15,000. B’s share?","s":["A = 5,40,000; B = 3,60,000 → 3 : 2.","B = 2/5 × 15,000.","= ₹6,000."],"o":["₹9,000","₹8,571","₹7,500","₹6,000"],"a":3},"trap":"C joined after 6 months, so C’s money counts for 6 months only.","fast":{"trick":"Profit ratio = capital × months. Work in thousands and cancel.","ex":["A 16×3 + 11×9 = 147 · B 12×3 + 17×9 = 189 · C 21×6 = 126","÷ 21 → 7 : 9 : 6"],"tr":["45×12 : 60×6 = 3 : 2","B = 2/5 × 15,000 = ₹6,000"],"sec":40}},{"name":"Mixing several containers","idea":"When containers with different ratios are poured together, add the actual quantities of each liquid — never add the ratios.","steps":["Choose a convenient volume for each container (use the LCM of the ratio sums).","Find milk and water in each container.","Add all milk and all water, then simplify the ratio."],"ex":{"q":"Volumes 3 : 4 : 5; milk : water 4 : 1, 3 : 1 and 5 : 2. Mixed together, the ratio is? (2016 Q15)","s":["Ratio sums 5, 4, 7 → LCM 140. Volumes 420, 560, 700.","Milk: 336 + 420 + 500 = 1,256. Water: 84 + 140 + 200 = 424.","1,256 : 424 = 157 : 53."],"a":"157 : 53"},"tr":{"q":"Two equal glasses have milk : water 3 : 1 and 1 : 1. Mixed together, the ratio is:","s":["Take 4 L each (LCM of 4 and 2).","Milk 3 + 2 = 5; water 1 + 2 = 3.","5 : 3."],"o":["3 : 2","4 : 2","5 : 3","2 : 1"],"a":2},"fast":{"trick":"Add milk parts and water parts separately (fraction × volume).","ex":["Milk = 12/5 + 3 + 25/7 → ×35: 84 + 105 + 125 = 314 of 420","314 : 106 = 157 : 53"],"tr":["Milk 3/4 + 1/2 = 5/4, water 1/4 + 1/2 = 3/4","5 : 3"],"sec":40}}]},"a7":{"title":"Averages","sec":"Arithmetic","why":"2–4 questions, often with data sufficiency.","method":["Average = total ÷ count. Always convert to TOTALS first.","Overlapping groups (first 6, last 6 of 11) → middle term = sum of group totals − overall total.","New member: new total − old total = new person’s value.","Average speed for equal distances = 2xy/(x + y).","Consecutive numbers: average = middle number."],"tips":["If the average rises by k when one person joins, the newcomer = old average + k × (new count).","Wrong entry: correction ÷ count changes the average."],"facts":[["2016 Q19","Boys 55 avg 50, class avg 45.5 → girls 40"],["2016 Q21","Library: 5 Sundays in a month starting Saturday → 285"],["2016 Q35","Run-rate needed for the remaining overs"]],"ex":["100 students; boys are 10 more than girls. Boys average 50 kg, class average 45.5 kg. Girls’ average? (2016)",["Boys 55, girls 45. Total = 4550.","Boys’ total = 2750 → girls’ total = 1800.","1800 ÷ 45 = 40 kg."]],"qs":["q49","q50","q51","q52","q53","q54","q55","q56"],"day":"d4","models":[{"name":"Basic average and natural numbers","idea":"Average = total ÷ count. Most average questions become easy once you change averages into TOTALS.","steps":["Total = average × count.","Average of 1 to n = (n + 1)/2. Average of first n odd numbers = n; first n even numbers = n + 1.","Average of equally spaced numbers = (first + last)/2."],"ex":{"q":"Find the average of all even numbers from 2 to 100.","s":["Equally spaced → (first + last)/2.","(2 + 100)/2.","= 51."],"a":"51"},"tr":{"q":"The average of the first 25 natural numbers is:","s":["(n + 1)/2 with n = 25.","26/2.","= 13."],"o":["12.5","13","12","26"],"a":1},"fast":{"trick":"Evenly spaced numbers: average = (first + last)/2. First n natural numbers → (n + 1)/2.","ex":["(2 + 100)/2","= 51"],"tr":["(25 + 1)/2","= 13"],"sec":5}},{"name":"Adding or removing a person","idea":"When a person joins, the new total minus the old total is that person’s value.","steps":["Newcomer = new total − old total = (n + 1) × new avg − n × old avg.","Replacement: new person = old person ± (change in average × count).","Leaving: leaver = old total − new total."],"ex":{"q":"The average age of 30 students is 14. With the teacher, the average is 15. Teacher’s age?","s":["New total = 31 × 15 = 465.","Old total = 30 × 14 = 420.","Teacher = 45 years."],"a":"45 years"},"tr":{"q":"The average weight of 8 people rises by 2.5 kg when a 65 kg person is replaced. New person’s weight?","s":["Total rises by 8 × 2.5 = 20 kg.","New person = 65 + 20.","= 85 kg."],"o":["85 kg","75 kg","67.5 kg","80 kg"],"a":0},"fast":{"trick":"New person = old average + (new count × change). Replacement: new = old + n × change.","ex":["14 + 31 × 1","= 45"],"tr":["65 + 8 × 2.5","= 85 kg"],"sec":10}},{"name":"Overlapping groups (find the middle value)","idea":"When the first group and last group share one value, adding both group totals counts it twice.","steps":["Middle value = (first group total + last group total) − overall total."],"ex":{"q":"Average of 11 results is 50; first 6 average 49; last 6 average 52. The 6th result?","s":["First 6 total = 294; last 6 total = 312.","Sum = 606; overall total = 550.","6th = 606 − 550 = 56."],"a":"56"},"tr":{"q":"Average of 11 numbers is 60; first 6 average 58; last 6 average 63. The 6th number?","s":["348 + 378 = 726.","Overall total = 660.","6th = 66."],"o":["63","60","62","66"],"a":3},"fast":{"trick":"Middle value = (first-part sum + last-part sum) − total sum.","ex":["294 + 312 − 550","= 56"],"tr":["348 + 378 − 660","= 66"],"sec":15}},{"name":"Batsman’s new average","idea":"A score in the new innings changes the average. Let the old average be x and use totals.","steps":["n·x + new score = (n + 1)(x + rise).","Solve for x; new average = x + rise.","Shortcut: new average = new score − n × rise."],"ex":{"q":"A batsman scores 87 in the 17th innings, raising his average by 3. New average?","s":["Shortcut: 87 − 16 × 3.","= 87 − 48.","= 39."],"a":"39"},"tr":{"q":"A player scores 120 in his 11th innings and raises his average by 5. New average?","s":["120 − 10 × 5.","= 70.","Check: old 65 × 10 = 650; +120 = 770; 770/11 = 70 ✔."],"o":["65","60","70","75"],"a":2},"fast":{"trick":"New average = latest score − (old innings × rise).","ex":["87 − 16 × 3","= 39"],"tr":["120 − 10 × 5","= 70"],"sec":10}},{"name":"Wrong entry corrected","idea":"If a value was wrongly copied, the total is wrong by the difference. Spread that difference over all items.","steps":["Correct average = old average ± (correct value − wrong value)/n."],"ex":{"q":"Mean of 50 observations is 30. 48 was recorded as 23. Correct mean?","s":["Total is short by 48 − 23 = 25.","25/50 = 0.5.","Correct mean = 30.5."],"a":"30.5"},"tr":{"q":"Average height of 600 police is 150 cm. Later it is found that 90 cm was recorded instead of 150 cm for one person. Correct average?","s":["Short by 60 cm.","60/600 = 0.1.","Correct = 150.1 cm."],"o":["149.9 cm","150.1 cm","150.5 cm","151 cm"],"a":1},"fast":{"trick":"Correct mean = old mean + (correct − wrong) ÷ n.","ex":["30 + 25/50","= 30.5"],"tr":["150 + 60/600","= 150.1 cm"],"sec":10}},{"name":"Average speed","idea":"Average speed is total distance ÷ total time — not the average of speeds.","steps":["Equal distances at x and y: 2xy/(x + y).","Equal TIMES at x and y: (x + y)/2.","Otherwise: total distance / total time."],"ex":{"q":"A car covers half the distance at 40 km/h and the other half at 60 km/h. Average speed?","s":["Equal distances → 2 × 40 × 60/(40 + 60).","= 4,800/100.","= 48 km/h."],"a":"48 km/h"},"tr":{"q":"A man goes to office at 30 km/h and returns at 20 km/h. Average speed?","s":["2 × 30 × 20/50.","= 1,200/50.","= 24 km/h."],"o":["24 km/h","25 km/h","26 km/h","22 km/h"],"a":0},"trap":"Averaging 40 and 60 to get 50 is wrong when the distances are equal.","fast":{"trick":"Equal distances: average speed = 2xy/(x + y). Never (x + y)/2.","ex":["2 × 40 × 60/100","= 48 km/h"],"tr":["2 × 30 × 20/50","= 24 km/h"],"sec":10}}]},"a8":{"title":"Time & work, pipes","sec":"Arithmetic","why":"3–4 questions every year.","method":["Take total work = LCM of the days. Each person’s rate = work ÷ days.","Together: add rates; leak or emptying pipe: subtract its rate.","M₁D₁H₁/W₁ = M₂D₂H₂/W₂.","‘k times as efficient’ → rates k : 1 → time 1 : k.","Wages are shared in the ratio of work done (rate × days)."],"tips":["Two people: A×B/(A+B) days.","Leaving early/joining late: write each person’s days worked and add their fractions to 1."],"facts":[["2016 Q18","6 men, 10 days per wall → 3 walls in 5 days needs 18 double-efficiency men"],["2016 Q33","A twice B, together 18 → A alone 27"],["2016 Q34","Share of C → ₹750"]],"ex":["A is twice as efficient as B; together they finish in 18 days. A alone? (2016)",["Rates A : B = 2 : 1 → total 3 units/day.","Work = 3 × 18 = 54 units.","A alone = 54 ÷ 2 = 27 days."]],"qs":["q57","q58","q59","q60","q61","q62","q63","q64"],"day":"d4","models":[{"name":"Two or more people working together (LCM method)","idea":"Take the total work as the LCM of the days. Then each person’s daily work is a whole number, and adding is easy.","steps":["Total work = LCM of the days.","Daily work of each = total ÷ their days.","Together: total ÷ (sum of daily work).","Two people: A × B / (A + B)."],"ex":{"q":"A can do a job in 10 days and B in 15 days. Together?","s":["Work = LCM(10, 15) = 30 units.","A = 3/day, B = 2/day → 5/day.","30/5 = 6 days."],"a":"6 days"},"tr":{"q":"A and B together take 12 days; B alone takes 30 days. A alone?","s":["Work = 60 units. Together 5/day; B 2/day.","A = 3/day.","A alone = 60/3 = 20 days."],"o":["18 days","24 days","42 days","20 days"],"a":3},"fast":{"trick":"Together = ab/(a + b) · If together T and one takes b: other = bT/(b − T).","ex":["10 × 15/25","= 6 days"],"tr":["30 × 12/18","= 20 days"],"sec":10}},{"name":"Someone leaves or joins","idea":"Write how many days each person actually worked. Their parts of the work must add up to the whole.","steps":["Work done by a person = (days worked) × (daily rate).","Sum of all work done = 1 (or the total units)."],"ex":{"q":"A can finish a job in 20 days. He works 5 days; B finishes the rest in 9 days. B alone?","s":["A does 5/20 = 1/4.","B does 3/4 in 9 days.","Full job: 9 × 4/3 = 12 days."],"a":"12 days"},"tr":{"q":"A and B can do a work in 10 and 15 days. They work together for 3 days, then A leaves. B finishes the rest in:","s":["Work = 30 units; together 5/day → 15 units in 3 days.","Left 15 units; B does 2/day.","7.5 days."],"o":["9 days","6 days","7.5 days","4.5 days"],"a":2},"fast":{"trick":"Total work = LCM units. Subtract work done, divide what's left by the remaining rate.","ex":["A does 5/20 = 1/4 → B does 3/4 in 9 days","B alone 12 days"],"tr":["LCM 30: A 3/day, B 2/day → 3 days = 15 units","15 left ÷ 2 = 7.5 days"],"sec":20}},{"name":"Efficiency (‘twice as fast’, ‘50% more efficient’)","idea":"Efficiency is daily work. If A is twice as efficient, A does 2 units for every 1 of B, and takes half the time.","steps":["Twice as efficient → rates 2 : 1, times 1 : 2.","50% more efficient → rates 3 : 2.","Total work = (sum of rates) × days together."],"ex":{"q":"A is twice as efficient as B; together they finish in 18 days. A alone? (2016 Q33)","s":["Rates 2 : 1 → 3 units/day together.","Work = 3 × 18 = 54 units.","A alone = 54/2 = 27 days."],"a":"27 days"},"tr":{"q":"A is 50% more efficient than B. Together they finish in 15 days. A alone?","s":["Rates 3 : 2 → 5 units/day.","Work = 75 units.","A = 75/3 = 25 days."],"o":["22.5 days","25 days","30 days","37.5 days"],"a":1},"fast":{"trick":"Efficiency = units per day: twice → 2 : 1, 50% more → 3 : 2. Total = sum × days.","ex":["(2 + 1) × 18 = 54","54 ÷ 2 = 27 days"],"tr":["(3 + 2) × 15 = 75","75 ÷ 3 = 25 days"],"sec":15}},{"name":"Men, days and hours (M₁D₁H₁ = M₂D₂H₂)","idea":"Total work = number of workers × days × hours. If the work changes, divide by the work too.","steps":["M₁ × D₁ × H₁ / W₁ = M₂ × D₂ × H₂ / W₂.","Different efficiencies: convert all into one type (e.g. 1 man = 1.5 women)."],"ex":{"q":"6 labourers build a wall in 10 days. How many labourers of double efficiency build 3 walls in 5 days? (2016 Q18)","s":["One wall = 6 × 10 = 60 labour-days; 3 walls = 180.","In 5 days you need 180/5 = 36 normal labourers.","Double efficiency → 18."],"a":"18"},"tr":{"q":"12 men working 6 hours a day finish in 18 days. 9 men working 8 hours a day will take:","s":["12 × 18 × 6 = 9 × D × 8.","1,296 = 72D.","D = 18 days."],"o":["18 days","16 days","20 days","24 days"],"a":0},"fast":{"trick":"M₁D₁H₁/W₁ = M₂D₂H₂/W₂ (double efficiency = ×2 men).","ex":["6 × 10 = M × 2 × 5/3","M = 18"],"tr":["12 × 6 × 18 = 9 × 8 × D","D = 18 days"],"sec":20}},{"name":"Sharing wages","idea":"Money is shared in the ratio of work done — the faster worker gets more.","steps":["Work ratio = rate × days worked for each person.","Share = work fraction × total wages."],"ex":{"q":"A and B take a job for ₹6,000. A alone 6 days, B alone 8 days; with C they finish in 3 days. C’s share? (2016 Q34)","s":["In 3 days A does 3/6 = 1/2, B does 3/8.","C does 1 − 1/2 − 3/8 = 1/8.","C’s share = 6,000/8 = ₹750."],"a":"₹750"},"tr":{"q":"A and B get ₹1,800 for a job. A alone 6 days, B alone 9 days; they work together. A’s share?","s":["Rates 1/6 : 1/9 = 3 : 2.","A = 3/5 × 1,800.","= ₹1,080."],"o":["₹900","₹1,200","₹720","₹1,080"],"a":3},"fast":{"trick":"Wages go in the ratio of WORK DONE.","ex":["In 3 days A 1/2, B 3/8 → C 1/8","6,000/8 = ₹750"],"tr":["Rates 1/6 : 1/9 = 3 : 2","3/5 × 1,800 = ₹1,080"],"sec":15}},{"name":"Pipes, cisterns and leaks","idea":"Filling pipes add work; emptying pipes and leaks subtract work. Otherwise it is the same as time and work.","steps":["Net rate = sum of filling rates − sum of emptying rates.","Time = 1 ÷ net rate (or total units ÷ net units).","Leak found from time difference: leak rate = normal rate − rate with leak."],"ex":{"q":"Taps A and B fill a tank in 6 and 8 hours; tap C empties it in 12 hours. All open together?","s":["Tank = 24 units. A 4, B 3, C −2 per hour.","Net 5 units/hour.","24/5 = 4 h 48 min."],"a":"4 h 48 min"},"tr":{"q":"A pipe fills a tank in 4 hours; a leak empties it in 12 hours. With the leak, the tank fills in:","s":["Tank = 12 units: pipe 3/h, leak −1/h.","Net 2/h.","12/2 = 6 hours."],"o":["16 hours","3 hours","6 hours","8 hours"],"a":2},"fast":{"trick":"LCM units: fill +, empty −. Filler a with leak b → ab/(b − a).","ex":["LCM 24: +4 +3 −2 = 5/h","24/5 = 4 h 48 min"],"tr":["4 × 12/8","= 6 hours"],"sec":15}}]},"a9":{"title":"Speed, trains, boats & races","sec":"Arithmetic","why":"About 5 questions a paper.","method":["km/h × 5/18 = m/s. m/s × 18/5 = km/h.","Train passing a pole: length/speed. Passing a platform: (train + platform)/speed.","Opposite directions → add speeds; same direction → subtract.","Boats: downstream b + s, upstream b − s → b = (D + U)/2, s = (D − U)/2.","Speed changes to a/b of usual → time becomes b/a of usual."],"tips":["Equal distances at x and y → average speed 2xy/(x + y) (not the simple average).","Meeting problems: first cover any head start, then divide the gap by the combined
