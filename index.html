g North. Q is at the right end and N is second from the right. M is to the immediate left of O. P is not at the left end. Who sits in the middle?","o":["O","P","N","M"],"w":["O is at position 2.","Q = 5, N = 4. M, O, P fill 1–3 with M just left of O and P not at 1 → M 1, O 2, P 3.","N is fourth.","M is at the left end."],"a":1,"tp":"r5","s":"Reasoning"},"q136":{"q":"Raju is older than Mohan but younger than Sita. Gita is older than Sita. Hari is the youngest. Who is the second oldest?","o":["Sita","Mohan","Gita","Raju"],"w":["Order: Gita > Sita > Raju > Mohan > Hari.","Mohan is fourth.","Gita is the oldest.","Raju is third."],"a":0,"tp":"r5","s":"Reasoning"},"q137":{"q":"How many squares are there in the figure?","o":["10","9","13","14"],"w":["Adds only the big outer square.","Counts only the small squares.","Misses the big square.","1×1: 9, 2×2: 4, 3×3: 1 → 14."],"a":3,"tp":"r6","f":"<svg viewBox=\"0 0 140 140\" width=\"140\" height=\"140\" role=\"img\" aria-label=\"3 by 3 grid\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><line x1=\"10\" y1=\"10\" x2=\"130\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"50\" x2=\"130\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"90\" x2=\"130\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"130\" x2=\"130\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"130\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>","s":"Reasoning"},"q138":{"q":"How many triangles are there in the figure?","o":["8","4","10","6"],"w":["Misses the combined triangles.","Counts only the smallest triangles.","Lines from the apex split the base into 4 parts. Triangles = 4 × 5 / 2 = 10 (choose any 2 of the 5 lines).","Counts pairs only."],"a":2,"tp":"r6","f":"<svg viewBox=\"0 0 260 200\" width=\"260\" height=\"200\" role=\"img\" aria-label=\"triangle divided by lines\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><polygon points=\"130,15 15,185 245,185\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"15\" x2=\"72.5\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"15\" x2=\"130.0\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"15\" x2=\"187.5\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>","s":"Reasoning"},"q139":{"q":"Two positions of the same die are shown. Which number is opposite 1?","o":["4","6","5","3"],"w":["4 is next to 1 in the second position.","1 touches 2 and 3 (first position) and 5 and 4 (second). The only number not adjacent to 1 is 6.","5 is next to 1 in the second position.","3 is next to 1 in the first position."],"a":1,"tp":"r6","f":"<svg viewBox=\"0 0 300 140\" width=\"300\" height=\"140\" role=\"img\" aria-label=\"dice positions\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><polygon points=\"70,20 120,45 70,70 20,45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"20,45 70,70 70,130 20,105\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"70,70 120,45 120,105 70,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"51\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">1<\/text><text x=\"45\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">2<\/text><text x=\"95\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">3<\/text><polygon points=\"220,20 270,45 220,70 170,45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"170,45 220,70 220,130 170,105\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"220,70 270,45 270,105 220,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"220\" y=\"51\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">1<\/text><text x=\"195\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">5<\/text><text x=\"245\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">4<\/text><\/svg>","s":"Reasoning"},"q140":{"q":"A cube of side 5 cm is painted on all faces and cut into 1 cm cubes. How many small cubes have exactly ONE face painted?","o":["54","36","8","27"],"w":["One face painted = 6(n − 2)² = 6 × 9 = 54.","That is 12(n − 2) for two faces painted.","Corner cubes (3 faces painted).","That is (n − 2)³, cubes with no paint."],"a":0,"tp":"r6","s":"Reasoning"},"q141":{"q":"Which option is the mirror image of the word when a mirror is placed to its right?","o":["<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"POLICE water\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(0,60) scale(1,-1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">POLICE<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"POLICE rot180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(200,60) scale(-1,-1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">POLICE<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"ECILOP normal\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g ><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">ECILOP<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"POLICE mirror\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(200,0) scale(-1,1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">POLICE<\/text><\/g><\/svg>"],"w":["This is the WATER image (top–bottom flip).","This is the word turned upside down (rotated 180°).","Only the letter order is reversed; the letters themselves are not flipped.","A side mirror flips left and right: the letter order and each letter are reversed horizontally."],"a":3,"tp":"r6","f":"<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"POLICE normal\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g ><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">POLICE<\/text><\/g><\/svg>","h":1,"s":"Reasoning"},"q142":{"q":"A clock seen in a mirror shows 9:15. What is the actual time?","o":["9:45","3:45","2:45","2:15"],"w":["Reverses only the minutes.","Uses 12:60 − 9:15.","Actual = 11:60 − 9:15 = 2:45.","Reverses only the hours."],"a":2,"tp":"r6","s":"Reasoning"},"q143":{"q":"The arrow is rotated 90° clockwise and then reflected about a vertical line. Which way does it point now?","o":["<svg viewBox=\"0 0 70 70\" width=\"70\" height=\"70\" role=\"img\" aria-label=\"arrow up\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"rotate(0 35.0 35.0)\"><line x1=\"35.0\" y1=\"60\" x2=\"35.0\" y2=\"16\" stroke=\"currentColor\" stroke-width=\"5\"/><polygon points=\"35.0,6 23.0,24 47.0,24\" fill=\"currentColor\"/><\/g><\/svg>","<svg viewBox=\"0 0 70 70\" width=\"70\" height=\"70\" role=\"img\" aria-label=\"arrow left\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"rotate(270 35.0 35.0)\"><line x1=\"35.0\" y1=\"60\" x2=\"35.0\" y2=\"16\" stroke=\"currentColor\" stroke-width=\"5\"/><polygon points=\"35.0,6 23.0,24 47.0,24\" fill=\"currentColor\"/><\/g><\/svg>","<svg viewBox=\"0 0 70 70\" width=\"70\" height=\"70\" role=\"img\" aria-label=\"arrow down\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"rotate(180 35.0 35.0)\"><line x1=\"35.0\" y1=\"60\" x2=\"35.0\" y2=\"16\" stroke=\"currentColor\" stroke-width=\"5\"/><polygon points=\"35.0,6 23.0,24 47.0,24\" fill=\"currentColor\"/><\/g><\/svg>","<svg viewBox=\"0 0 70 70\" width=\"70\" height=\"70\" role=\"img\" aria-label=\"arrow right\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"rotate(90 35.0 35.0)\"><line x1=\"35.0\" y1=\"60\" x2=\"35.0\" y2=\"16\" stroke=\"currentColor\" stroke-width=\"5\"/><polygon points=\"35.0,6 23.0,24 47.0,24\" fill=\"currentColor\"/><\/g><\/svg>"],"w":["No change — both steps were skipped.","Up → (90° clockwise) right → (reflect left–right) left.","Rotated 180° instead.","This is after the rotation only."],"a":1,"tp":"r6","f":"<svg viewBox=\"0 0 70 70\" width=\"70\" height=\"70\" role=\"img\" aria-label=\"arrow up\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"rotate(0 35.0 35.0)\"><line x1=\"35.0\" y1=\"60\" x2=\"35.0\" y2=\"16\" stroke=\"currentColor\" stroke-width=\"5\"/><polygon points=\"35.0,6 23.0,24 47.0,24\" fill=\"currentColor\"/><\/g><\/svg>","h":1,"s":"Reasoning"},"q144":{"q":"How many rectangles (including squares) are there in the figure?","o":["18","12","17","6"],"w":["Choose 2 of 3 horizontal lines and 2 of 4 vertical lines: 3 × 6 = 18.","Misses the larger combinations.","Misses the outer rectangle.","Counts only the small cells."],"a":0,"tp":"r6","f":"<svg viewBox=\"0 0 140 100\" width=\"140\" height=\"100\" role=\"img\" aria-label=\"2 by 3 grid\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><line x1=\"10\" y1=\"10\" x2=\"130\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"50\" x2=\"130\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"90\" x2=\"130\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"90\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>","s":"Reasoning"},"q145":{"q":"Statements: All dogs are animals. Some animals are cats. Conclusions: I. Some dogs are cats. II. Some animals are dogs.","o":["Both follow","Neither follows","Only I follows","Only II follows"],"w":["I does not follow.","II follows by conversion.","No direct link between dogs and cats.","‘All dogs are animals’ → ‘some animals are dogs’ (II). Dogs and cats are linked only through ‘some animals’, so I is not certain."],"a":3,"tp":"r7","s":"Reasoning"},"q146":{"q":"Statements: All roses are flowers. No flower is a tree. Conclusions: I. No rose is a tree. II. Some trees are roses.","o":["Only II follows","Both follow","Only I follows","Neither follows"],"w":["II contradicts the statements.","II does not follow.","Roses lie inside flowers; flowers are completely outside trees → no rose is a tree. II contradicts I.","I follows directly."],"a":2,"tp":"r7","s":"Reasoning"},"q147":{"q":"Should mobile phones be banned in school classrooms? Arguments: I. Yes, they distract students during lessons. II. No, everybody uses mobile phones these days.","o":["Both are strong","Only I is strong","Only II is strong","Neither is strong"],"w":["II is weak.","I gives a relevant, serious reason. II is a popular-practice argument, not a reason against the ban.","‘Everybody uses it’ is a weak argument.","I is directly relevant."],"a":1,"tp":"r7","s":"Reasoning"},"q148":{"q":"Statement: “Wear a helmet — it saves your life.” (a traffic police notice). Assumptions: I. Helmets reduce head injuries in accidents. II. People read such notices.","o":["Both I and II are implicit","Only I is implicit","Only II is implicit","Neither is implicit"],"w":["The notice assumes helmets protect (I) and that people will read and act on it (II).","A notice is put up only if people are expected to read it.","The message itself assumes helmets protect.","Both are needed for the notice to make sense."],"a":0,"tp":"r7","s":"Reasoning"},"q149":{"q":"Statement: All candidates scoring above 60% are eligible for the interview. Ravi scored 58%. Conclusions: I. Ravi is not eligible for the interview. II. Ravi will not get the job.","o":["Neither follows","Only II follows","Both follow","Only I follows"],"w":["I follows directly.","The statement says nothing about the job.","II goes beyond the statement.","Ravi is below 60% → not eligible (I). The job depends on more than this statement (II is outside information)."],"a":3,"tp":"r7","s":"Reasoning"},"q150":{"q":"Assertion (A): The Western Ghats get heavy rain from the South-West monsoon. Reason (R): Moist winds from the Arabian Sea are forced to rise along the Ghats.","o":["Both A and R are true, and R explains A","Both true, but R does not explain A","A is true, R is false","A is false, R is true"],"w":["Orographic lifting along the Ghats causes the heavy rain.","R is exactly the cause of A.","R is a true statement.","A is a true statement."],"a":0,"tp":"r7","s":"Reasoning"},"q151":{"q":"Assertion (A): Iron rusts in moist air. Reason (R): Rusting is an oxidation reaction that needs both oxygen and water.","o":["Both A and R are true, and R explains A","Both true, but R does not explain A","A is true, R is false","A is false, R is true"],"w":["Moist air supplies both oxygen and water, so R explains A.","R explains A directly.","R is true.","A is true."],"a":0,"tp":"r7","s":"Reasoning"},"q152":{"q":"Assertion (A): Mercury is used in thermometers. Reason (R): Mercury is a non-metal.","o":["Both A and R are true, and R explains A","Both true, but R does not explain A","A is true, R is false","A is false, R is true"],"w":["R is false, so it cannot explain A.","R is false.","Mercury is a METAL (the only liquid metal at room temperature). It is used because it expands uniformly.","A is true; R is false."],"a":2,"tp":"r7","s":"Reasoning"},"q153":{"q":"What is the value of x? I. x² = 49. II. x is positive.","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Even I and II together are not sufficient"],"w":["x² = 49 has two answers.","‘Positive’ alone gives no value.","I gives x = 7 or −7; II alone gives no value. Together → x = 7.","Together they give x = 7."],"a":2,"tp":"r8","s":"Reasoning"},"q154":{"q":"Is the number N divisible by 6? I. N is divisible by 3. II. N is even.","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Even I and II together are not sufficient"],"w":["Divisible by 3 alone (e.g. 9) is not enough.","Even alone (e.g. 4) is not enough.","Divisible by 6 ⇔ divisible by 2 and 3. Need both statements.","Together they are sufficient."],"a":2,"tp":"r8","s":"Reasoning"},"q155":{"q":"What is the speed of a train? I. It crosses a 200 m platform in 20 s. II. It crosses a pole in 12 s.","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Even I and II together are not sufficient"],"w":["Length of the train is unknown in I.","Length unknown in II.","II: length = 12v. I: length + 200 = 20v → 8v = 200 → v = 25 m/s. Both needed.","Together they give the speed."],"a":2,"tp":"r8","s":"Reasoning"},"q156":{"q":"In a class of 50 students, 30 like tea, 25 like coffee and 10 like both. How many like neither?","o":["5","0","10","15"],"w":["Tea or coffee = 30 + 25 − 10 = 45 → neither = 50 − 45 = 5.","Forgets to subtract the 10 counted twice.","That is the number who like both.","Arithmetic slip."],"a":0,"tp":"r8","s":"Reasoning"},"q157":{"q":"Which description best shows the relation between Doctors, Men and Fathers?","o":["Doctors inside Men","Three separate circles","Men inside Fathers","Fathers inside Men; Doctors overlapping both"],"w":["Women can be doctors.","Some fathers are doctors, so they overlap.","Not all men are fathers.","All fathers are men. Some doctors are men, some are fathers, some are neither (women doctors)."],"a":3,"tp":"r8","s":"Reasoning"},"q158":{"q":"The table shows a shop’s yearly sales. What is the percentage increase in sales from 2024 to 2025?","o":["20%","15%","33.33%","25%"],"w":["Arithmetic slip.","Uses the difference 15 as a percent.","(60 − 45)/45 × 100 = 33.33%.","Divides by 60 instead of 45."],"a":2,"tp":"r8","f":"<table class=\"figtable\"><thead><tr><th>Year<\/th><th>Sales (₹ thousand)<\/th><\/tr><\/thead><tbody><tr><td>2022<\/td><td>40<\/td><\/tr><tr><td>2023<\/td><td>50<\/td><\/tr><tr><td>2024<\/td><td>45<\/td><\/tr><tr><td>2025<\/td><td>60<\/td><\/tr><\/tbody><\/table>","s":"Reasoning"},"q159":{"q":"Using the table, what is the average yearly sales for 2022–2025?","o":["₹50,000","₹48,750","₹65,000","₹45,000"],"w":["Uses the middle year only.","(40 + 50 + 45 + 60)/4 = 48.75 thousand.","Divides by 3.","Arithmetic slip."],"a":1,"tp":"r8","f":"<table class=\"figtable\"><thead><tr><th>Year<\/th><th>Sales (₹ thousand)<\/th><\/tr><\/thead><tbody><tr><td>2022<\/td><td>40<\/td><\/tr><tr><td>2023<\/td><td>50<\/td><\/tr><tr><td>2024<\/td><td>45<\/td><\/tr><tr><td>2025<\/td><td>60<\/td><\/tr><\/tbody><\/table>","s":"Reasoning"},"q160":{"q":"Using the table, in which year did sales fall compared with the previous year?","o":["2024","2023","2025","2022"],"w":["2023 → 2024: 50 → 45, the only fall.","Sales rose from 40 to 50.","Sales rose from 45 to 60.","No earlier year is given."],"a":0,"tp":"r8","f":"<table class=\"figtable\"><thead><tr><th>Year<\/th><th>Sales (₹ thousand)<\/th><\/tr><\/thead><tbody><tr><td>2022<\/td><td>40<\/td><\/tr><tr><td>2023<\/td><td>50<\/td><\/tr><tr><td>2024<\/td><td>45<\/td><\/tr><tr><td>2025<\/td><td>60<\/td><\/tr><\/tbody><\/table>","s":"Reasoning"},"q161":{"q":"The ‘Gentlemen’s Agreement’ between Andhra and Telangana leaders was signed on:","o":["1 November 1956","30 September 1955","21 September 1973","20 February 1956"],"w":["That is the day Andhra Pradesh was formed.","That is when the SRC submitted its report.","That is the Six-Point Formula.","Signed in New Delhi by 4 leaders from each region before Andhra Pradesh was formed. Asked in 2016, 2018 and 2022."],"a":3,"tp":"g1","s":"General Studies","g":"Telangana"},"q162":{"q":"Under the Gentlemen’s Agreement, the cabinet ratio Andhra : Telangana was fixed at:","o":["55 : 45","50 : 50","60 : 40","70 : 30"],"w":["Not the agreed ratio.","The 2016 paper used 50:50 as the wrong statement.","60:40. CM from one region and Deputy CM from the other; at least two of Home, Finance, Revenue, Planning & Development, Commerce & Industry to Telangana.","Not the agreed ratio."],"a":2,"tp":"g1","s":"General Studies","g":"Telangana"},"q163":{"q":"Which of these leaders signed the Gentlemen’s Agreement from the ANDHRA side?","o":["Burgula Ramakrishna Rao","Neelam Sanjeeva Reddy","Marri Chenna Reddy","K.V. Ranga Reddy"],"w":["Telangana side (CM of Hyderabad State).","Andhra side: B. Gopala Reddy, N. Sanjeeva Reddy, G. Latchanna, A. Satyanarayana Raju.","Telangana side.","Telangana side."],"a":1,"tp":"g1","s":"General Studies","g":"Telangana"},"q164":{"q":"The States Reorganisation Commission (1953–55) was headed by:","o":["Justice Fazal Ali","S.K. Dhar","H.N. Kunzru","K.M. Panikkar"],"w":["Members: K.M. Panikkar and H.N. Kunzru.","Dhar headed the 1948 Linguistic Provinces Commission.","Kunzru was a member, not chairman.","Panikkar was a member, not chairman."],"a":0,"tp":"g1","s":"General Studies","g":"Telangana"},"q165":{"q":"Which paragraph of the SRC report recommended a separate Telangana (Hyderabad) State, with merger possible after the 1961 elections by a two-thirds vote?","o":["Paragraph 368","Paragraph 371","Paragraph 286","Paragraph 386"],"w":["Article 368 is the amendment procedure — a different thing.","Article 371 deals with special provisions — a different thing.","Wrong number.","Para 386 of the SRC report (30 Sep 1955)."],"a":3,"tp":"g1","s":"General Studies","g":"Telangana"},"q166":{"q":"The ‘Idli-Sambar Go Back’ Mulki agitation, with police firing on students in Hyderabad, took place in:","o":["November 1956","January 1969","September 1952","December 2009"],"w":["That is the formation of Andhra Pradesh.","That is the start of the Jai Telangana agitation.","Under the Burgula Ramakrishna Rao ministry; firing near City College.","That is the final phase (KCR fast, Chidambaram statement)."],"a":2,"tp":"g1","s":"General Studies","g":"Telangana"},"q167":{"q":"The 1969 ‘Jai Telangana’ agitation began over appointment of non-locals at:","o":["APSRTC, Hyderabad","Kothagudem Thermal Power Station","Singareni Collieries","Nizam Sugar Factory, Bodhan"],"w":["Not linked to 1969.","KTPS, Khammam district — asked in both 2018 and 2022.","Not the 1969 starting point.","Not linked to 1969."],"a":1,"tp":"g1","s":"General Studies","g":"Telangana"},"q168":{"q":"Which Chief Minister called the post of Deputy Chief Minister a ‘sixth finger’?","o":["Neelam Sanjeeva Reddy","Kasu Brahmananda Reddy","Burgula Ramakrishna Rao","Marri Chenna Reddy"],"w":["First CM of Andhra Pradesh (1956); refused to appoint a Telangana Deputy CM.","CM during the 1969 agitation.","CM of Hyderabad State (1952–56).","He led the TPS and later became CM (1978)."],"a":0,"tp":"g1","s":"General Studies","g":"Telangana"},"q169":{ ment."],"a":2,"tp":"g3","s":"General Studies","g":"Telangana"},"q179":{"q":"G.O. 610 (December 1985) of the N.T. Rama Rao government ordered:","o":["Abolition of the Mulki rules","Repatriation of non-local employees appointed against the Presidential Order","Formation of a Telangana Development Board","Creation of the Telangana Regional Committee"],"w":["Mulki rules were dealt with in 1972–73.","Its non-implementation became a key grievance in the 1990s.","Not G.O. 610.","That was in 1958."],"a":1,"tp":"g3","s":"General Studies","g":"Telangana"},"q180":{"q":"The one-man commission appointed in 2001 to study violations of G.O. 610 was the:","o":["Girglani Commission","Jayabharat Reddy Committee","Bhargava Committee","Wanchoo Committee"],"w":["J.M. Girglani; report in 2002. Asked in 2022.","The 1984 officers’ committee that led to G.O. 610.","1969 — Telangana surpluses.","1969 — legal safeguards."],"a":0,"tp":"g3","s":"General Studies","g":"Telangana"},"q181":{"q":"The Telangana Rashtra Samithi (TRS) was founded on:","o":["2 June 2014","29 November 2009","9 December 2009","27 April 2001"],"w":["Telangana formation day.","KCR’s fast-unto-death began that day.","Chidambaram’s statement.","By K. Chandrashekar Rao at Jaladrushyam, Hyderabad; renamed BRS in 2022."],"a":3,"tp":"g3","s":"General Studies","g":"Telangana"},"q182":{"q":"The Justice B.N. Srikrishna Committee submitted its report on:","o":["10 March 2011","6 January 2011","30 December 2010","3 February 2010"],"w":["Million March.","Date the report was made public.","Constituted 3 Feb 2010; six options; made public 6 Jan 2011.","Date it was constituted."],"a":2,"tp":"g3","s":"General Studies","g":"Telangana"},"q183":{"q":"Arrange chronologically: (a) Million March (b) Sakala Janula Samme (c) Sagara Haram (d) Chalo Assembly","o":["a, c, b, d","a, b, c, d","c, a, b, d","b, a, d, c"],"w":["Sagara Haram (2012) came after the Samme (2011).","Million March 10 Mar 2011 → Sakala Janula Samme 13 Sep 2011 → Sagara Haram 30 thmetic"},"q266":{"q":"How many positive divisors does 2520 have?","o":["24","36","48","40"],"w":["Misses one prime factor.","Treats 2³ as 2².","2520 = 2³ × 3² × 5 × 7 → (3+1)(2+1)(1+1)(1+1) = 48.","Arithmetic slip."],"a":2,"s":"Arithmetic"},"q267":{"q":"What is the remainder when (37³⁷ + 37) is divided by 38?","o":["1","36","37","0"],"w":["Arithmetic slip.","37 ≡ −1 (mod 38). (−1)³⁷ + (−1) = −2 ≡ 36.","Counts only one term.","Would need an even power."],"a":1,"s":"Arithmetic"},"q268":{"q":"Find the least number which leaves remainder 5 when divided by 4, 6, 9 and 15, and is exactly divisible by 11.","o":["1265","905","365","185"],"w":["LCM(4, 6, 9, 15) = 180. Numbers: 180k + 5 → 185, 365, 545, 725, 905, … The first divisible by 11 is 1265.","905 ÷ 11 leaves remainder 3.","365 ÷ 11 leaves remainder 2.","185 ÷ 11 leaves remainder 9."],"a":0,"s":"Arithmetic"},"q269":{"q":"The product of two numbers is 4,320 and their HCF is 12. How many such pairs of numbers are possible?","o":["8","2","1","4"],"w":["Counts ordered pairs (a, b) and (b, a) separately.","Misses (3, 10) and (5, 6).","Counts only (1, 30).","Numbers = 12a and 12b with a, b co-prime and ab = 4320 / 144 = 30. Co-prime pairs: (1, 30), (2, 15), (3, 10), (5, 6) → 4 pairs."],"a":3,"s":"Arithmetic"},"q270":{"q":"The price of petrol rises by 20% and then by another 10%. To keep spending the same, by what percent must consumption be reduced?","o":["30%","32%","24 8/33%","25%"],"w":["Simply adds the two rises.","That is the net price rise, not the cut in consumption.","Net rise = 1.2 × 1.1 = 1.32 (32%). Reduction = 32/132 × 100 = 24 8/33% (≈ 24.24%).","Arithmetic slip."],"a":2,"s":"Arithmetic"},"q271":{"q":"In an examination, 65% passed in English, 60% in Mathematics and 30% failed in both. If 1,100 passed in both subjects, how many students appeared?","o":["1,800","2,000","2,500","2,200"],"w":["Arithmetic slip.","Failed English 35%, failed Maths 40%, failed both 30% → failed at least one = 35 + 40 − 30 = 45% → passed both = 55%. 55% = 1,100 → total = 2,000.","Uses 44% as the passed-both share.","Uses 50% as the passed-both share."],"a":1,"s":"Arithmetic"},"q272":{"q":"A manufacturer sells to a wholesaler at 10% profit, the wholesaler to a retailer at 5% profit, and the retailer to a customer at 20% profit. If the customer pays ₹1,386, the manufacturer’s cost is:","o":["₹1,000","₹900","₹1,100","₹1,050"],"w":["1386 ÷ (1.10 × 1.05 × 1.20) = 1386 ÷ 1.386 = ₹1,000.","Arithmetic slip.","Arithmetic slip.","Subtracts 35% from 1,386."],"a":0,"s":"Arithmetic"},"q273":{"q":"A shopkeeper marks an article 40% above cost and allows two successive discounts of 10% and 5%. His profit percent is:","o":["25%","15%","21.4%","19.7%"],"w":["Subtracts 15% from 40% directly.","Arithmetic slip.","Arithmetic slip.","1.40 × 0.90 × 0.95 = 1.197 → 19.7% profit."],"a":3,"s":"Arithmetic"},"q274":{"q":"By selling 33 metres of cloth, a man gains the selling price of 11 metres. His gain percent is:","o":["40%","25%","50%","33 1/3%"],"w":["Arithmetic slip.","Arithmetic slip.","SP(33) − CP(33) = SP(11) → CP(33) = SP(22) → gain = 11/22 = 50%.","Divides 11 by 33 — gain is measured on CP (22 m worth)."],"a":2,"s":"Arithmetic"},"q275":{"q":"A trader claims to sell at cost price but uses a 960 g weight for 1 kg and also mixes 4% impurity into what he gives. His gain percent is about:","o":["4.17%","8.51%","8%","4%"],"w":["Counts only the false weight.","Real goods given = 960 × 0.96 = 921.6 g for the price of 1000 g. Gain = 78.4/921.6 × 100 ≈ 8.51%.","Simply adds 4% + 4%.","Counts only the impurity."],"a":1,"s":"Arithmetic"},"q276":{"q":"A man sold a watch at 5% profit for ₹4,200. Had he sold it for ₹200 less, what would his result be?","o":["Neither profit nor loss","Loss of ₹200","5% loss","2.5% profit"],"w":["CP = 4200/1.05 = ₹4,000. Selling at ₹4,000 = CP → no profit, no loss.","Subtracts from SP but CP is 4,000.","₹4,000 equals the cost price.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q277":{"q":"The difference between compound and simple interest on a sum for 2 years at 12% per annum is ₹216. The sum is:","o":["₹1,800","₹18,000","₹12,000","₹15,000"],"w":["Divides by 0.12 instead of 0.0144.","Uses R = 11%.","Arithmetic slip.","Difference = P(R/100)² → 216 = P × 0.0144 → P = ₹15,000."],"a":3,"s":"Arithmetic"},"q278":{"q":"A sum of money amounts to ₹6,690 after 3 years and to ₹10,035 after 6 years at compound interest. The sum is:","o":["₹3,345","₹5,000","₹4,460","₹4,000"],"w":["Subtracts the difference from 6,690.","Arithmetic slip.","Ratio over 3 years = 10035/6690 = 1.5 → P = 6690/1.5 = ₹4,460.","Arithmetic slip."],"a":2,"s":"Arithmetic"},"q279":{"q":"A sum lent at simple interest becomes ₹1,120 in 3 years and ₹1,200 in 5 years. The rate of interest is:","o":["3.6%","4%","8%","5%"],"w":["Divides by 1,120.","Interest for 2 years = 80 → ₹40 per year. Principal = 1120 − 3 × 40 = ₹1,000 → R = 40/1000 = 4%.","Uses the 2-year interest as yearly.","Uses ₹800 as principal."],"a":1,"s":"Arithmetic"},"q280":{"q":"₹16,000 is invested at 10% per annum compound interest, compounded half-yearly. The amount after 1 year is:","o":["₹17,640","₹17,600","₹17,800","₹17,600.50"],"w":["Half-yearly: 5% for 2 periods → 16000 × 1.05² = ₹17,640.","That is yearly compounding.","Arithmetic slip.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q281":{"q":"The ratio of the present ages of A and B is 2 : 5. Eight years later the ratio will be 22 : 43. What is B’s present age?","o":["43 years","14 years","40 years","35 years"],"w":["That is B’s age 8 years later.","That is A’s age.","Arithmetic slip.","(2x + 8)/(5x + 8) = 22/43 → 86x + 344 = 110x + 176 → 24x = 168 → x = 7 → B = 35."],"a":3,"s":"Arithmetic"},"q282":{"q":"Three containers have volumes in the ratio 3 : 4 : 5 and contain milk–water in the ratios 4 : 1, 3 : 1 and 5 : 2. All are poured into a fourth container. The milk : water ratio there is:","o":["151 : 48","5 : 3","157 : 53","4 : 1"],"w":["Arithmetic slip in the third container.","Arithmetic slip.","Take volumes 3×140, 4×140, 5×140 = 420, 560, 700. Milk = 336 + 420 + 500 = 1256; water = 84 + 140 + 200 = 424 → 1256 : 424 = 157 : 53 (asked in 2016).","Uses only the first container."],"a":2,"s":"Arithmetic"},"q283":{"q":"A vessel contains 40 litres of milk. 4 litres are drawn out and replaced with water; this is done twice more (three times in all). How much milk is left?","o":["30 litres","29.16 litres","28 litres","32.4 litres"],"w":["Arithmetic slip.","Milk left = 40 × (1 − 4/40)³ = 40 × 0.729 = 29.16 L.","Subtracts 4 L three times — each later draw removes a mixture, not pure milk.","That is after only two operations."],"a":1,"s":"Arithmetic"},"q284":{"q":"₹78,400 is divided among A, B and C such that A : B = 5 : 4 and B : C = 6 : 11. B’s share is:","o":["₹19,200","₹24,000","₹35,200","₹16,000"],"w":["A : B : C = 30 : 24 : 44 = 15 : 12 : 22 (sum 49). B = 12/49 × 78,400 = ₹19,200.","That is A’s share.","That is C’s share.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q285":{"q":"Ten years ago, A was half of B’s age. If the ratio of their present ages is 3 : 4, the sum of their present ages is:","o":["30 years","45 years","20 years","35 years"],"w":["Arithmetic slip.","Arithmetic slip.","That is B’s age alone.","(3x − 10) = ½(4x − 10) → 6x − 20 = 4x − 10 → x = 5 → ages 15 and 20 → 35."],"a":3,"s":"Arithmetic"},"q286":{"q":"A and B start a business with ₹16,000 and ₹12,000. After 3 months A withdraws ₹5,000 and B adds ₹5,000. After 3 more months C joins with ₹21,000. Out of a yearly profit of ₹26,400, C’s share is:","o":["₹8,400","₹8,800","₹7,200","₹10,800"],"w":["That is A’s share.","Splits equally.","A = 16k×3 + 11k×9 = 147k; B = 12k×3 + 17k×9 = 189k; C = 21k×6 = 126k → 7 : 9 : 6. C = 6/22 × 26,400 = ₹7,200 (2016 pattern).","That is B’s share."],"a":2,"s":"Arithmetic"},"q287":{"q":"A starts a business with ₹1,00,000. After 2 months B joins with ₹1,20,000. At the end of the year B’s share of profit is ₹1,00,000. What was the total profit?","o":["₹1,83,333","₹2,00,000","₹2,20,000","₹1,50,000"],"w":["Uses capital ratio 5 : 6 and ignores time.","A = 1,00,000 × 12 = 12,00,000; B = 1,20,000 × 10 = 12,00,000 → 1 : 1 → total = ₹2,00,000.","Uses 6 : 5.","Arithmetic slip."],"a":1,"s":"Arithmetic"},"q288":{"q":"X and Y invest in the ratio 2 : 3. After donating 10% of the total profit to a school, X gets ₹900. Y’s share is:","o":["₹1,350","₹2,500","₹2,250","₹1,600"],"w":["Remaining profit is split 2 : 3. X = 900 → Y = 900 × 3/2 = ₹1,350 (asked in 2016).","That is the total profit before the donation.","That is the total remaining profit.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q289":{"q":"The average of 11 numbers is 60. The average of the first six is 58 and of the last six is 63. The sixth number is:","o":["60","63","62","66"],"w":["That is the overall average.","That is the average of the last six.","Arithmetic slip.","6 × 58 + 6 × 63 − 11 × 60 = 348 + 378 − 660 = 66."],"a":3,"s":"Arithmetic"},"q290":{"q":"A library has an average of 510 visitors on Sundays and 240 on other days. The average number of visitors per day in a 30-day month beginning with a Saturday is:","o":["280","250","285","276"],"w":["Arithmetic slip.","Arithmetic slip.","A 30-day month starting on Saturday has Sundays on the 2nd, 9th, 16th, 23rd and 30th → 5 Sundays. (5 × 510 + 25 × 240)/30 = 8550/30 = 285 (asked in 2016).","Uses only 4 Sundays."],"a":2,"s":"Arithmetic"},"q291":{"q":"The average weight of 8 persons increases by 2.5 kg when a person weighing 65 kg is replaced by a new person. The new person’s weight is:","o":["67.5 kg","85 kg","80 kg","75 kg"],"w":["Adds only 2.5.","Increase in total = 8 × 2.5 = 20 → 65 + 20 = 85 kg.","Arithmetic slip.","Uses 4 persons."],"a":1,"s":"Arithmetic"},"q292":{"q":"A, B and C can do a work in 12, 8 and 6 hours respectively. All three start together; A leaves after 1 hour and B leaves 1 hour before the work is finished. The total time taken is:","o":["3 4/7 hours","3 hours","2 2/3 hours","4 hours"],"w":["Let total time = t. A works 1 h, B works (t − 1) h, C works t h: 1/12 + (t − 1)/8 + t/6 = 1 → 2 + 3t − 3 + 4t = 24 → 7t = 25 → t = 3 4/7 h.","Ignores A and B leaving early.","Assumes all three work throughout (24/9 h).","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q293":{"q":"14 men can do a work in 18 days and 15 women can do it in 24 days. 14 men work for 4 days, then 15 women join them. In how many more days will the work be finished?","o":["6 days","14 days","10 days","8 days"],"w":["Arithmetic slip.","Uses the men’s rate only.","Uses the women’s rate only for part of the work.","After 4 days men finish 4/18 = 2/9; 7/9 is left. Combined rate = 1/18 + 1/24 = 7/72 per day → (7/9) ÷ (7/72) = 8 days."],"a":3,"s":"Arithmetic"},"q294":{"q":"A pipe can fill a tank in 20 minutes and another in 30 minutes. A waste pipe empties 3 gallons per minute. With all three open, the tank fills in 15 minutes. The capacity of the tank is:","o":["90 gallons","60 gallons","180 gallons","120 gallons"],"w":["Arithmetic slip.","Uses 1/20 as the waste rate.","1/20 + 1/30 − x = 1/15 → x = 1/12 − 1/15 = 1/60 of the tank per minute. 1/60 of the tank = 3 gallons → tank = 180 gallons.","Arithmetic slip."],"a":2,"s":"Arithmetic"},"q295":{"q":"A and B together can do a job in 15 days. A is 50% more efficient than B. A alone will take:","o":["30 days","25 days","37.5 days","22.5 days"],"w":["Arithmetic slip.","Rates A : B = 3 : 2 → total 5 units/day × 15 = 75 units. A alone = 75/3 = 25 days.","That is B alone.","Uses 15 × 1.5."],"a":1,"s":"Arithmetic"},"q296":{"q":"A man covers 24 km. After 1 hour 40 minutes, the distance covered is 5/7 of the remaining distance. His speed is:","o":["6 km/h","8 km/h","10 km/h","9 km/h"],"w":["Covered = 5/12 × 24 = 10 km in 5/3 h → 6 km/h (asked in 2016).","Arithmetic slip.","Ignores the 40 minutes.","Uses 15 km as covered."],"a":0,"s":"Arithmetic"},"q297":{"q":"A train 180 m long passes a man walking at 6 km/h in the same direction in 12 seconds. The speed of the train is:","o":["48 km/h","66 km/h","54 km/h","60 km/h"],"w":["Subtracts the man’s speed.","Arithmetic slip.","That is the relative speed.","Relative speed = 180/12 = 15 m/s = 54 km/h → train = 54 + 6 = 60 km/h."],"a":3,"s":"Arithmetic"},"q298":{"q":"A motor boat’s speed in still water is 15 km/h. It goes 30 km downstream and comes back in 4 hours 30 minutes. The speed of the stream is:","o":["6 km/h","3 km/h","5 km/h","4 km/h"],"w":["Total time would be about 4.8 h.","Total time would be about 4.2 h.","30/(15 + s) + 30/(15 − s) = 4.5 → 900 = 4.5(225 − s²) → s² = 25 → s = 5.","Total time would be about 4.3 h."],"a":2,"s":"Arithmetic"},"q299":{"q":"In a 1,200 m race A beats B by 120 m, and in an 800 m race B beats C by 60 m. By how many metres will A beat C in a 1,200 m race?","o":["210 m","201 m","190 m","180 m"],"w":["Arithmetic slip.","B runs 1080 when A runs 1200. C runs 740/800 of B’s distance → 1080 × 740/800 = 999 → A beats C by 201 m.","Arithmetic slip.","Adds 120 + 60."],"a":1,"s":"Arithmetic"},"q300":{"q":"A man starts 10 minutes late and travels at 1¼ times his usual speed, reaching on time. His usual time for the journey is:","o":["50 minutes","45 minutes","40 minutes","60 minutes"],"w":["At 5/4 speed time becomes 4/5 T. Saved T/5 = 10 → T = 50 min.","Arithmetic slip.","That is the new time taken.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q301":{"q":"At what time between 7 and 8 o’clock is the minute hand 5 minutes (divisions) behind the hour hand?","o":["35 min past 7","43 7/11 min past 7","30 min past 7","32 8/11 min past 7"],"w":["Arithmetic slip.","That is when the minute hand is 5 divisions AHEAD (gain 40 divisions).","Ignores the hour hand’s movement.","Minute hand must gain 35 − 5 = 30 divisions at 11/12 per minute → 30 × 12/11 = 32 8/11 min."],"a":3,"s":"Arithmetic"},"q302":{"q":"15 August 2022 was a Monday. On which day did 26 January 2023 fall?","o":["Tuesday","Friday","Thursday","Wednesday"],"w":["Arithmetic slip.","Off by one.","Days after 15 Aug to 26 Jan = 16 + 30 + 31 + 30 + 31 + 26 = 164 = 23 weeks + 3 days → Monday + 3 = Thursday (asked in 2022).","Off by one."],"a":2,"s":"Arithmetic"},"q303":{"q":"After 2022, the next year that will have exactly the same calendar as 2022 is:","o":["2027","2033","2050","2028"],"w":["Odd days not yet a multiple of 7.","Odd days of 2022 to 2032: 1+1+2+1+1+1+2+1+1+1+2 = 14 ≡ 0 (mod 7), and 2033 is also a non-leap year → same calendar (asked in 2022).","Too far — 2033 comes first.","2028 is a leap year."],"a":1,"s":"Arithmetic"},"q304":{"q":"A rectangular wax block 60 cm × 35 cm × 22 cm is melted into cylindrical candles of diameter 7 cm and height 4 cm. How many candles can be made?","o":["300","75","150","400"],"w":["Block = 46,200 cm³. Candle = 22/7 × 3.5² × 4 = 154 cm³ → 46,200/154 = 300 (asked in 2016).","Uses radius 7 cm.","Uses height 8 cm.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q305":{"q":"Three cubes with sides in the ratio 3 : 4 : 5 are melted into one cube whose diagonal is 12√3 cm. The sides of the three cubes are:","o":["3, 4, 5 cm","12, 16, 20 cm","9, 12, 15 cm","6, 8, 10 cm"],"w":["That gives a 6 cm cube.","That gives a 24 cm cube.","That gives an 18 cm cube.","New side = 12 (diagonal a√3). 27k³ + 64k³ + 125k³ = 216k³ = 1728 → k = 2 → 6, 8, 10."],"a":3,"s":"Arithmetic"},"q306":{"q":"A tent is a cylinder of radius 12 m and height 11 m with a cone of the same radius and slant height 13 m on top. The canvas needed for the curved surfaces is (π = 22/7):","o":["1,772.57 m²","490.29 m²","1,320.00 m²","829.71 m²"],"w":["Adds the floor area, which needs no canvas.","That is the cone part only.","Cylinder CSA = 2πrh = 2 × 22/7 × 12 × 11 = 829.71; cone CSA = πrl = 22/7 × 12 × 13 = 490.29. Total = 1,320.00 m².","That is the cylinder part only."],"a":2,"s":"Arithmetic"},"q307":{"q":"A circle of radius 3 cm is inscribed in a square. The area of the square not covered by the circle is (π = 3.14):","o":["9 cm²","7.74 cm²","28.26 cm²","36 cm²"],"w":["Uses π = 3.","Square side = 6 → 36. Circle = 3.14 × 9 = 28.26. Difference = 7.74 cm².","That is the circle’s area.","That is the square’s area."],"a":1,"s":"Arithmetic"},"q308":{"q":"The length of a rectangle is 5 cm more than twice its breadth and its area is 273 cm². Its perimeter is:","o":["73 cm","36.5 cm","68 cm","78 cm"],"w":["b(2b + 5) = 273 → b = 10.5, l = 26 (10.5 × 26 = 273). Perimeter = 2(26 + 10.5) = 73 cm.","Forgets to double (that is l + b).","Uses b = 8.5.","Arithmetic slip."],"a":0,"s":"Arithmetic"},"q309":{"q":"If s = 16⅔% of 24, t = 33⅓% of 9 and u = 20% of 25 are the sides of a triangle, the largest angle of the triangle is:","o":["120°","45°","60°","90°"],"w":["Would need 5² > 3² + 4².","Arithmetic slip.","That would need all sides equal.","s = 4, t = 3, u = 5 → 3² + 4² = 5² → right-angled (asked in 2018)."],"a":3,"s":"Arithmetic"},"q310":{"q":"A right-angled isosceles triangle has hypotenuse 12√2 cm. Its area is:","o":["144 cm²","72√2 cm²","72 cm²","36 cm²"],"w":["Forgets the ½.","Keeps the √2 wrongly.","Each leg = 12 → area = ½ × 12 × 12 = 72 cm².","Uses hypotenuse 12."],"a":2,"s":"Arithmetic"},"q311":{"q":"If each side of a square is decreased by 25%, the ratio of the new area to the old area is:","o":["3 : 4","9 : 16","7 : 16","16 : 25"],"w":["That is the ratio of sides.","(3/4)² = 9/16 (asked in 2018).","That is the decrease, not the new area.","Uses a 20% decrease."],"a":1,"s":"Arithmetic"},"q312":{"q":"The volume of a sphere equals its surface area. Its radius is:","o":["3 units","4 units","1 unit","2 units"],"w":["4/3 πr³ = 4πr² → r = 3 (asked in 2018).","Volume would be larger.","Volume would be one-third of the area.","Volume would be two-thirds of the area."],"a":0,"s":"Arithmetic"},"q313":{"q":"Two cubes of side 12 cm are joined face to face. The surface area of the cuboid formed is:","o":["1,728 cm²","1,080 cm²","1,600 cm²","1,440 cm²"],"w":["Adds both cubes’ areas without removing the joined faces.","Arithmetic slip.","Arithmetic slip.","Cuboid 24 × 12 × 12: 2(288 + 144 + 288) = 1,440 cm² (asked in 2018)."],"a":3,"s":"Arithmetic"},"q314":{"q":"A room is 5.2 m long and 2.9 m wide. The least number of identical square tiles needed to cover the floor exactly is:","o":["377","1,300","1,508","754"],"w":["Uses a 20 cm tile for one side only.","Arithmetic slip.","Largest tile side = HCF(520, 290) = 10 cm. Tiles = (520/10) × (290/10) = 52 × 29 = 1508.","Halves the count — a 20 cm tile does not fit 290 cm exactly."],"a":2,"s":"Arithmetic"},"q315":{"q":"Find the missing term: 5, 11, 23, 47, 95, ?","o":["189","191","190","143"],"w":["Arithmetic slip.","Each term × 2 + 1: 95 × 2 + 1 = 191.","Doubles without adding 1.","Adds 48."],"a":1,"s":"Reasoning"},"q316":{"q":"Find the missing term: 3, 7, 13, 21, 31, ?, 57","o":["43","41","45","42"],"w":["Differences 4, 6, 8, 10, 12, 14 → 31 + 12 = 43; 43 + 14 = 57 ✔ (asked in 2016).","Adds 10 again.","Adds 14 too early.","Arithmetic slip."],"a":0,"s":"Reasoning"},"q317":{"q":"Find the missing term: 24, 60, 120, 210, ?, 504","o":["330","343","300","336"],"w":["Arithmetic slip.","That is 7³.","Adds 90 — differences are 36, 60, 90, 126, 168.","n(n+1)(n+2): 2·3·4, 3·4·5, 4·5·6, 5·6·7, 6·7·8 = 336, 7·8·9 = 504 (asked in 2016)."],"a":3,"s":"Reasoning"},"q318":{"q":"Find the next term: 1, 8, 27, 64, 125, ?","o":["343","225","216","196"],"w":["That is 7³ — skips 6³.","That is 15².","Cubes: 6³ = 216.","That is 14²."],"a":2,"s":"Reasoning"},"q319":{"q":"Find the next term: B, E, I, N, T, ?","o":["B","A","Z","Y"],"w":["Adds 8.","Gaps +3, +4, +5, +6, +7 → T (20) + 7 = 27 → wraps to A (1).","Adds 6 again.","Adds 5."],"a":1,"s":"Reasoning"},"q320":{"q":"Find the next term: 2Z5, 7Y7, 14X9, 23W11, ?","o":["34V13","32V13","34V12","34U13"],"w":["First numbers +5, +7, +9, +11 → 34; letters go back Z, Y, X, W, V; last numbers +2 → 13.","First number +9 again.","Last number +1.","Letter skips one."],"a":0,"s":"Reasoning"},"q321":{"q":"If ARISE is coded as CUMXK, how is WORLD coded?","o":["YQPJF","YSPIF","YRPJF","YRVQJ"],"w":["Wrong shifts in the middle.","Uses +2 for every letter.","Third letter shifted +2 instead of +4.","Shifts +2, +3, +4, +5, +6: W→Y, O→R, R→V, L→Q, D→J (asked in 2018)."],"a":3,"s":"Reasoning"},"q322":{"q":"If TRIANGLE is coded as USJBOHMF, which word is coded as TRVBSF?","o":["RADIUS","ROBOTS","SQUARE","CIRCLE"],"w":["Does not decode to TRVBSF.","Does not decode to TRVBSF.","Each letter of the word was shifted +1, so go back by 1: T→S, R→Q, V→U, B→A, S→R, F→E (asked in 2018).","Does not decode to TRVBSF."],"a":2,"s":"Reasoning"},"q323":{"q":"If GOLD is coded as TLOW (reverse alphabet), how is SILVER coded?","o":["TJMWFS","HROEVI","HROEVJ","HRNEVI"],"w":["That is a +1 shift.","Reverse pairs (A↔Z …, sum 27): S→H, I→R, L→O, V→E, E→V, R→I.","Last letter wrong.","L↔O, not N."],"a":1,"s":"Reasoning"},"q324":{"q":"If in a code 4 7 2 means ‘eat fresh fruit’, 7 9 6 means ‘fresh food daily’ and 2 6 3 means ‘fruit daily stock’, what is the code for ‘food’?","o":["9","6","2","7"],"w":["‘fresh’ = 7 (common to 1 and 2), ‘daily’ = 6 (common to 2 and 3) → ‘food’ = 9.","6 means ‘daily’.","2 means ‘fruit’.","7 means ‘fresh’."],"a":0,"s":"Reasoning"},"q325":{"q":"In a code, MANGO = 57 and LEMON = 66. Then APPLE = ?","o":["55","64","50","57"],"w":["Arithmetic slip.","Adds 14.","Forgets to add 7.","Rule: sum of letter positions + 7 (MANGO 50 + 7, LEMON 59 + 7). APPLE = 1 + 16 + 16 + 12 + 5 = 50 → 57."],"a":3,"s":"Reasoning"},"q326":{"q":"In a certain code, ‘PENCIL’ is written ‘LICNEP’. How is ‘ERASER’ written?","o":["REASRE","ERASER","RESARE","RESAER"],"w":["Middle letters wrong.","No change.","The word is written in reverse.","Last two letters wrong."],"a":2,"s":"Reasoning"},"q327":{"q":"If CHAIR is coded 73456, ROSE is 6821 and PREACH is 961473, how is HORSE coded?","o":["38612","38621","36821","83621"],"w":["S and E swapped.","H = 3, O = 8, R = 6, S = 2, E = 1.","O and R swapped.","H and O swapped."],"a":1,"s":"Reasoning"},"q328":{"q":"Pen : Write :: Knife : ?","o":["Cut","Kitchen","Steel","Sharp"],"w":["Tool : function.","A place.","A material.","A quality, not the function."],"a":0,"s":"Reasoning"},"q329":{"q":"27 : 9 :: 64 : ?","o":["32","12","8","16"],"w":["Half of 64.","Arithmetic slip.","√64 = 8 — the rule is cube → square of the base.","27 = 3³ → 3² = 9; 64 = 4³ → 4² = 16."],"a":3,"s":"Reasoning"},"q330":{"q":"Find the odd one out: 131, 151, 161, 181, 191","o":["191","151","161","131"],"w":["191 is prime.","151 is prime.","161 = 7 × 23; the others are prime (asked in 2022).","131 is prime."],"a":2,"s":"Reasoning"},"q331":{"q":"Find the odd one out: Pond, Lake, Bridge, Tank","o":["Pond","Bridge","Tank","Lake"],"w":["Holds water.","The others hold water (asked in 2018).","Holds water.","Holds water."],"a":1,"s":"Reasoning"},"q332":{"q":"Find the odd pair: (3, 27), (4, 64), (5, 125), (6, 206)","o":["(6, 206)","(5, 125)","(3, 27)","(4, 64)"],"w":["Others are (n, n³); 6³ = 216.","5³ = 125.","3³ = 27.","4³ = 64."],"a":0,"s":"Reasoning"},"q333":{"q":"Find the odd one out: Mercury, Venus, Moon, Mars","o":["Venus","Mercury","Mars","Moon"],"w":["A planet.","A planet.","A planet.","The others are planets; the Moon is a natural satellite."],"a":3,"s":"Reasoning"},"q334":{"q":"Find the odd letter group: BDF, HJL, NPR, TVY","o":["NPR","HJL","TVY","BDF"],"w":["+2, +2.","+2, +2.","Others skip one letter each time (+2, +2); TVY is +2, +3.","+2, +2."],"a":2,"s":"Reasoning"},"q335":{"q":"Find the missing number:","o":["36","37","41","45"],"w":["Copies the row above.","Each row: (first × second) − third = fourth? Check: 6×4 − 3 = 21; 8×5 − 4 = 36; 9×5 − 8 = 37.","Subtracts 4 instead of 8.","Forgets to subtract."],"a":1,"f":"<table class=\"figtable\"><thead><tr><th>a<\/th><th>b<\/th><th>c<\/th><th>?<\/th><\/tr><\/thead><tbody><tr><td>6<\/td><td>4<\/td><td>3<\/td><td>21<\/td><\/tr><tr><td>8<\/td><td>5<\/td><td>4<\/td><td>36<\/td><\/tr><tr><td>9<\/td><td>5<\/td><td>8<\/td><td>?<\/td><\/tr><\/tbody><\/table>","s":"Reasoning"},"q336":{"q":"If ‘B’ means ‘÷’, ‘D’ means ‘×’, ‘Q’ means ‘+’ and ‘R’ means ‘−’, then 23 Q 19 R 24 B 2 D 3 = ?","o":["6","38","18","60"],"w":["23 + 19 − 24 ÷ 2 × 3 = 23 + 19 − 36 = 6 (asked in 2022).","Uses 24 ÷ 6.","Arithmetic slip.","Works left to right."],"a":0,"s":"Reasoning"},"q337":{"q":"If a ⊕ b = a² + b² − ab, find 5 ⊕ 3.","o":["34","15","49","19"],"w":["Forgets −ab.","Uses only ab.","Adds ab.","25 + 9 − 15 = 19."],"a":3,"s":"Reasoning"},"q338":{"q":"In three circles, the outer numbers and the centre number are: (1, 2, 3, 4 → 15), (2, 3, 4, 5 → 27), (3, 4, 5, 6 → ?). Find the missing centre number.","o":["9","86","43","18"],"w":["Divides the sum by 2.","Forgets to divide by 2.","Centre = (sum of squares of the outer numbers) ÷ 2: 30/2 = 15, 54/2 = 27, 86/2 = 43.","Adds the numbers only."],"a":2,"s":"Reasoning"},"q339":{"q":"How many squares are there in the figure?","o":["16","30","29","25"],"w":["Counts only the small squares.","1×1: 16, 2×2: 9, 3×3: 4, 4×4: 1 → 30.","Misses the outer square.","Misses the 2×2 squares partly."],"a":1,"f":"<svg viewBox=\"0 0 156 156\" width=\"156\" height=\"156\" role=\"img\" aria-label=\"4 by 4 grid\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><line x1=\"10\" y1=\"10\" x2=\"146\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"44\" x2=\"146\" y2=\"44\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"78\" x2=\"146\" y2=\"78\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"112\" x2=\"146\" y2=\"112\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"146\" x2=\"146\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"44\" y1=\"10\" x2=\"44\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"78\" y1=\"10\" x2=\"78\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"112\" y1=\"10\" x2=\"112\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"146\" y1=\"10\" x2=\"146\" y2=\"146\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>","s":"Reasoning"},"q340":{"q":"How many triangles are there in the figure?","o":["12","6","9","10"],"w":["Lines from the apex make 3 base parts → 6 triangles in the lower region, plus 6 in the upper region above the cross line = 12.","Counts only one region.","Misses some.","Misses some."],"a":0,"f":"<svg viewBox=\"0 0 260 200\" width=\"260\" height=\"200\" role=\"img\" aria-label=\"triangle divided by lines\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><polygon points=\"130,15 15,185 245,185\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"15\" x2=\"91.7\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"130\" y1=\"15\" x2=\"168.3\" y2=\"185\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"72.5\" y1=\"100.0\" x2=\"187.5\" y2=\"100.0\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg>","s":"Reasoning"},"q341":{"q":"Three positions of a die are shown. Which number is opposite 4?","o":["6","1","5","3"],"w":["6 appears next to 4.","1 appears next to 4.","5 appears next to 4.","4 is adjacent to 1, 5 (first), 2, 6 (second and third). The only number never seen with 4 is 3."],"a":3,"f":"<svg viewBox=\"0 0 450 140\" width=\"450\" height=\"140\" role=\"img\" aria-label=\"dice positions\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><polygon points=\"70,20 120,45 70,70 20,45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"20,45 70,70 70,130 20,105\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"70,70 120,45 120,105 70,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"70\" y=\"51\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">4<\/text><text x=\"45\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">1<\/text><text x=\"95\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">5<\/text><polygon points=\"220,20 270,45 220,70 170,45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"170,45 220,70 220,130 170,105\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"220,70 270,45 270,105 220,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"220\" y=\"51\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">4<\/text><text x=\"195\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">2<\/text><text x=\"245\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">1<\/text><polygon points=\"370,20 420,45 370,70 320,45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"320,45 370,70 370,130 320,105\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><polygon points=\"370,70 420,45 420,105 370,130\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"370\" y=\"51\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">6<\/text><text x=\"345\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">4<\/text><text x=\"395\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"currentColor\">2<\/text><\/svg>","s":"Reasoning"},"q342":{"q":"A cube is painted on all faces and cut into 64 identical small cubes. How many small cubes have no face painted?","o":["0","16","8","24"],"w":["Inner cubes exist when n > 2.","Arithmetic slip.","n = 4 → (n − 2)³ = 8.","That is the number with two faces painted, 12(n − 2)."],"a":2,"s":"Reasoning"},"q343":{"q":"Which option is the water image (reflection in water below the word)?","o":["<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"REGIT normal\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g ><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">REGIT<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"TIGER water\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(0,60) scale(1,-1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">TIGER<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"TIGER rot180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(200,60) scale(-1,-1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">TIGER<\/text><\/g><\/svg>","<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"TIGER mirror\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g transform=\"translate(200,0) scale(-1,1)\"><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">TIGER<\/text><\/g><\/svg>"],"w":["Only the letter order is reversed.","A water image flips top to bottom; left–right order stays.","That is rotated 180°.","That is a side-mirror image."],"a":1,"f":"<svg viewBox=\"0 0 200 60\" width=\"200\" height=\"60\" role=\"img\" aria-label=\"TIGER normal\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto\"><g ><text x=\"100.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"34\" font-family=\"Arial, sans-serif\" font-weight=\"700\" fill=\"currentColor\">TIGER<\/text><\/g><\/svg>","h":1,"s":"Reasoning"},"q344":{"q":"A person walks 250 m East, then 50 m North, then 300 m West, then 50 m South. How far is he from the start, and in which direction?","o":["50 m West","0 m","50 m East","100 m West"],"w":["East–West: 250 − 300 = 50 m West; North–South: 50 − 50 = 0 (asked in 2016).","Ignores the extra 50 m West.","Direction reversed.","Arithmetic slip."],"a":0,"s":"Reasoning"},"q345":{"q":"A goes 500 m straight from his house towards North, turns left and walks 1 km, turns left again and walks 2.5 km. Roughly where is he from his house?","o":["West, 1 km","North, 2 km","South-East, 2 km","South-West, about 2.2 km"],"w":["Ignores the North–South movement.","Wrong direction.","He turned left twice, so he is to the West.","Net: 2 km South and 1 km West → √(4 + 1) ≈ 2.24 km, South-West."],"a":3,"s":"Reasoning"},"q346":{"q":"At 6 PM, Rahul’s shadow falls to his left. Which direction is he facing?","o":["East","North","South","West"],"w":["Shadow would be in front.","Facing North, East would be on his right.","Evening sun in the West → shadow towards East. East is on his left → he faces South.","Shadow would be behind."],"a":2,"s":"Reasoning"},"q347":{"q":"Seven people A, B, C, D, E, F and G sit in a row facing North. D sits in the exact middle. A sits second to the left of D. G sits at one of the ends with B next to G. F sits immediately to the right of A. C sits somewhere to the right of E. Who sits at the extreme left end?","o":["G","E","C","A"],"w":["G is at the right end.","Order (left to right): E, A, F, D, C, B, G.","C is fifth.","A is second from the left."],"a":1,"s":"Reasoning"},"q348":{"q":"Seven people A, B, C, D, E, F and G sit in a row facing North. D sits in the exact middle. A sits second to the left of D. G sits at one of the ends with B next to G. F sits immediately to the right of A. C sits somewhere to the right of E. Who sits between D and B?","o":["C","G","F","E"],"w":["Order: E, A, F, D, C, B, G → C is between D and B.","G is at the right end.","F is between A and D.","E is at the left end."],"a":0,"s":"Reasoning"},"q349":{"q":"Seven people A, B, C, D, E, F and G sit in a row facing North. D sits in the exact middle. A sits second to the left of D. G sits at one of the ends with B next to G. F sits immediately to the right of A. C sits somewhere to the right of E. How many people sit between A and G?","o":["5","3","2","4"],"w":["Includes A or G.","Counts positions, not people.","Arithmetic slip.","A is 2nd and G is 7th → F, D, C, B sit between (4)."],"a":3,"s":"Reasoning"},"q350":{"q":"Eight friends P, Q, R, S, T, U, V, W sit around a circle facing the centre. S is opposite P. Q is immediately right of P and W is immediately left of P. U is opposite W. T is second to the right of S, and V sits next to T. Who sits opposite T?","o":["U","V","R","Q"],"w":["U is opposite W.","V is next to T.","Clockwise from P: P, W, T, V, S, U, R, Q. T and R are four seats apart.","Q sits next to P."],"a":2,"s":"Reasoning"},"q351":{"q":"Pointing to a man, a woman says, “He is the only son of my mother-in-law.” How is the man related to the woman?","o":["Brother","Husband","Brother-in-law","Father-in-law"],"w":["Her mother-in-law is her husband’s mother, not her own mother.","Her mother-in-law’s only son must be her husband.","A brother-in-law would be another son — but he is the only son.","Wrong generation."],"a":1,"s":"Reasoning"},"q352":{"q":"A is the only daughter of B. C is the husband of B. D is the father of C, and E is the wife of D. How is A related to E?","o":["Granddaughter","Daughter-in-law","Niece","Daughter"],"w":["B and C are A’s parents; D and E are C’s parents → A is E’s granddaughter (asked in 2022).","That would be B.","No sibling link.","E is A’s grandmother, not mother."],"a":0,"s":"Reasoning"},"q353":{"q":"A ranks 13th from the top and B ranks 17th from the bottom in a class. C is exactly 5 ranks below A and is in the middle of A and B. How many students are in the class?","o":["29","40","30","39"],"w":["Places B above C.","Forgets −1.","Arithmetic slip.","C = 18th from top. B is 5 below C = 23rd from top. B is 17th from bottom → total = 23 + 17 − 1 = 39 (asked in 2022)."],"a":3,"s":"Reasoning"},"q354":{"q":"Statements: Some pens are books. All books are tables. Conclusions: I. Some pens are tables. II. All tables are pens.","o":["Both follow","Only II follows","Only I follows","Neither follows"],"w":["II does not follow.","II is not supported.","Pens that are books are also tables → some pens are tables. II is not given.","I follows."],"a":2,"s":"Reasoning"},"q355":{"q":"Statement: The city corporation has decided to repair all roads before the monsoon. Assumptions: I. Roads may get damaged further in the rains if not repaired. II. The corporation has funds for the repairs.","o":["Only II is implicit","Both I and II are implicit","Only I is implicit","Neither is implicit"],"w":["The reason for repairing first is I.","A decision is taken only if it is useful (I) and possible (II).","A decision assumes it can be carried out.","Both are assumed."],"a":1,"s":"Reasoning"},"q356":{"q":"Should students be given grace marks in board exams? Arguments: I. Yes, it will help students who narrowly miss passing. II. No, it lowers the value of merit and examination standards.","o":["Both I and II are strong","Only I is strong","Only II is strong","Neither is strong"],"w":["Both give relevant, serious reasons on either side.","II is also a serious reason.","I is also a serious reason.","Both are relevant."],"a":0,"s":"Reasoning"},"q357":{"q":"Assertion (A): Nights are cooler on cloudless nights. Reason (R): Clouds absorb heat radiated from the Earth and send it back.","o":["Both A and R are true, and R explains A","Both true, but R does not explain A","A is true, R is false","A is false, R is true"],"w":["Without clouds, heat escapes; clouds trap it, so cloudy nights are warmer.","R is the direct cause.","R is true.","A is true."],"a":0,"s":"Reasoning"},"q358":{"q":"What is the captain’s age in a team of 11? I. The captain is 11 years older than the youngest player. II. The average age of the 10 players other than the captain is 27.3 years (and the team average is 28).","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Even I and II together are not sufficient"],"w":["Youngest player’s age is unknown.","II with the team average gives the captain: 11 × 28 − 10 × 27.3 = 308 − 273 = 35. I alone is not enough (asked in 2016).","II alone is enough.","II gives the answer."],"a":1,"s":"Reasoning"},"q359":{"q":"What is the area of the circle? I. Its circumference is 44 cm. II. Its diameter is 14 cm.","o":["Both I and II together are needed","Either I alone or II alone is sufficient","Even I and II together are not sufficient","I alone is sufficient"],"w":["Each alone is enough.","Each statement gives r = 7 cm.","Each alone is enough.","II alone is also enough."],"a":1,"s":"Reasoning"},"q360":{"q":"How many candidates did panel A interview? I. Three panels A, B, C interview 20 candidates a day on average. II. A interviewed 2 more than B and 1 more than C.","o":["I alone is sufficient","II alone is sufficient","Both I and II together are needed","Even I and II together are not sufficient"],"w":["No split between panels.","No total.","Total = 60. A + (A − 2) + (A − 1) = 60 → A = 21. Both needed (asked in 2016).","Together they work."],"a":2,"s":"Reasoning"},"q361":{"q":"Which diagram best shows the relation between Days, Weeks and Years?","o":["Three overlapping circles","Three separate circles","Two overlapping circles and one separate","Three concentric circles (Days inside Weeks inside Years)"],"w":["One is fully contained in the other.","They are related.","Wrong relation.","Days make weeks, weeks make years — each is contained in the next (asked in 2018)."],"a":3,"s":"Reasoning"},"q362":{"q":"The table shows how many students play each game. How many students play at least two games?","o":["15","21","18","37"], function topicStats(tid){
  const t = D.topics[tid], st = S.topics[tid] || {ans:{}};
  let done = 0, right = 0, wrong = 0;
  const qs = st.qs || t.qs;
  qs.forEach(id => { const a = st.ans[id]; if (a !== undefined && Q[id]) { done++; if (a === Q[id].a) right++; else wrong++; } });
  return {done, right, wrong, total: qs.length, score: right - 0.2*wrong};
}
function dayStats(day){
  let done = 0, total = 0;

}

      <div class="opts" role="radiogroup">${q.o.map((o, k) => `<button type="button" role="radio" aria-checked="${pending === k}" class="opt ${pending === k ? "sel" : ""}" data-o="${k}"><span class="n">${k + 1}</span><span>${optHTML(q, k)}</span></button>`).join("")}</div>`;
    $("#qarea").querySelectorAll(".opt").forEach(b => b.onclick = () => { pending = +b.dataset.o; drawQ(); });
    $("#prv").disabled = m.cur === 0;
    $("#qarea").scrollTop = 0;
  }
  function go(idx){ m.cur = Math.max(0, Math.min(199, idx)); pending = m.ans[MQ()[m.cur]]; save(); drawQ(); drawPal(); drawSecs(); }
  $("#snx").onclick = () => { const id = MQ()[m.cur]; if (pending !== undefined) m.ans[id] = pending; save(); go(m.cur === 199 ? 199 : m.cur + 1); };
  $("#mrk").onclick = () => { const id = MQ()[m.cur]; if (pending !== undefined) m.ans[id] = pending; m.mark[id] = 1; save(); go(m.cur === 199 ? 199 : m.cur + 1); };
  $("#clr").onclick = () => { const id = MQ()[m.cur]; delete m.ans[id]; delete m.mark[id]; pending = undefined; save(); drawQ(); drawPal(); drawSecs(); };
  $("#prv").onclick = () => go(m.cur - 1);
  $("#submit").onclick = () => confirmSubmit();
  function tick(){
    const left = m.start + DUR - Date.now();
    if (left <= 0) { clearInterval(timerH); finish(true); return; }
    const h = Math.floor(left / 3600000), mi = Math.floor(left / 60000) % 60, se = Math.floor(left / 1000) % 60;
    const el = $("#timer"); if (!el) return;
    el.textContent = `Time left ${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}:${String(se).padStart(2,"0")}`;
    el.classList.toggle("low", left < 10 * 60000);
  }
  clearInterval(timerH); timerH = setInterval(tick, 1000); tick();
  go(m.cur);
  function counts(){ let a = 0, mk = 0, nv = 0; MQ().forEach((id, j) => { if (m.ans[id] !== undefined) a++; if (m.mark[id]) mk++; if (!m.visit[id]) nv++; }); return {a, mk, nv}; }
  function confirmSubmit(){
    const rows = SX().map(s => { let an = 0, mk = 0, nv = 0; for (let j = s[1]; j < s[2]; j++) { const id = MQ()[j]; if (m.ans[id] !== undefined) an++; if (m.mark[id]) mk++; if (!m.visit[id]) nv++; } const tot = s[2] - s[1];
      return `<tr><td>${s[0]}</td><td>${tot}</td><td>${an}</td><td>${tot - an}</td><td>${mk}</td><td>${nv}</td></tr>`; }).join("");
    modal(`<h3>Submit the test?</h3><table class="sum"><tr><th>Section</th><th>Total</th><th>Answered</th><th>Not answered</th><th>Marked</th><th>Not visited</th></tr>${rows}</table>
      <p class="small muted">After submitting you cannot change any answer.</p>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="mno">No, go back</button><button type="button" class="btn danger" id="myes">Yes, submit</button></div>`);
    $("#mno").onclick = closeModal; $("#myes").onclick = () => { closeModal(); finish(false); };
  }
  function finish(auto){
    clearInterval(timerH);
    m.submitted = true; m.end = Math.min(Date.now(), m.start + DUR); m.auto = auto;
    m.result = score(); MQ().forEach(markSeen); save();
    root.innerHTML = ""; document.body.style.overflow = "";
    if (auto) modal(`<h3>Time is up</h3><p>Your 3 hours are over. The test has been submitted automatically.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn primary" id="mok">View result</button></div>`), $("#mok").onclick = () => { closeModal(); location.hash = "#mock"; mockResult(); };
    location.hash = "#mock"; mockResult();
  }
}
function score(){
  const m = S.mock, out = {sec:{}, gs:{}};
  let c = 0, w = 0;
  MQ().forEach(id => { const q = Q[id], a = m.ans[id]; const s = out.sec[q.s] = out.sec[q.s] || {t:0,c:0,w:0};
    s.t++; if (a !== undefined) { if (a === q.a) { s.c++; c++; } else { s.w++; w++; } }
    if (q.g) { const g = out.gs[q.g] = out.gs[q.g] || {t:0,c:0,w:0}; g.t++; if (a !== undefined) { if (a === q.a) g.c++; else g.w++; } } });
  out.c = c; out.w = w; out.u = 200 - c - w; out.net = c - 0.2 * w; return out;
}
function mockResult(){
  const m = S.mock, r = m.result || score();
  const used = Math.round(((m.end || Date.now()) - m.start) / 60000);
  const lines = [["OC (40%)", 80], ["BC (35%)", 70], ["SC/ST (30%)", 60]];
  app.innerHTML = `
  <div class="crumb"><a href="#home">Home</a> › Grand Mock › Result</div>
  <h2 class="sec" style="margin-top:4px">Grand Mock — Result</h2>
  <div class="panel">
    <div class="result-big"><div><div class="small muted">Your score</div><div class="score">${r.net.toFixed(2)}<span style="font-size:24px" class="muted"> / 200</span></div></div>
      <div class="scorebar"><span>Correct <b>${r.c}</b></span><span>Wrong <b>${r.w}</b> (−${(0.2 * r.w).toFixed(1)})</span><span>Not answered <b>${r.u}</b></span><span>Accuracy <b>${r.c + r.w ? Math.round(r.c / (r.c + r.w) * 100) : 0}%</b></span><span>Time used <b>${Math.floor(used / 60)}h ${used % 60}m</b>${m.auto ? " (auto-submitted)" : ""}</span></div></div>
    <p style="margin:14px 0 6px" class="small muted">Qualifying marks as reported for the 2026 notification (out of 200; confirm on tgprb.in):</p>
    <div class="row">${lines.map(l => `<span class="pass ${r.net >= l[1] ? "y" : "n"}">${l[0]}: ${l[1]} — ${r.net >= l[1] ? "cleared" : "short by " + (l[1] - r.net).toFixed(1)}</span>`).join("")}</div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h3>Section-wise</h3><table class="sum"><tr><th>Section</th><th>Qs</th><th>Correct</th><th>Wrong</th><th>Score</th></tr>
      ${SX().map(s => { const x = r.sec[s[0]]; return `<tr><td>${s[0]}</td><td>${x.t}</td><td>${x.c}</td><td>${x.w}</td><td>${(x.c - 0.2 * x.w).toFixed(1)}</td></tr>`; }).join("")}
      <tr><th>Total</th><th>200</th><th>${r.c}</th><th>${r.w}</th><th>${r.net.toFixed(1)}</th></tr></table></div>
    <div class="panel"><h3>General Studies by subject</h3><table class="sum"><tr><th>Subject</th><th>Qs</th><th>Correct</th><th>Wrong</th><th>Score</th></tr>
      ${Object.keys(r.gs).map(g => { const x = r.gs[g]; return `<tr><td>${g}</td><td>${x.t}</td><td>${x.c}</td><td>${x.w}</td><td>${(x.c - 0.2 * x.w).toFixed(1)}</td></tr>`; }).join("")}</table></div>
  </div>
  <h2 class="sec">Answer review</h2>
  <div class="filters" id="flt"><button type="button" class="on" data-f="all">All 200</button><button type="button" data-f="w">Wrong (${r.w})</button><button type="button" data-f="u">Not answered (${r.u})</button><button type="button" data-f="c">Correct (${r.c})</button>
    <button type="button" data-f="Arithmetic">Arithmetic</button><button type="button" data-f="Reasoning">Reasoning</button><button type="button" data-f="General Studies">General Studies</button></div>
  <div id="rvlist"></div>
  <div class="row" style="margin:16px 0"><button type="button" class="btn danger" id="reset">↻ Take a new Grand Mock — fresh 200 questions</button></div>`;
  function draw(f){
    $("#rvlist").innerHTML = MQ().map((id, j) => { const q = Q[id], a = m.ans[id]; const st = a === undefined ? "u" : a === q.a ? "c" : "w";
      if (!(f === "all" || f === st || f === q.s)) return "";
      return `<div class="rv"><div class="row" style="justify-content:space-between"><b>Q${j + 1}</b><span class="small muted">${q.s}${q.g ? " · " + q.g : ""}</span><span class="st ${st}">${st === "c" ? "Correct +1" : st === "w" ? "Wrong −0.20" : "Not answered 0"}</span></div>
        <div class="qtext" style="margin:8px 0">${esc(q.q)}</div>${q.f ? `<div class="fig">${q.f}</div>` : ""}
        <div class="opts">${q.o.map((o, k) => `<div class="opt ${k === q.a ? "right" : k === a ? "wrong" : ""}"><span class="n">${k + 1}</span><span>${optHTML(q, k)}</span></div>`).join("")}</div>
        ${explainHTML(q, a)}</div>`; }).join("") || "<p>No questions in this filter.</p>";
  }
  $("#flt").querySelectorAll("button").forEach(b => b.onclick = () => { $("#flt").querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); draw(b.dataset.f); });
  draw("all");
  $("#reset").onclick = () => { modal(`<h3>Start a new Grand Mock?</h3><p>Your current result will be cleared (wrong answers are kept on the Final revision card). A fresh set of 200 questions is generated: new Arithmetic and Reasoning questions every time, and General Studies questions you have seen least.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="rn">Cancel</button><button type="button" class="btn danger" id="ry">Reset</button></div>`);
    $("#rn").onclick = closeModal; $("#ry").onclick = () => { const mm = S.mock; if (mm && mm.ans) MQ().forEach(id => { const x = mm.ans[id]; if (x !== undefined && x !== Q[id].a) S.mist.unshift({id, a:x, from:"Grand Mock"}); }); S.mist = S.mist.slice(0, 150); S.mock = null; prune(); save(); closeModal(); mockLanding(); }; };
}

/* ---------- modal & router ---------- */
function modal(h){ $("#modalroot").innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`; const b = $("#modalroot").querySelector("button"); if (b) b.focus(); }
function closeModal(){ $("#modalroot").innerHTML = ""; }

  $("#wipe").onclick = () => { modal(`<h3>Reset all progress?</h3><p>This clears every answer and score saved on this device. Your exam date stays.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="wn">Cancel</button><button type="button" class="btn danger" id="wy">Reset</button></div>`);
    $("#wn").onclick = closeModal; $("#wy").onclick = () => { S = {topics:{}, mock:null, models:{}, exam:S.exam}; save(); closeModal(); home(); location.hash = "#home"; }; };

function route(){
  const h = (location.hash || "#home").slice(1);
  window.scrollTo(0, 0);
  if (S.mock && S.mock.start && !S.mock.submitted && (Date.now() > S.mock.start + DUR)) { S.mock.submitted = true; S.mock.end = S.mock.start + DUR; S.mock.auto = true; S.mock.result = score(); save(); }
  if (h === "mock") { if (S.mock && S.mock.start && !S.mock.submitted) { app.innerHTML = ""; runCBT(); } else mockLanding(); return; }
  const day = D.days.find(d => d.id === h);
  if (day) { if (day.kind === "study") dayView(day); else if (day.kind === "mock") { location.hash = "#mock"; } else if (day.kind === "rev") revView(); else examView(); return; }
  if (D.topics[h]) { topicView(h); return; }
  if (h === "about") { aboutView(); return; }
  home();
}
window.addEventListener("hashchange", route);
route();
})();
</script>
